<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Emberwing</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030709}
#flight{position:fixed;inset:0;display:block;width:100vw;height:100vh;border:0}
#missionMessage{position:fixed;z-index:21;top:82px;left:28px;display:grid;gap:5px;color:#eef2eb;opacity:0;transform:translateY(-4px);transition:opacity .28s ease,transform .28s ease;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.72)}
#missionMessage.show{opacity:1;transform:translateY(0)}#missionMessage .signal{display:none}#missionMessage div{display:grid;gap:5px}#missionMessage small{font:700 7px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;color:rgba(226,199,121,.72)}#missionMessage strong{font:500 11px ui-sans-serif,system-ui,-apple-system,sans-serif;letter-spacing:.01em}#missionMessage div span{display:none}
#controls{position:fixed;z-index:20;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:22px;padding:9px 15px;border:1px solid rgba(231,237,230,.12);border-radius:999px;background:rgba(5,12,15,.46);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:rgba(226,233,226,.43);font:600 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;white-space:nowrap;pointer-events:none}#controls kbd{margin-right:5px;color:rgba(245,246,239,.82);font:700 8px ui-monospace,SFMono-Regular,Menlo,monospace}
@media(pointer:coarse),(max-width:700px){#controls{display:none}#missionMessage{top:58px;left:16px}}
</style>
</head>
<body>
<iframe id="flight" src="v57.html?ui=61" title="Emberwing flight scenario" allow="autoplay; fullscreen"></iframe>
<div id="missionMessage" role="status"><span class="signal"></span><div><small>MISSION CONTROL</small><strong>Destroy the launch vehicle.</strong><span>Follow the valley north.</span></div></div>
<div id="controls"><span><kbd>ARROWS</kbd> FLY</span><span><kbd>SPACE</kbd> GUNS</span><span><kbd>X</kbd> MISSILE</span><span><kbd>SHIFT</kbd> TURBO</span></div>
<script>
const flight=document.querySelector('#flight');
flight.addEventListener('load',()=>{
 try{
  const doc=flight.contentDocument;
  const clean=doc.createElement('style');
  clean.textContent='#headingTape,#score,#coach,#realmCard{display:none!important}#mark::after{display:none!important}#mark{opacity:.72!important}#readout{opacity:.68!important}';
  doc.head.appendChild(clean);
  doc.getElementById('headingTape')?.remove();
  doc.getElementById('score')?.remove();
  doc.getElementById('coach')?.remove();
  const mark=doc.getElementById('mark');if(mark)mark.textContent='EW–01 / FIRST FLIGHT';
  doc.querySelector('#briefDeploy')?.click();
  const hint=doc.querySelector('#hint');if(hint)hint.style.display='none';
  flight.focus();
  setTimeout(()=>document.querySelector('#missionMessage').classList.add('show'),400);
  setTimeout(()=>document.querySelector('#missionMessage').classList.remove('show'),2400);
 }catch(e){}
});
</script>
</body>
</html>
