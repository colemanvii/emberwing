<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EMBERWING // COMBAT LAB 01</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#eee}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 1px 5px #0008;letter-spacing:.12em}
#top{position:absolute;left:24px;right:24px;top:20px;display:flex;justify-content:space-between;gap:20px;font-size:12px;color:#d8d3c8}
#left{display:grid;gap:7px}.muted{opacity:.55}
#status{font-size:13px;color:#f0b37a}
#reticle{position:absolute;left:50%;top:46%;width:34px;height:34px;transform:translate(-50%,-50%)}
#reticle:before,#reticle:after{content:"";position:absolute;inset:0;border:1px solid #e7e1d6;border-radius:50%;opacity:.5}
#reticle:after{inset:12px;border-radius:0;border-width:1px}
#lock{position:absolute;width:72px;height:72px;border:1px solid #ffb45e;transform:translate(-50%,-50%);opacity:0;transition:opacity .08s}
#lock.on{opacity:.95}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#brief{position:absolute;left:26px;bottom:24px;max-width:520px}
#brief h1{font-family:Arial,Helvetica,sans-serif;font-size:34px;line-height:.95;margin:0 0 8px;letter-spacing:.04em}
#brief p{margin:4px 0;font-size:11px;color:#b7b1a7}
#brief .go{color:#eee}
#damage{position:absolute;right:24px;bottom:24px;font-size:11px;text-align:right}
#centerMsg{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:13px;color:#ffbd73;opacity:0;transition:opacity .2s}
</style>
</head>
<body>
<div id="hud">
  <div id="top">
    <div id="left"><div>EMBERWING // COMBAT LAB 01</div><div class="muted">OPEN COMBAT ARENA</div><div id="status">FREE FLIGHT</div></div>
    <div id="stats">00:00.0 · KILLS 0 · TARGETS 4</div>
  </div>
  <div id="reticle"></div><div id="lock"></div><div id="flash"></div><div id="centerMsg"></div>
  <div id="brief"><h1>FIGHT THE SKY.</h1><p class="go">ARROWS FLY · SPACE GUNS · HOLD X / RELEASE MISSILE · SHIFT BOOST</p><p>NO ROUTE. NO STEALTH. TURN AROUND. CHASE SOMETHING.</p></div>
  <div id="damage">HULL █████</div>
</div>
<script type="module" src="./src/combat-lab.js"></script>
</body>
</html>
