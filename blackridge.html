<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emberwing — Black Ridge</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050811;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 12px #000}#veil{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,transparent 0 38%,rgba(0,3,9,.14) 70%,rgba(0,2,7,.48) 100%)}#mark{position:absolute;top:20px;left:22px;font-size:10px;letter-spacing:.24em;font-weight:800;color:#dcecff;opacity:.86}#phase{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.22em;color:#9fc6ec}#readout{position:absolute;top:20px;right:22px;font-size:9px;letter-spacing:.14em;color:#dcecff}#objective{position:absolute;top:13%;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.22em;font-weight:900;color:#edf7ff;opacity:.72}#target{position:absolute;width:46px;height:46px;opacity:0;transform:translate(-50%,-50%) rotate(45deg);border:1.5px solid #b8dcff;filter:drop-shadow(0 0 10px #173753);transition:.08s}#target:after{content:attr(data-range);position:absolute;left:34px;top:-7px;transform:rotate(-45deg);font-size:10px;font-weight:900;letter-spacing:.1em;color:#e4f3ff;white-space:nowrap}#target.track{border-color:#ffd46d;box-shadow:0 0 24px #f0a63388}#target.lock{border-color:#ff6d52;box-shadow:0 0 40px #ff4b2aaa;animation:lock .35s ease-in-out infinite alternate}@keyframes lock{to{transform:translate(-50%,-50%) rotate(45deg) scale(1.08)}}#boss{position:absolute;left:50%;top:18%;transform:translateX(-50%);display:none;width:300px;text-align:center}#bossName{font-size:10px;letter-spacing:.24em;color:#ffb69b;font-weight:900}#bossBar{height:4px;margin-top:8px;background:#ffffff18;overflow:hidden}#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#ff5a3b,#ffd070);box-shadow:0 0 16px #ff6c3b88;transition:.18s}#coach{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);padding:9px 14px;border:1px solid #9fc6ec44;background:#08111dcc;backdrop-filter:blur(8px);font-size:9px;letter-spacing:.1em;color:#dcecff;min-width:430px;text-align:center}#coach strong{display:block;font-size:10px;letter-spacing:.14em}.lockbar{height:3px;width:220px;margin:8px auto 0;background:#ffffff1a;overflow:hidden}.lockfill{height:100%;width:0;background:#ffbf56;box-shadow:0 0 12px #ff9d32}#flash{position:absolute;inset:0;opacity:0;background:white;mix-blend-mode:screen;transition:opacity .16s}#damage{position:absolute;inset:0;opacity:0;background:radial-gradient(circle,transparent 35%,rgba(255,45,25,.38));transition:.15s}#complete,#crash{position:absolute;inset:0;display:none;place-items:center;background:#02050be8;text-align:center;font-size:18px;font-weight:900;letter-spacing:.22em}#complete small,#crash small{display:block;margin-top:12px;font-size:9px;line-height:1.8;letter-spacing:.13em;opacity:.7}.accent{color:#ff9d64}
</style></head><body>
<div id="hud"><div id="veil"></div><div id="flash"></div><div id="damage"></div><div id="mark">EMBERWING / BLACK RIDGE</div><div id="phase">MISSION III · STORM PASS</div><div id="readout"></div><div id="objective">ENTER THE RIDGE</div><div id="target" data-range="CONTACT"></div><div id="boss"><div id="bossName">ACE WRAITH</div><div id="bossBar"><div id="bossFill"></div></div></div><div id="coach"><strong>ARROWS FLY · SPACE CANNON · HOLD X LOCK / RELEASE FIRE</strong><span id="coachSub">SURVIVE THE PASS. BREAK THE WRAITH.</span><div class="lockbar"><div class="lockfill" id="lockfill"></div></div></div><div id="crash">AIRFRAME LOST<small>PRESS R TO REDEPLOY</small></div><div id="complete">BLACK RIDGE CLEAR<small>ACE WRAITH DESTROYED<br><span class="accent">PRESS ANY KEY TO FLY AGAIN</span></small></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene(),haze=new THREE.Color(0x070c16);scene.background=haze;scene.fog=new THREE.FogExp2(haze,.0021);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,2800),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.86;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x7594ba,0x050609,.72));const moon=new THREE.DirectionalLight(0x8ebeff,2.15);moon.position.set(-400,600,-500);scene.add(moon);const lightning=new THREE.DirectionalLight(0xd8ecff,0);lightning.position.set(300,700,200);scene.add(lightning);
const sky=new THREE.Mesh(new THREE.SphereGeometry(2400,24,14),new THREE.MeshBasicMaterial({color:0x0b1222,side:THREE.BackSide,fog:false}));scene.add(sky);
function th(x,z){const broad=Math.sin(x*.004)*46+Math.cos(z*.0031)*38;const ridge=Math.pow(Math.abs(Math.sin((x+z)*.006)),2.8)*148;const cut=Math.pow(Math.abs(Math.sin((x-z)*.0033)),1.8)*62;return broad+ridge+cut-105}
const geo=new THREE.PlaneGeometry(3400,3400,150,150);geo.rotateX(-Math.PI/2);const pos=geo.attributes.position,col=new Float32Array(pos.count*3),tmp=new THREE.Color();for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i),y=th(x,z);pos.setY(i,y);const n=THREE.MathUtils.clamp((y+120)/220,0,1);tmp.set(0x111a26).lerp(new THREE.Color(0x39485b),n);if(n>.7)tmp.lerp(new THREE.Color(0x8ca1b5),(n-.7)*1.7);col[i*3]=tmp.r;col[i*3+1]=tmp.g;col[i*3+2]=tmp.b}geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.computeVertexNormals();scene.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,metalness:.02})));
const ridgeMat=new THREE.MeshStandardMaterial({color:0x202b39,roughness:1,flatShading:true});for(let i=0;i<42;i++){const r=70+Math.random()*120,h=160+Math.random()*260,m=new THREE.Mesh(new THREE.ConeGeometry(r,h,6+Math.floor(Math.random()*3)),ridgeMat);const a=Math.random()*Math.PI*2,d=650+Math.random()*900;m.position.set(Math.cos(a)*d,th(Math.cos(a)*d,Math.sin(a)*d)+h*.42,Math.sin(a)*d);m.rotation.y=Math.random()*Math.PI;scene.add(m)}
const rainCount=900,rainGeo=new THREE.BufferGeometry(),rainPos=new Float32Array(rainCount*6);for(let i=0;i<rainCount;i++){const x=(Math.random()-.5)*1200,y=Math.random()*700,z=(Math.random()-.5)*1200;rainPos[i*6]=x;rainPos[i*6+1]=y;rainPos[i*6+2]=z;rainPos[i*6+3]=x-7;rainPos[i*6+4]=y-28;rainPos[i*6+5]=z+12}rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));const rain=new THREE.LineSegments(rainGeo,new THREE.LineBasicMaterial({color:0x8db7db,transparent:true,opacity:.24}));scene.add(rain);
function fighter(color=0x8c99a6,scale=1){const g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color,roughness:.46,metalness:.45});const body=new THREE.Mesh(new THREE.ConeGeometry(1.35,8,8),mat);body.rotation.x=-Math.PI/2;g.add(body);const wing=new THREE.Mesh(new THREE.BoxGeometry(10,0.35,2.25),mat);wing.position.z=.7;g.add(wing);const tail=new THREE.Mesh(new THREE.BoxGeometry(4.1,.28,1.15),mat);tail.position.z=3;g.add(tail);const fin=new THREE.Mesh(new THREE.BoxGeometry(.28,2,1.7),mat);fin.position.set(0,1,2.7);g.add(fin);g.scale.setScalar(scale);return g}
const ship=fighter(0x9faab4,1.08);scene.add(ship);ship.position.set(0,95,520);ship.rotation.y=Math.PI;
const enemies=[];function spawnEnemy(name,hp,dist,side,speed,color=0xa84d43,scale=1){const e=fighter(color,scale);e.userData={name,hp,maxHp:hp,speed,phase:Math.random()*6.28,alive:true,fire:1.8+Math.random()*1.8,boss:hp>2};scene.add(e);e.position.set(side,135+Math.random()*90,ship.position.z-dist);enemies.push(e);return e}
spawnEnemy('RAIDER ONE',1,520,-190,74);spawnEnemy('RAIDER TWO',1,700,220,80);spawnEnemy('RAIDER THREE',2,900,-90,84,0xbe5b4c,1.05);const wraith=spawnEnemy('ACE WRAITH',6,1250,40,96,0x521d22,1.18);wraith.visible=false;
const bullets=[],enemyShots=[],missiles=[];const bulletMat=new THREE.MeshBasicMaterial({color:0xffd37c}),enemyMat=new THREE.MeshBasicMaterial({color:0xff5a44}),missileMat=new THREE.MeshBasicMaterial({color:0xe8f2ff});const sphere=new THREE.SphereGeometry(.42,5,5);
const keys={};let yaw=0,pitch=0,speed=92,hp=4,kills=0,lock=0,locked=false,dead=false,done=false,lastShot=0,stormT=0,wraithLive=false,impactT=0;
const objective=document.getElementById('objective'),readout=document.getElementById('readout'),target=document.getElementById('target'),lockfill=document.getElementById('lockfill'),flash=document.getElementById('flash'),damage=document.getElementById('damage'),boss=document.getElementById('boss'),bossFill=document.getElementById('bossFill'),crash=document.getElementById('crash'),complete=document.getElementById('complete');
function forward(obj=ship){return new THREE.Vector3(0,0,-1).applyQuaternion(obj.quaternion).normalize()}
function nearest(){let best=null,bd=1e9;for(const e of enemies){if(!e.userData.alive||!e.visible)continue;const d=ship.position.distanceTo(e.position);if(d<bd){best=e;bd=d}}return best}
function burstFlash(v=.28){flash.style.opacity=v;setTimeout(()=>flash.style.opacity=0,90)}function hurt(){if(dead||done)return;hp--;damage.style.opacity=.7;setTimeout(()=>damage.style.opacity=0,130);if(hp<=0){dead=true;crash.style.display='grid'}}
function gun(){const now=performance.now();if(now-lastShot<85||dead||done)return;lastShot=now;for(const s of [-.75,.75]){const b=new THREE.Mesh(sphere,bulletMat);b.position.copy(ship.position).add(new THREE.Vector3(s,-.1,-3).applyQuaternion(ship.quaternion));b.userData={v:forward().multiplyScalar(320),life:2};scene.add(b);bullets.push(b)}burstFlash(.08)}
function fireMissile(t){if(!t||!locked||dead||done)return;const m=new THREE.Mesh(new THREE.CylinderGeometry(.18,.28,2.8,6),missileMat);m.rotation.x=Math.PI/2;m.position.copy(ship.position).add(forward().multiplyScalar(4));m.userData={target:t,v:forward().multiplyScalar(120),life:6};scene.add(m);missiles.push(m);lock=0;locked=false}
function hitEnemy(e,damageAmt=1){if(!e.userData.alive)return;e.userData.hp-=damageAmt;burstFlash(.22);if(e.userData.boss)bossFill.style.width=(e.userData.hp/e.userData.maxHp*100)+'%';if(e.userData.hp<=0){e.userData.alive=false;e.visible=false;kills++;objective.textContent=e.userData.boss?'WRAITH DOWN':'SPLASH';if(e.userData.boss){done=true;setTimeout(()=>complete.style.display='grid',900)}}}
function updateShip(dt){if(dead||done)return;impactT=Math.max(0,impactT-dt);const turn=1.12,climb=.92;if(keys.ArrowLeft)yaw+=turn*dt;if(keys.ArrowRight)yaw-=turn*dt;if(keys.ArrowUp)pitch+=climb*dt;if(keys.ArrowDown)pitch-=climb*dt;pitch=THREE.MathUtils.clamp(pitch,-.55,.55);yaw*=.996;pitch*=.985;ship.quaternion.setFromEuler(new THREE.Euler(pitch,yaw,0,'YXZ'));const cruise=keys.ShiftLeft||keys.ShiftRight?132:96;speed=impactT>0?cruise*(.72+.28*(1-impactT/.85)):cruise;ship.position.addScaledVector(forward(),speed*dt);const floor=th(ship.position.x,ship.position.z)+18;if(ship.position.y<floor){if(impactT<=0){hurt();impactT=.85;pitch=Math.max(pitch,.24);objective.textContent='RIDGE STRIKE';burstFlash(.34)}ship.position.y=floor+28}else ship.position.y=Math.max(ship.position.y,floor);camera.position.lerp(ship.position.clone().add(new THREE.Vector3(0,5,18).applyQuaternion(ship.quaternion)),.08);camera.lookAt(ship.position.clone().add(forward().multiplyScalar(70)));rain.position.copy(ship.position);}
function updateEnemies(dt){for(const e of enemies){if(!e.userData.alive||!e.visible)continue;const toShip=ship.position.clone().sub(e.position),d=toShip.length();const desired=toShip.normalize();e.userData.phase+=dt*(e.userData.boss?2.9:2.1);desired.x+=Math.sin(e.userData.phase)*(.28+(e.userData.boss?.25:.12));desired.y+=Math.sin(e.userData.phase*1.7)*.11;const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,-1),desired.normalize());e.quaternion.slerp(q,Math.min(1,dt*(e.userData.boss?2.8:2)));e.position.addScaledVector(forward(e),e.userData.speed*dt);const floor=th(e.position.x,e.position.z)+24;e.position.y=Math.max(e.position.y,floor);e.userData.fire-=dt;if(d<520&&e.userData.fire<=0){e.userData.fire=e.userData.boss?.7:1.5+Math.random()*1.2;const s=new THREE.Mesh(sphere,enemyMat);s.position.copy(e.position);s.userData={v:ship.position.clone().sub(e.position).normalize().multiplyScalar(e.userData.boss?190:155),life:4};scene.add(s);enemyShots.push(s)}}
}
function updateWeapons(dt){for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.position.addScaledVector(b.userData.v,dt);b.userData.life-=dt;let gone=b.userData.life<=0;for(const e of enemies){if(e.userData.alive&&e.visible&&b.position.distanceTo(e.position)<9){hitEnemy(e,1);gone=true;break}}if(gone){scene.remove(b);bullets.splice(i,1)}}for(let i=enemyShots.length-1;i>=0;i--){const s=enemyShots[i];s.position.addScaledVector(s.userData.v,dt);s.userData.life-=dt;let gone=s.userData.life<=0;if(s.position.distanceTo(ship.position)<6){hurt();gone=true}if(gone){scene.remove(s);enemyShots.splice(i,1)}}for(let i=missiles.length-1;i>=0;i--){const m=missiles[i],t=m.userData.target;m.userData.life-=dt;if(t?.userData.alive){const want=t.position.clone().sub(m.position).normalize().multiplyScalar(190);m.userData.v.lerp(want,.09);m.lookAt(t.position)}m.position.addScaledVector(m.userData.v,dt);let gone=m.userData.life<=0||!t?.userData.alive;if(t?.userData.alive&&m.position.distanceTo(t.position)<10){hitEnemy(t,t.userData.boss?2:3);gone=true}if(gone){scene.remove(m);missiles.splice(i,1)}}}
function updateTarget(dt){const e=nearest();if(!e){target.style.opacity=0;lock=0;locked=false;return}const p=e.position.clone().project(camera),on=p.z<1&&Math.abs(p.x)<1.1&&Math.abs(p.y)<1.1;if(on){target.style.opacity=1;target.style.left=((p.x*.5+.5)*innerWidth)+'px';target.style.top=((-p.y*.5+.5)*innerHeight)+'px'}else target.style.opacity=0;const d=ship.position.distanceTo(e.position),ang=forward().angleTo(e.position.clone().sub(ship.position).normalize());const tracking=d<620&&ang<.23;if(keys.KeyX&&tracking){lock=Math.min(1,lock+dt*1.05)}else lock=Math.max(0,lock-dt*1.9);locked=lock>=.98;lockfill.style.width=(lock*100)+'%';target.className=locked?'lock':tracking?'track':'';target.dataset.range=Math.round(d)+'M · '+e.userData.name;readout.textContent='AIRFRAME '+hp+'/4 · CONTACTS '+enemies.filter(x=>x.userData.alive&&x.visible).length;if(kills>=3&&!wraithLive){wraithLive=true;wraith.visible=true;boss.style.display='block';objective.textContent='ACE WRAITH INBOUND'}if(wraithLive&&!done&&wraith.userData.alive)objective.textContent=locked?'WRAITH LOCKED':'BREAK THE WRAITH'}
function updateStorm(dt){stormT-=dt;if(stormT<=0){stormT=3+Math.random()*7;if(Math.random()<.68){lightning.intensity=12+Math.random()*10;burstFlash(.5);setTimeout(()=>lightning.intensity=0,70);setTimeout(()=>{lightning.intensity=4;setTimeout(()=>lightning.intensity=0,50)},130)}}const a=rain.geometry.attributes.position.array;for(let i=0;i<rainCount;i++){a[i*6+1]-=dt*320;a[i*6+4]-=dt*320;if(a[i*6+1]<-80){const y=500+Math.random()*250;a[i*6+1]=y;a[i*6+4]=y-28}}rain.geometry.attributes.position.needsUpdate=true}
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();gun()}if(e.code==='KeyR'&&dead)location.reload();if(done)location.reload()});addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='KeyX'&&locked)fireMissile(nearest())});
let last=performance.now();function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(keys.Space)gun();updateShip(dt);updateEnemies(dt);updateWeapons(dt);updateTarget(dt);updateStorm(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
