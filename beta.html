<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emberwing — Dogfight Beta</title><style>*{box-sizing:border-box}html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#120707;border:0}#status{position:fixed;inset:0;display:grid;place-items:center;color:#fff1d0;font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;background:#120707}</style></head><body><div id="status">EMBERWING / LOADING DOGFIGHT BETA</div><iframe id="game" title="Emberwing Dogfight Beta" allow="autoplay; fullscreen"></iframe><script>(async()=>{const status=document.getElementById('status'),frame=document.getElementById('game'),res=await fetch('./index.html?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('Could not load main build');let html=await res.text();const tailOld="if((role==='CLIMBER'||role==='ACE')&&playerBehind&&enemyCounter<=0){enemyTailTimer+=dt;if(enemyTailTimer>(role==='ACE'?.75:1.05)){enemyCounter=role==='ACE'?1.45:1.15;enemyTailTimer=0}}",tailNew="if((role==='SKIMMER'||role==='CLIMBER'||role==='ACE')&&playerBehind&&enemyCounter<=0){enemyTailTimer+=dt;if(enemyTailTimer>(role==='ACE'?.75:role==='CLIMBER'?1.05:1.6)){enemyCounter=role==='ACE'?1.45:role==='CLIMBER'?1.15:.8;enemyTailTimer=0}}",moveOld="if(enemyCounter>0){const breakSide=Math.sin(enemyTime*3.0)>=0?1:-1;if(role==='CLIMBER'){const vertical=Math.sin(enemyTime*2.8)*.34;intent.copy(enemyForward).addScaledVector(r,breakSide*.24).addScaledVector(worldUp,vertical+.08).normalize()}else{intent.copy(enemyForward).lerp(toPlayerDir,.36).addScaledVector(r,breakSide*.28).addScaledVector(worldUp,Math.sin(enemyTime*2.6)*.16).normalize()}}",moveNew="if(enemyCounter>0){const breakSide=Math.sin(enemyTime*3.0)>=0?1:-1;if(role==='SKIMMER'){intent.copy(enemyForward).addScaledVector(r,breakSide*.38).addScaledVector(worldUp,-.025).normalize()}else if(role==='CLIMBER'){const vertical=Math.sin(enemyTime*2.8)*.34;intent.copy(enemyForward).addScaledVector(r,breakSide*.24).addScaledVector(worldUp,vertical+.08).normalize()}else{intent.copy(enemyForward).lerp(toPlayerDir,.36).addScaledVector(r,breakSide*.28).addScaledVector(worldUp,Math.sin(enemyTime*2.6)*.16).normalize()}}";if(!html.includes(tailOld)||!html.includes(moveOld))throw new Error('Main changed; beta patch refused to guess');html=html.replace(tailOld,tailNew).replace(moveOld,moveNew);frame.srcdoc=html;frame.addEventListener('load',()=>status.remove(),{once:true})})().catch(err=>{document.getElementById('status').textContent='BETA PATCH FAILED — '+err.message})</script></body></html>
