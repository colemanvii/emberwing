*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a66d5b;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none;overscroll-behavior:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 10px #230d0bcc}#hud:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 39%,rgba(255,195,120,.025),transparent 38%,rgba(18,6,10,.22) 100%)}#brand{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;font-size:8px;letter-spacing:.22em;opacity:.8}#score{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.18em;opacity:.75}#data{position:absolute;top:max(12px,env(safe-area-inset-top));right:14px;font-size:8px;letter-spacing:.1em;opacity:.8}#ret{position:absolute;left:50%;top:40%;width:30px;height:30px;transform:translate(-50%,-50%);border:1px solid #fff0b0;border-radius:50%;box-shadow:0 0 15px #ffb52b55}#ret:before,#ret:after{content:"";position:absolute;background:#fff0b0}#ret:before{width:46px;height:1px;left:-9px;top:14px}#ret:after{height:46px;width:1px;top:-9px;left:14px}#ring{position:absolute;left:50%;top:40%;width:260px;height:260px;transform:translate(-50%,-50%);border:1px solid #fff0b02f;border-radius:50%;transition:.08s}#ring.track{border-color:#ffbd45aa;box-shadow:0 0 28px #ff9b3144}#ring.lock{border-color:#ff6b44dd;box-shadow:0 0 46px #ff4b2477,inset 0 0 30px #ff4b2418}#target{position:absolute;width:40px;height:40px;transform:translate(-50%,-50%) rotate(45deg);border:1.5px solid #fff4cf;filter:drop-shadow(0 0 8px #180704aa);opacity:0}#target:after{content:attr(data-r);position:absolute;left:28px;top:-5px;transform:rotate(-45deg);font-size:9px;font-weight:800;white-space:nowrap;color:#fff5d0}#target.track{border-color:#ffbd45}#target.lock{border-color:#ff6942;box-shadow:0 0 36px #ff4b24dd;animation:mobileLock </style></head><body><div id="hud"><div id="brand">EMBERWING / MOBILE</div><div id="score">SPLASH 00</div><div id="data"></div><div id="ring"></div><div id="ret"></div><div id="target" data-r=""></div><div id="coach"><b id="ct">DRAG TO STEER</b><small id="cs">HOLD BOOST TO CLOSE · HOLD FIRE FOR GUNS</small></div><div id="crash">IMPACT<small>TAP RESET</small></div></div><div id="controls"><div id="steer"><div id="ghost"></div></div><div id="boost" class="btn">BOOST</div><div id="missile" class="btn">MISSILE</div><div id="fire" class="btn">FIRE</div><div id="reset" class="btn">RESET</div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,2500),R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio,1.35));R.setSize(innerWidth,innerHeight);R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.16;document.body.prepend(R.domElement);const haze=new THREE.Color(0xc88a70);S.background=haze;S.fog=new THREE.FogExp2(haze,.0009);S.add(new THREE.HemisphereLight(0xffdec5,0x39252b,2.62));const dl=new THREE.DirectionalLight(0xffc98c,5.05);dl.position.set(-300,420,240);S.add(dl);const sky=new THREE.Mesh(new THREE.SphereGeometry(2100,18,10),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,vertexShader:'varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'varying vec3 d;void main(){float h=d.y;vec3 a=vec3(.16,.12,.24),b=vec3(.83,.51,.39),c=vec3(.97,.54,.29);vec3 x=mix(b,a,smoothstep(-.02,.7,h));x=mix(c,x,smoothstep(-.3,.08,h));gl_FragColor=vec4(x,1.0);}'}));S.add(sky);
const up=new THREE.Vector3(0,1,0),fwd=new THREE.Vector3(),right=new THREE.Vector3();function H(x,z){return Math.sin(x*.005)*17+Math.cos(z*.006)*15+Math.sin((x+z)*.002)*18+Math.abs(Math.sin(x*.01))*20-46}const gg=new THREE.PlaneGeometry(3200,3200,110,110);gg.rotateX(-Math.PI/2);const gp=gg.attributes.position,gc=new Float32Array(gp.count*3);gg.setAttribute('color',new THREE.BufferAttribute(gc,3));const lo=new THREE.Color(0x63383a),mid=new THREE.Color(0xaa5747),hi=new THREE.Color(0xe0a06d),tmp=new THREE.Color();let gx=0,gz=0;const ground=new THREE.Mesh(gg,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1}));S.add(ground);function rebuild(x,z){gx=x;gz=z;for(let i=0;i<gp.count;i++){let wx=gp.getX(i)+x,wz=gp.getZ(i)+z,y=H(wx,wz),n=THREE.MathUtils.clamp((y+80)/110,0,1);gp.setY(i,y);tmp.copy(lo).lerp(mid,Math.min(1,n*1.5)).lerp(hi,Math.max(0,(n-.55)*1.7));gc[i*3]=tmp.r;gc[i*3+1]=tmp.g;gc[i*3+2]=tmp.b}gp.needsUpdate=true;gg.attributes.color.needsUpdate=true;gg.computeVertexNormals();ground.position.set(x,0,z)}rebuild(0,0);
function shipMesh(enemy=false){const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:enemy?0x141920:0x4b5052,metalness:.45,roughness:.38}),w=new THREE.MeshStandardMaterial({color:enemy?0x202934:0x737573,metalness:.35,roughness:.45});const wing=new THREE.Mesh(new THREE.BoxGeometry(enemy?8:16,.28,5),w);g.add(wing);const body=new THREE.Mesh(new THREE.CylinderGeometry(enemy?.7:1.1,enemy?1:1.45,enemy?7:10,8),m);body.rotation.x=Math.PI/2;g.add(body);const nose=new THREE.Mesh(new THREE.ConeGeometry(enemy?.75:1.15,enemy?3:4,8),m);nose.rotation.x=-Math.PI/2;nose.position.z=enemy?-4.8:-7;nose.position.y=.05;g.add(nose);for(const x of(enemy?[-1.5,1.5]:[-5,-1.7,1.7,5])){const e=new THREE.Mesh(new THREE.SphereGeometry(enemy?.25:.38,7,5),new THREE.MeshBasicMaterial({color:enemy?0x70d7ff:0xff8338}));e.position.set(x,0,3.6);g.add(e)}return g}const player=shipMesh(),bandit=shipMesh(true);S.add(player,bandit);
const obs=[];for(let i=0;i<85;i++){const h=8+Math.random()*48,r=5+Math.random()*18,m=new THREE.Mesh(i%5?new THREE.DodecahedronGeometry(1):new THREE.CylinderGeometry(r*.6,r,h,7),new THREE.MeshStandardMaterial({color:i%5?0x70433e:0xc8895e,roughness:1}));if(i%5)m.scale.set(r,h,r*.8);m.userData.r=r+4;m.userData.h=h;S.add(m);obs.push(m)}function head(){fwd.set(0,0,-1).applyQuaternion(player.quaternion);fwd.y=0;return fwd.lengthSq()?fwd.normalize():fwd.set(0,0,-1)}function placeObs(m){const f=head().clone(),r=right.crossVectors(f,up).normalize(),a=120+Math.random()*1200,s=(Math.random()-.5)*1200,x=player.position.x+f.x*a+r.x*s,z=player.position.z+f.z*a+r.z*s;m.position.set(x,H(x,z)+m.userData.h*.55,z)}function resetObs(){obs.forEach(placeObs)}
const ring=document.getElementById('ring'),ret=document.getElementById('ret'),tg=document.getElementById('target'),ct=document.getElementById('ct'),cs=document.getElementById('cs'),data=document.getElementById('data'),score=document.getElementById('score'),crash=document.getElementById('crash');let pitch=0,roll=0,boost=false,firing=false,speed=122,burn=0,dead=false,kills=0,hp=3,lock=0,lockT=0,lastRange=0,rangeFt=0,closure=0,enemyVel=new THREE.Vector3(),enemyLast=new THREE.Vector3(),missile=null,gunT=0,audioCtx=null,lockOsc=null,lockGain=null;function audio(){if(!audioCtx){audioCtx=new AudioContext;lockOsc=audioCtx.createOscillator();lockGain=audioCtx.createGain();lockOsc.frequency.value=950;lockGain.gain.value=0;lockOsc.connect(lockGain).connect(audioCtx.destination);lockOsc.start()}if(audioCtx.state==='suspended')audioCtx.resume()}function beep(f=700,d=.05,g=.025){if(!audioCtx)return;let o=audioCtx.createOscillator(),a=audioCtx.createGain(),t=audioCtx.currentTime;o.type='square';o.frequency.value=f;a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(audioCtx.destination);o.start(t);o.stop(t+d)}function spawn(){hp=kills?5:3;const f=head().clone(),r=right.crossVectors(f,up).normalize(),d=kills?260:170,s=kills?(Math.random()>.5?100:-100):12;bandit.position.copy(player.position).addScaledVector(f,d).addScaledVector(r,s);bandit.position.y=Math.max(player.position.y+10,H(bandit.position.x,bandit.position.z)+42);bandit.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1),f);enemyLast.copy(bandit.position);lastRange=bandit.position.distanceTo(player.position);rangeFt=lastRange*6;bandit.visible=true;lock=lockT=0}
function explode(){const ep=bandit.position.clone();bandit.visible=false;kills++;score.textContent='SPLASH '+String(kills).padStart(2,'0');beep(180,.16,.055);for(let i=0;i<16;i++){const q=new THREE.Mesh(new THREE.SphereGeometry(.18+Math.random()*.35,5,4),new THREE.MeshBasicMaterial({color:i%3?0xff6a2a:0xffffc2,transparent:true,opacity:.9}));q.position.copy(ep).add(new THREE.Vector3((Math.random()-.5)*7,(Math.random()-.5)*7,(Math.random()-.5)*7));S.add(q);setTimeout(()=>S.remove(q),320+Math.random()*320)}setTimeout(spawn,780)}function hit(){hp--;beep(230,.038,.034);tg.animate([{filter:'drop-shadow(0 0 8px #fff2bbaa)'},{filter:'drop-shadow(0 0 28px #ff6a2a)'},{filter:'drop-shadow(0 0 8px #180704aa)'}],{duration:130});if(hp<=0)explode()}function geom(){if(!bandit.visible)return null;const p=bandit.position.clone().project(C),on=p.z>-1&&p.z<1&&Math.abs(p.x)<1.08&&Math.abs(p.y)<1.08;if(!on)return{on:false,d:999,dist:bandit.position.distanceTo(player.position)};const sx=(p.x*.5+.5)*innerWidth,sy=(-p.y*.5+.5)*innerHeight,d=Math.hypot(sx-innerWidth*.5,sy-innerHeight*.4),v=Math.min(innerWidth,innerHeight);return{on:true,d,dist:bandit.position.distanceTo(player.position),track:v*.42,hard:v*.32}}
function tracer(){const g=geom();let dir=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion).normalize();if(g&&g.on&&g.dist<220&&g.d<(lock?115:85))dir.lerp(bandit.position.clone().addScaledVector(enemyVel,.12).sub(player.position).normalize(),.72).normalize();const a=player.position.clone().add(new THREE.Vector3((Math.random()>.5?1:-1)*4.8,0,-3).applyQuaternion(player.quaternion)),b=a.clone().addScaledVector(dir,130),ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),new THREE.LineBasicMaterial({color:0xffd36a,transparent:true,opacity:.95}));S.add(ln);setTimeout(()=>S.remove(ln),65);if(g&&g.on&&g.dist<220&&g.d<Math.max(45,90-g.dist*.15))hit()}function fireMissile(){if(!bandit.visible||lock<2||missile)return;const m=new THREE.Mesh(new THREE.CylinderGeometry(.16,.2,2.5,7),new THREE.MeshStandardMaterial({color:0xeee3d5}));m.rotation.x=Math.PI/2;m.position.copy(player.position).add(new THREE.Vector3(5,-.2,-2).applyQuaternion(player.quaternion));S.add(m);missile={m,v:new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion).multiplyScalar(280),life:4};beep(460,.08,.04)}
function crashNow(){dead=true;crash.style.display='grid';lockGain&&lockGain.gain.setTargetAtTime(0,audioCtx.currentTime,.02)}function updatePlayer(dt){if(dead)return;burn=THREE.MathUtils.lerp(burn,boost?1:0,1-Math.exp(-dt/(boost?.1:.2)));const d=bandit.visible?bandit.position.distanceTo(player.position):999,close=THREE.MathUtils.clamp((d-40)/110,.18,1);speed=THREE.MathUtils.lerp(speed,122+58*burn*close,1-Math.exp(-dt/.14));player.rotateX(pitch*1.0*dt);player.rotateZ(-roll*1.65*dt);fwd.set(0,0,-1).applyQuaternion(player.quaternion).normalize();const u=up.clone().applyQuaternion(player.quaternion),bank=Math.atan2(u.x,u.y);if(Math.abs(roll)<.04)player.rotateZ(bank*.72*dt);if(Math.abs(pitch)<.04)player.rotateX(-fwd.y*.48*dt);player.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(up,-bank*.5*dt));fwd.set(0,0,-1).applyQuaternion(player.quaternion).normalize();player.position.addScaledVector(fwd,speed*dt);const floor=H(player.position.x,player.position.z)+3;if(player.position.y<floor){player.position.y=floor;crashNow();return}for(const o of obs){const dx=player.position.x-o.position.x,dz=player.position.z-o.position.z;if(dx*dx+dz*dz<(o.userData.r+5)**2&&Math.abs(player.position.y-o.position.y)<o.userData.h*.65){crashNow();break}}}
function updateBandit(dt){if(!bandit.visible)return;enemyLast.copy(bandit.position);const f=new THREE.Vector3(0,0,-1).applyQuaternion(bandit.quaternion).normalize(),r=right.crossVectors(f,up).normalize(),dir=f.clone().addScaledVector(r,Math.sin(performance.now()*.001)*.08).addScaledVector(up,Math.sin(performance.now()*.0008)*.03).normalize();bandit.quaternion.slerp(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,-1),dir),1-Math.exp(-dt*.7));bandit.position.addScaledVector(new THREE.Vector3(0,0,-1).applyQuaternion(bandit.quaternion),108*dt);let fl=H(bandit.position.x,bandit.position.z)+16;if(bandit.position.y<fl)bandit.position.y=fl;enemyVel.copy(bandit.position).sub(enemyLast).divideScalar(Math.max(dt,.001));const d=bandit.position.distanceTo(player.position),inst=(lastRange-d)/Math.max(dt,.001)*6;lastRange=d;rangeFt=THREE.MathUtils.lerp(rangeFt,d*6,1-Math.exp(-dt/.06));closure=THREE.MathUtils.lerp(closure,inst,1-Math.exp(-dt/.22))}
function updateLock(dt){const g=geom();if(!g){tg.style.opacity='0';lock=0;return}const q=g.on&&g.d<g.track;if(q)lockT+=dt*(g.d<g.hard?2.5:1.4);else lockT=Math.max(0,lockT-dt*.6);lock=q?(lockT>.28?2:1):0;ring.className=lock===2?'lock':lock===1?'track':'';ret.className=lock===2?'lock':lock===1?'track':'';if(audioCtx){lockGain.gain.setTargetAtTime(lock===2?.028:0,audioCtx.currentTime,.03)}if(lock===2){ct.textContent='MISSILE LOCK';ct.className='lockText';cs.textContent=`${Math.round(rangeFt)} FT · TAP MISSILE`}else if(lock===1){ct.textContent='SEEKER TRACKING';ct.className='';cs.textContent=`${Math.round(rangeFt)} FT · HOLD HIM IN THE RING`}else{ct.textContent=boost?'BOOST — CLOSING':'DRAG TO STEER';ct.className='';cs.textContent=`${Math.round(rangeFt)} FT${closure>15?' · CLOSING '+Math.round(closure)+' FT/S':''}`}}
function updateTarget(){if(!bandit.visible){tg.style.opacity=0;return}const local=bandit.position.clone().sub(C.position).applyQuaternion(C.quaternion.clone().invert()),front=local.z<0,p=bandit.position.clone().project(C),on=front&&Math.abs(p.x)<.86&&Math.abs(p.y)<.76,mar=54;let x,y;if(on){x=(p.x*.5+.5)*innerWidth;y=(-p.y*.5+.5)*innerHeight}else{let dx=local.x,dy=local.y;if(!front){dx=-dx;dy=-dy}let mag=Math.max(1,Math.hypot(dx,dy));dx/=mag;dy/=mag;let sc=Math.min((innerWidth/2-mar)/Math.max(.001,Math.abs(dx)),(innerHeight/2-mar)/Math.max(.001,Math.abs(dy)));x=innerWidth/2+dx*sc;y=innerHeight/2-dy*sc}tg.style.left=x+'px';tg.style.top=y+'px';tg.style.opacity=1;tg.className=!on?'':lock===2?'lock':lock===1?'track':'';tg.dataset.r=`${Math.round(rangeFt/5)*5} FT${closure>18?' ↓':''}`}
function updateMissile(dt){if(!missile)return;missile.life-=dt;if(bandit.visible){const des=bandit.position.clone().addScaledVector(enemyVel,.12).sub(missile.m.position).normalize().multiplyScalar(330);missile.v.lerp(des,1-Math.exp(-dt*7));missile.m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),missile.v.clone().normalize())}missile.m.position.addScaledVector(missile.v,dt);if(bandit.visible&&missile.m.position.distanceTo(bandit.position)<10){S.remove(missile.m);missile=null;explode()}else if(missile.life<=0){S.remove(missile.m);missile=null}}
const cp=new THREE.Vector3(),lk=new THREE.Vector3();function camera(dt){fwd.set(0,0,-1).applyQuaternion(player.quaternion).normalize();cp.copy(player.position).addScaledVector(fwd,-12-burn*1.7).addScaledVector(up,5.6);C.position.lerp(cp,1-Math.exp(-dt/.12));lk.copy(player.position).addScaledVector(fwd,42+burn*9).addScaledVector(up,-11);C.lookAt(lk);C.fov=THREE.MathUtils.lerp(C.fov,66+burn*6.8,1-Math.exp(-dt/.15));C.updateProjectionMatrix();sky.position.copy(C.position)}
function resetGame(){player.position.set(0,H(0,330)+64,330);player.quaternion.identity();dead=false;kills=0;score.textContent='SPLASH 00';crash.style.display='none';speed=122;burn=0;pitch=roll=0;boost=firing=false;lock=lockT=0;if(missile){S.remove(missile.m);missile=null}rebuild(0,0);resetObs();C.position.set(0,player.position.y+5,342);spawn()}const steer=document.getElementById('steer'),ghost=document.getElementById('ghost');let sid=null,x0=0,y0=0;steer.onpointerdown=e=>{audio();sid=e.pointerId;x0=e.clientX;y0=e.clientY;ghost.style.left=x0+'px';ghost.style.top=y0+'px';ghost.style.opacity=.7;steer.setPointerCapture(sid)};steer.onpointermove=e=>{if(e.pointerId!==sid)return;roll=THREE.MathUtils.clamp((e.clientX-x0)/80,-1,1);pitch=THREE.MathUtils.clamp((e.clientY-y0)/80,-1,1)};function end(e){if(e.pointerId!==sid)return;sid=null;roll=pitch=0;ghost.style.opacity=0}steer.onpointerup=end;steer.onpointercancel=end;function hold(id,set){const el=document.getElementById(id);el.onpointerdown=e=>{audio();set(true);el.classList.add('on');el.setPointerCapture(e.pointerId)};el.onpointerup=el.onpointercancel=e=>{set(false);el.classList.remove('on')}}hold('boost',v=>boost=v);hold('fire',v=>{firing=v;if(v){tracer();gunT=.07}});document.getElementById('missile').onpointerdown=e=>{audio();fireMissile();e.currentTarget.classList.add('on')};document.getElementById('missile').onpointerup=e=>e.currentTarget.classList.remove('on');document.getElementById('reset').onpointerdown=()=>{audio();resetGame()};
let last=performance.now();function loop(n){requestAnimationFrame(loop);const dt=Math.min((n-last)/1000,.033);last=n;if(firing&&!dead){gunT-=dt;if(gunT<=0){tracer();gunT=.07}}updatePlayer(dt);if(Math.abs(player.position.x-gx)>600||Math.abs(player.position.z-gz)>600)rebuild(Math.round(player.position.x/600)*600,Math.round(player.position.z/600)*600);for(const o of obs)if(o.position.distanceToSquared(player.position)>1500*1500)placeObs(o);updateBandit(dt);camera(dt);R.render(S,C);updateLock(dt);updateTarget();updateMissile(dt);data.textContent=`${Math.round(speed)} SPD · ${Math.round(Math.max(0,player.position.y-H(player.position.x,player.position.z)))} ALT · ${bandit.visible?Math.round(rangeFt)+' FT':'—'}`}resetGame();requestAnimationFrame(loop);addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
