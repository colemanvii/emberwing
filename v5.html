renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const v5Rim=new THREE.DirectionalLight(0x91b9d4,.62);scene.add(v5Rim);scene.add(v5Rim.target);

function v5VerticalPlate(points,t=.18){const n=points.length,v=[],idx=[];for(const x of[-t/2,t/2])for(const p of points)v.push(x,p[0],p[1]);for(let i=1;i<n-1;i++)idx.push(n,n+i,n+i+1,0,i+1,i);for(let i=0;i<n;i++){const j=(i+1)%n;idx.push(i,j,n+j,i,n+j,n+i)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(idx);g.computeVertexNormals();return g}
function v5DressEnemy(){const wingOld=enemy.children[0]?.material,hullOld=enemy.children[1]?.material,canopyOld=enemy.children[3]?.material,wingNew=new THREE.MeshPhysicalMaterial({color:0x1a232b,roughness:.42,metalness:.38,clearcoat:.25,clearcoatRoughness:.16}),hullNew=new THREE.MeshPhysicalMaterial({color:0x10161c,roughness:.38,metalness:.45,clearcoat:.22,clearcoatRoughness:.13}),canopyNew=new THREE.MeshPhysicalMaterial({color:0x07131a,roughness:.07,metalness:.08,clearcoat:1,clearcoatRoughness:.025,transparent:true,opacity:.94,transmission:.04,thickness:.18,ior:1.44});enemy.traverse(o=>{if(!o.isMesh)return;if(o.material===wingOld)o.material=wingNew;else if(o.material===hullOld)o.material=hullNew;else if(o.material===canopyOld)o.material=canopyNew;o.castShadow=true;o.receiveShadow=true});const tailMat=new THREE.MeshPhysicalMaterial({color:0x202a31,roughness:.4,metalness:.4,clearcoat:.2,clearcoatRoughness:.18});const tail=new THREE.Mesh(plate([[-.25,1.05],[-2.9,1.9],[-2.25,2.7],[0,2.12],[2.25,2.7],[2.9,1.9],[.25,1.05]],.12),tailMat);tail.position.y=.03;enemy.add(tail);const fin=new THREE.Mesh(v5VerticalPlate([[0,.75],[0,2.8],[1.45,2.15],[.72,.85]],.17),tailMat);enemy.add(fin);v5ShadowTree(enemy,true,true)}
v5DressEnemy();
for(const c of ship.children)c.visible=false;
ship.userData.engines=[];ship.userData.plumes=[];
function v5Profile(s){const w=s.w,t=s.top,b=s.bot;return [[0,t],[w*.68,t*.64],[w,t*.06],[w*.78,-b*.62],[0,-b],[-w*.78,-b*.62],[-w,t*.06],[-w*.68,t*.64]]}
function v5Loft(stations){const ring=8,v=[],idx=[];for(const s of stations){const p=v5Profile(s);for(const q of p)v.push(q[0],q[1],s.z)}for(let i=0;i<stations.length-1;i++)for(let j=0;j<ring;j++){const n=(j+1)%ring,a=i*ring+j,b=i*ring+n,c=(i+1)*ring+j,d=(i+1)*ring+n;idx.push(a,c,b,b,c,d)}const start=v.length/3;v.push(0,0,stations[0].z);const end=v.length/3;v.push(0,0,stations[stations.length-1].z);for(let j=0;j<ring;j++){const n=(j+1)%ring;idx.push(start,n,j);const a=(stations.length-1)*ring+j,b=(stations.length-1)*ring+n;idx.push(end,a,b)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(idx);g.computeVertexNormals();return g}
function v5Intake(side){const s=side,xa=2.15*s,xb=3.75*s,xc=4.45*s,xd=2.72*s,z0=-2.25,z1=-.05,y=-.20,t=.24,verts=[xa,y,z0,xb,y-.03,z0,xc,y-.12,z1,xd,y-.08,z1,xa,y-t,z0,xb,y-t-.03,z0,xc,y-t-.12,z1,xd,y-t-.08,z1],faces=[0,1,2,0,2,3,4,6,5,4,7,6,0,4,5,0,5,1,1,5,6,1,6,2,2,6,7,2,7,3,3,7,4,3,4,0],g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setIndex(faces);g.computeVertexNormals();return g}
const v5HullMat=new THREE.MeshPhysicalMaterial({color:0x151c22,roughness:.31,metalness:.56,clearcoat:.48,clearcoatRoughness:.18});
const v5WingMat=new THREE.MeshPhysicalMaterial({color:0x202a31,roughness:.36,metalness:.48,clearcoat:.34,clearcoatRoughness:.22});
const v5DarkMat=new THREE.MeshStandardMaterial({color:0x06090c,roughness:.48,metalness:.42});
const v5GlassMat=new THREE.MeshPhysicalMaterial({color:0x04131a,roughness:.055,metalness:.04,clearcoat:1,clearcoatRoughness:.02,transparent:true,opacity:.965,transmission:.06,thickness:.14,ior:1.44});
const v5Airframe=new THREE.Group();
// Long, muscular central fuselage. No giant flat centerbody.
const coreStations=[
 {z:-9.15,w:.10,top:.07,bot:.05},
 {z:-8.2,w:.42,top:.17,bot:.10},
 {z:-7.1,w:.88,top:.31,bot:.18},
 {z:-5.85,w:1.35,top:.52,bot:.28},
 {z:-4.55,w:1.72,top:.78,bot:.38},
 {z:-3.25,w:1.95,top:1.03,bot:.48},
 {z:-1.9,w:2.18,top:1.12,bot:.54},
 {z:-.35,w:2.36,top:.98,bot:.57},
 {z:1.25,w:2.55,top:.80,bot:.55},
 {z:2.75,w:2.75,top:.69,bot:.54},
 {z:3.65,w:2.45,top:.62,bot:.55}
];
const v5Core=new THREE.Mesh(v5Loft(coreStations),v5HullMat);v5Airframe.add(v5Core);
// Swept wings are now wings, not the entire body.
const wingPlan=[[-1.55,-3.0],[-2.65,-1.65],[-6.95,.05],[-7.65,.82],[-7.0,1.75],[-4.55,2.45],[-2.55,1.72],[0,1.05],[2.55,1.72],[4.55,2.45],[7.0,1.75],[7.65,.82],[6.95,.05],[2.65,-1.65],[1.55,-3.0]];
const v5Wing=new THREE.Mesh(plate(wingPlan,.34),v5WingMat);v5Wing.position.y=-.08;v5Airframe.add(v5Wing);
// Small faceted canopy sunk into the fuselage crown.
const canopyStations=[{z:-4.92,w:.10,top:.04,bot:.02},{z:-4.28,w:.36,top:.15,bot:.03},{z:-3.48,w:.54,top:.25,bot:.045},{z:-2.62,w:.60,top:.27,bot:.05},{z:-1.82,w:.43,top:.18,bot:.035},{z:-1.28,w:.14,top:.06,bot:.02}];
const v5Canopy=new THREE.Mesh(v5Loft(canopyStations),v5GlassMat);v5Canopy.position.y=.92;v5Airframe.add(v5Canopy);
// Two raised side nacelles create real aft volume and each contains a pair of exhaust anchors.
for(const s of[-1,1]){const nacelleStations=[{z:-1.65,w:.52,top:.22,bot:.15},{z:-.6,w:.92,top:.42,bot:.26},{z:.55,w:1.33,top:.58,bot:.34},{z:1.75,w:1.48,top:.64,bot:.39},{z:2.85,w:1.48,top:.61,bot:.42},{z:3.62,w:1.30,top:.54,bot:.44}],nacelle=new THREE.Mesh(v5Loft(nacelleStations),v5HullMat);nacelle.position.set(s*3.35,.13,0);v5Airframe.add(nacelle)}
for(const s of[-1,1])v5Airframe.add(new THREE.Mesh(v5Intake(s),v5DarkMat));
// Canted tails grow out of the nacelles, giving the rear view height and authority.
for(const s of[-1,1]){const fin=new THREE.Mesh(v5VerticalPlate([[0,-1.06],[1.62,-.62],[1.46,1.36],[.12,1.64]],.17),v5WingMat);fin.position.set(s*3.42,.53,2.05);fin.rotation.z=s*-.27;fin.rotation.y=s*.035;v5Airframe.add(fin)}
// Mechanical exhaust coordinates stay exact.
for(const x of[-5,-1.7,1.7,5]){const outer=Math.abs(x)>4,rad=outer?.31:.42,shroud=new THREE.Mesh(new THREE.CylinderGeometry(rad*.95,rad*1.10,.62,10),v5DarkMat);shroud.rotation.x=Math.PI/2;shroud.position.set(x,0,3.10);v5Airframe.add(shroud);const e=new THREE.Mesh(new THREE.SphereGeometry(rad,8,6),new THREE.MeshBasicMaterial({color:0xff9a43,transparent:true,opacity:outer?.58:.80,blending:THREE.AdditiveBlending,depthWrite:false}));e.position.set(x,0,3.35);v5Airframe.add(e);ship.userData.engines.push(e);const ring=new THREE.Mesh(new THREE.TorusGeometry(rad*1.05,.047,6,18),new THREE.MeshBasicMaterial({color:0xffb06a,transparent:true,opacity:outer?.14:.24,blending:THREE.AdditiveBlending,depthWrite:false}));ring.position.set(x,0,3.36);v5Airframe.add(ring);const p=new THREE.Mesh(new THREE.ConeGeometry(outer?.22:.30,3.4,8),new THREE.MeshBasicMaterial({color:0xff8a3b,transparent:true,opacity:outer?.46:.67,blending:THREE.AdditiveBlending,depthWrite:false}));p.rotation.x=-Math.PI/2;p.position.set(x,0,4.9);v5Airframe.add(p);ship.userData.plumes.push(p)}
ship.add(v5Airframe);v5ShadowTree(v5Airframe,true,true);

// Landscape forms: reshape existing meshes only. Collision metadata and terrainHeight remain untouched.
function v5LandscapeMassPass(){
 let mountainIndex=0;
 for(const m of scenery){
  if(!m.userData.mountain)continue;
  const crags=m.children.filter(c=>c.isMesh);
  if(crags.length<4)continue;
  const first=crags[0].position,last=crags[crags.length-1].position;
  let dx=last.x-first.x,dz=last.z-first.z,len=Math.hypot(dx,dz);
  if(len<.001){dx=1;dz=0;len=1}
  dx/=len;dz/=len;
  const px=-dz,pz=dx,R=m.userData.collisionR||120,step=R*.105,hand=mountainIndex++%2?1:-1;
  const along=[-2.35,-1.35,-.25,.65,1.45,2.05],cross=[.03,-.045,0,.055,-.025,.04],height=[.84,.94,1,.9,.76,.62],width=[.92,.98,1,.94,.86,.78];
  const baseH=crags[2]?.scale.y||Math.max(...crags.map(c=>c.scale.y));
  for(let j=0;j<crags.length&&j<6;j++){
   const c=crags[j],newH=c.scale.y*height[j];
   c.position.x=dx*along[j]*step+px*cross[j]*R*hand;
   c.position.z=dz*along[j]*step+pz*cross[j]*R*hand;
   c.scale.x*=width[j];c.scale.z*=width[j];c.scale.y=newH;
   c.position.y=(newH-baseH)/2;
   c.rotation.y+=hand*(j-2.5)*.025;
  }
 }
 for(let r=0;r<distantRidges.length;r++){
  const ridge=distantRidges[r],peaks=ridge.children.filter(c=>c.isMesh);
  if(!peaks.length)continue;
  const baseH=(ridge.userData.raise||120)*2,hand=r%2?1:-1;
  const crest=[.72,.88,1,.9,.74];
  for(let j=0;j<peaks.length;j++){
   const p=peaks[j],factor=crest[j]||.8,newH=p.scale.y*factor;
   p.scale.x*=1.16;p.scale.z*=1.1;p.scale.y=newH;
   p.position.x=(j-(peaks.length-1)/2)*78+hand*(j%2?9:-6);
   p.position.z=hand*Math.sin((j+1)*1.35)*24;
   p.position.y=(newH-baseH)/2;
   p.rotation.y+=hand*(j-2)*.055;
  }
 }
}
v5LandscapeMassPass();

cityGlassMat.roughness=.16;cityGlassMat.metalness=.35;cityGlassMat.emissive.setHex(0x07151c);cityGlassMat.emissiveIntensity=.24;
rockMat.roughness=.96;sandMat.roughness=.9;peakDarkMat.roughness=.92;peakMat.roughness=.9;peakLightMat.roughness=.84;
const v5Snow=new THREE.Color(0xe8eef0),v5Shade=new THREE.Color(),v5DesertCut=new THREE.Color(0x55343a),v5DesertHigh=new THREE.Color(0xd18a58),v5AlpineCut=new THREE.Color(0x344955);
function v5GradeTerrain(){const col=ggeo.attributes.color,nrm=ggeo.attributes.normal;if(!col||!nrm)return;for(let i=0;i<gp.count;i++){const y=gp.getY(i),ny=THREE.MathUtils.clamp(nrm.getY(i),0,1),slope=1-ny,x=gp.getX(i)+ground.position.x,z=gp.getZ(i)+ground.position.z,grain=(Math.sin(x*.011)+Math.cos(z*.009)+Math.sin((x-z)*.005))*0.006;v5Shade.setRGB(col.getX(i),col.getY(i),col.getZ(i));if(worldIndex){const cliff=THREE.MathUtils.smoothstep(slope,.18,.72),snowHeight=THREE.MathUtils.smoothstep(y,12,122),shelf=THREE.MathUtils.smoothstep(ny,.48,.9),snow=snowHeight*shelf;v5Shade.multiplyScalar(1-cliff*.24+grain).lerp(v5AlpineCut,cliff*.16).lerp(v5Snow,snow*.58)}else{const cut=THREE.MathUtils.smoothstep(slope,.16,.68),high=THREE.MathUtils.smoothstep(y,-8,96)*(1-cut);v5Shade.multiplyScalar(1-cut*.28+grain).lerp(v5DesertCut,cut*.14).lerp(v5DesertHigh,high*.08)}col.setXYZ(i,v5Shade.r,v5Shade.g,v5Shade.b)}col.needsUpdate=true}
const v5RebuildTerrainBase=rebuildTerrain;rebuildTerrain=function(cx,cz){v5RebuildTerrainBase(cx,cz);v5GradeTerrain()};v5GradeTerrain();
const v5SetWorldThemeBase=setWorldTheme;setWorldTheme=function(alpine){v5SetWorldThemeBase(alpine);farRidgeMat.color.setHex(alpine?0x6f8796:0x6e4b49)};
const v5UpdateCameraBase=updateCamera;updateCamera=function(dt){v5UpdateCameraBase(dt);sun.position.set(ship.position.x-520,ship.position.y+390,ship.position.z-650);sun.target.position.copy(ship.position);sun.target.updateMatrixWorld();v5Rim.position.set(ship.position.x+310,ship.position.y+240,ship.position.z+420);v5Rim.target.position.copy(ship.position);v5Rim.target.updateMatrixWorld();v5Rim.color.setHex(worldIndex?0xb9dcf2:0x8eb7d1);v5Rim.intensity=worldIndex?.76:.5};
`;
html=html.replace(anchor,v5+anchor).replace('<title>Emberwing V3</title>','<title>Emberwing V5</title>').replace('<!-- EMBERWING V3 // standalone snapshot // generated from accepted pinned flight core -->','<!-- EMBERWING V5 // fighter silhouette + landscape beauty over accepted V3 flight core -->');document.open();document.write(html);document.close()})().catch(e=>{document.getElementById('boot').textContent='V5 AIRFRAME // '+e.message})</script></body></html>
