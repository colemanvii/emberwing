<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Emberwing</title>
<link rel="stylesheet" href="src/v58/portal.css">
</head>
<body>
<iframe id="flight" src="v57.html" title="Emberwing flight scenario" allow="autoplay; fullscreen"></iframe>
<div id="missionMessage" role="status">
 <span class="signal"></span>
 <div><small>MISSION CONTROL</small><strong>Destroy the launch vehicle.</strong><span>Follow the valley north.</span></div>
</div>
<div id="controls" aria-label="Game controls">
 <span><kbd>ARROWS</kbd> FLY</span>
 <span><kbd>SPACE</kbd> GUNS</span>
 <span><kbd>X</kbd> MISSILE</span>
 <span><kbd>SHIFT</kbd> TURBO</span>
</div>
<script>
const flight=document.querySelector('#flight');
flight.addEventListener('load',()=>{
 try{
  const doc=flight.contentDocument;
  doc.querySelector('#briefDeploy')?.click();
  const hint=doc.querySelector('#hint');
  if(hint)hint.style.display='none';
  flight.focus();
  setTimeout(()=>document.querySelector('#missionMessage').classList.add('show'),650);
  setTimeout(()=>document.querySelector('#missionMessage').classList.remove('show'),7200);
 }catch(e){}
});
</script>
</body>
</html>
