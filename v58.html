<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Emberwing</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030709}
#flight{position:fixed;inset:0;display:block;width:100vw;height:100vh;border:0}
#missionMessage{position:fixed;z-index:21;top:76px;left:50%;transform:translate(-50%,-8px);display:flex;align-items:flex-start;gap:11px;min-width:310px;padding:13px 16px;border:1px solid rgba(231,237,230,.16);border-radius:15px;background:rgba(5,12,15,.66);box-shadow:0 14px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#eef2eb;opacity:0;transition:opacity .45s ease,transform .45s ease;pointer-events:none}
#missionMessage.show{opacity:1;transform:translate(-50%,0)}
#missionMessage .signal{width:6px;height:6px;margin-top:4px;border-radius:50%;background:#e2c779;box-shadow:0 0 12px rgba(226,199,121,.7);flex:none}
#missionMessage div{display:grid;gap:3px}
#missionMessage small{font:700 7px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em;color:rgba(226,199,121,.72)}
#missionMessage strong{font:600 11px ui-sans-serif,system-ui,-apple-system,sans-serif;letter-spacing:.01em}
#missionMessage div span{font:400 10px ui-sans-serif,system-ui,-apple-system,sans-serif;color:rgba(226,233,226,.55)}
#controls{position:fixed;z-index:20;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:22px;padding:10px 16px;border:1px solid rgba(231,237,230,.15);border-radius:999px;background:rgba(5,12,15,.58);box-shadow:0 10px 34px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.045);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:rgba(226,233,226,.48);font:600 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;white-space:nowrap;pointer-events:none}
#controls kbd{margin-right:5px;color:rgba(245,246,239,.9);font:700 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em}
@media(pointer:coarse),(max-width:700px){#controls{display:none}#missionMessage{top:62px;min-width:0;width:calc(100vw - 32px)}}
</style>
</head>
<body>
<iframe id="flight" src="v57.html" title="Emberwing flight scenario" allow="autoplay; fullscreen"></iframe>
<div id="missionMessage" role="status">
 <span class="signal"></span>
 <div><small>MISSION CONTROL</small><strong>Destroy the launch vehicle.</strong><span>Follow the valley north.</span></div>
</div>
<div id="controls" aria-label="Game controls">
 <span><kbd>ARROWS</kbd> FLY</span>
 <span><kbd>SPACE</kbd> GUNS</span>
 <span><kbd>X</kbd> MISSILE</span>
 <span><kbd>SHIFT</kbd> TURBO</span>
</div>
<script>
const flight=document.querySelector('#flight');
flight.addEventListener('load',()=>{
 try{
  const doc=flight.contentDocument;
  doc.querySelector('#briefDeploy')?.click();
  const hint=doc.querySelector('#hint');
  if(hint)hint.style.display='none';
  flight.focus();
  setTimeout(()=>document.querySelector('#missionMessage').classList.add('show'),650);
  setTimeout(()=>document.querySelector('#missionMessage').classList.remove('show'),3900);
 }catch(e){}
});
</script>
</body>
</html>
