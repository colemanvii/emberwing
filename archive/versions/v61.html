<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Emberwing</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030709}
#flight{position:fixed;inset:0;display:block;width:100vw;height:100vh;border:0}
#controls{position:fixed;z-index:20;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:22px;padding:9px 15px;border:1px solid rgba(231,237,230,.12);border-radius:999px;background:rgba(5,12,15,.46);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:rgba(226,233,226,.43);font:600 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;white-space:nowrap;pointer-events:none}#controls kbd{margin-right:5px;color:rgba(245,246,239,.82);font:700 8px ui-monospace,SFMono-Regular,Menlo,monospace}
@media(pointer:coarse),(max-width:700px){#controls{display:none}}
</style>
</head>
<body>
<iframe id="flight" src="v57.html?ui=62" title="Emberwing flight scenario" allow="autoplay; fullscreen"></iframe>
<div id="controls"><span><kbd>ARROWS</kbd> FLY</span><span><kbd>SPACE</kbd> GUNS</span><span><kbd>X</kbd> MISSILE</span><span><kbd>SHIFT</kbd> TURBO</span></div>
<script>
const flight=document.querySelector('#flight');
flight.addEventListener('load',()=>{
 try{
  const doc=flight.contentDocument;
  const clean=doc.createElement('style');
  clean.textContent='#score,#coach{display:none!important}#mark::after{display:none!important}#mark{opacity:.72!important}#readout{opacity:.68!important}#headingTape{display:block!important;top:12px!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important;width:min(240px,34vw)!important;height:38px!important;border:0!important;border-radius:0!important;background:none!important}#headingTape::before{display:block!important;left:8%!important;right:8%!important;top:15px!important;background:linear-gradient(90deg,transparent,rgba(235,239,231,.13) 20%,rgba(235,239,231,.3) 50%,rgba(235,239,231,.13) 80%,transparent)!important}.headingTrack{display:block!important;opacity:.65!important}.headingTick{top:14px!important;height:4px!important;background:rgba(235,239,231,.22)!important}.headingTick.major{height:6px!important}.headingTick.cardinal{height:7px!important}.headingTick span{top:9px!important;font-size:7px!important;color:rgba(241,237,220,.58)!important}.headingCaret{display:block!important;top:10px!important;border-left-width:3px!important;border-right-width:3px!important;border-top-width:5px!important}.headingReadout{position:absolute!important;display:block!important;top:29px!important;left:50%!important;height:auto!important;transform:translateX(-50%)!important;font-size:7px!important;color:rgba(241,237,220,.55)!important}.headingObjective,.headingThreat{display:none!important}#realmCard{background:rgba(3,7,9,.16)!important;backdrop-filter:blur(2px)}#realmCard .plate{min-width:0!important;width:auto!important;padding:0!important;border:0!important;background:none!important;box-shadow:none!important}#realmKicker{font-size:7px!important;letter-spacing:.24em!important;color:rgba(226,199,121,.72)!important}#realmTitle{margin-top:10px!important;font:500 18px ui-sans-serif,system-ui,-apple-system,sans-serif!important;letter-spacing:.04em!important;color:#f2f3ed!important;text-shadow:0 2px 18px rgba(0,0,0,.55)!important}#realmStatus{margin-top:9px!important;font:600 8px ui-monospace,SFMono-Regular,Menlo,monospace!important;letter-spacing:.12em!important;color:rgba(235,239,231,.64)!important}';
  doc.head.appendChild(clean);
  doc.getElementById('score')?.remove();doc.getElementById('coach')?.remove();
  const mark=doc.getElementById('mark');if(mark)mark.textContent='EW–01 / FIRST FLIGHT';
  doc.querySelector('#briefDeploy')?.click();
  const hint=doc.querySelector('#hint');if(hint)hint.style.display='none';
  flight.focus();
 }catch(e){}
});
</script>
</body>
</html>
