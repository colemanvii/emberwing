<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Emberwing</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030709}
#flight{position:fixed;inset:0;display:block;width:100vw;height:100vh;border:0}
#missionMessage{position:fixed;z-index:21;top:66px;left:50%;transform:translate(-50%,-6px);display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid rgba(231,237,230,.13);border-radius:999px;background:rgba(5,12,15,.52);box-shadow:0 10px 30px rgba(0,0,0,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#eef2eb;opacity:0;transition:opacity .3s ease,transform .3s ease;pointer-events:none;white-space:nowrap}
#missionMessage.show{opacity:1;transform:translate(-50%,0)}#missionMessage .signal{width:5px;height:5px;border-radius:50%;background:#e2c779;box-shadow:0 0 10px rgba(226,199,121,.55);flex:none}#missionMessage small,#missionMessage div span{display:none}#missionMessage strong{font:600 10px ui-sans-serif,system-ui,-apple-system,sans-serif}
#controls{position:fixed;z-index:20;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:22px;padding:10px 16px;border:1px solid rgba(231,237,230,.15);border-radius:999px;background:rgba(5,12,15,.58);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:rgba(226,233,226,.48);font:600 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;white-space:nowrap;pointer-events:none}#controls kbd{margin-right:5px;color:rgba(245,246,239,.9);font:700 8px ui-monospace,SFMono-Regular,Menlo,monospace}
@media(pointer:coarse),(max-width:700px){#controls{display:none}#missionMessage{top:52px;max-width:calc(100vw - 24px)}}
</style>
</head>
<body>
<iframe id="flight" src="v57.html?ui=60" title="Emberwing flight scenario" allow="autoplay; fullscreen"></iframe>
<div id="missionMessage" role="status"><span class="signal"></span><div><small>MISSION CONTROL</small><strong>Destroy the launch vehicle.</strong><span>Follow the valley north.</span></div></div>
<div id="controls"><span><kbd>ARROWS</kbd> FLY</span><span><kbd>SPACE</kbd> GUNS</span><span><kbd>X</kbd> MISSILE</span><span><kbd>SHIFT</kbd> TURBO</span></div>
<script>
const flight=document.querySelector('#flight');
flight.addEventListener('load',()=>{
 try{
  const doc=flight.contentDocument;
  doc.getElementById('headingTape')?.remove();
  doc.getElementById('score')?.remove();
  doc.getElementById('coach')?.remove();
  const mark=doc.getElementById('mark');if(mark)mark.textContent='EW–01 / FIRST FLIGHT';
  doc.querySelector('#briefDeploy')?.click();
  const hint=doc.querySelector('#hint');if(hint)hint.style.display='none';
  flight.focus();
  setTimeout(()=>document.querySelector('#missionMessage').classList.add('show'),550);
  setTimeout(()=>document.querySelector('#missionMessage').classList.remove('show'),2700);
 }catch(e){}
});
</script>
</body>
</html>
