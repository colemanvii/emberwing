name: Build V16 Visual Shock

on:
  push:
    paths:
      - 'scripts/build-v16-visual-shock.mjs'
      - 'scripts/finalize-v16-composition.mjs'
      - 'scripts/smoke-v16.mjs'
      - '.github/workflows/build-v16-visual-shock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-smoke-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build V16 Visual Shock
        run: node scripts/build-v16-visual-shock.mjs

      - name: Enforce sparse monumental composition
        run: node scripts/finalize-v16-composition.mjs

      - name: Install browser smoke-test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve V16 locally
        run: |
          python3 -m http.server 4173 >/tmp/emberwing-http.log 2>&1 &
          echo $! >/tmp/emberwing-http.pid
          sleep 2

      - name: Smoke-test V16 in Chromium
        run: node scripts/smoke-v16.mjs

      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: emberwing-v16-visual-proof
          path: /tmp/emberwing-v16-desert.png
          retention-days: 1

      - name: Commit verified V16 candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Stage verified V16 Visual Shock candidate'
          git push origin HEAD:main
