import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene=new THREE.Scene();
const haze=new THREE.Color(0xc88a70); scene.background=haze; scene.fog=new THREE.FogExp2(haze,.00078);

renderer.setPixelRatio(Math.min(devicePixelRatio,1.7)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.14; renderer.domElement.tabIndex=0; document.body.prepend(renderer.domElement);

const sky=new THREE.Mesh(new THREE.SphereGeometry(2500,32,18),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,vertexShader:'varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'varying vec3 d;void main(){float h=d.y;vec3 top=vec3(.18,.14,.25),hor=vec3(.80,.50,.39),low=vec3(.93,.51,.28);vec3 c=mix(hor,top,smoothstep(-.02,.70,h));c=mix(low,c,smoothstep(-.30,.08,h));gl_FragColor=vec4(c,1.0);}'})); scene.add(sky);
scene.add(new THREE.HemisphereLight(0xffdec5,0x39252b,2.45));
const keyLight=new THREE.DirectionalLight(0xffc98c,5.2); keyLight.castShadow=true; keyLight.shadow.mapSize.set(1024,1024); keyLight.shadow.camera.left=-520; keyLight.shadow.camera.right=520; keyLight.shadow.camera.top=520; keyLight.shadow.camera.bottom=-520; scene.add(keyLight); const lightTarget=new THREE.Object3D(); scene.add(lightTarget); keyLight.target=lightTarget;

const TERRAIN_SIZE=3800,TERRAIN_SEG=180,TERRAIN_STEP=620;
const terrainGeo=new THREE.PlaneGeometry(TERRAIN_SIZE,TERRAIN_SIZE,TERRAIN_SEG,TERRAIN_SEG); terrainGeo.rotateX(-Math.PI/2); const pos=terrainGeo.attributes.position; const colors=new Float32Array(pos.count*3); terrainGeo.setAttribute('color',new THREE.BufferAttribute(colors,3));
const lowC=new THREE.Color(0x63383a),midC=new THREE.Color(0xaa5747),sandC=new THREE.Color(0xd48655),highC=new THREE.Color(0xf0b875),scratchC=new THREE.Color(); let terrainCX=0,terrainCZ=0;
const ground=new THREE.Mesh(terrainGeo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.98})); ground.receiveShadow=true; scene.add(ground);

rebuildTerrain(0,0);

const matSand=new THREE.MeshStandardMaterial({color:0xc8895e,roughness:.9}),matPale=new THREE.MeshStandardMaterial({color:0xdcb17d,roughness:.92}),matDark=new THREE.MeshStandardMaterial({color:0x443337,roughness:.82}),matRock=new THREE.MeshStandardMaterial({color:0x68413f,roughness:1}),matMesa=new THREE.MeshStandardMaterial({color:0x7e493f,roughness:1}),beaconMat=new THREE.MeshBasicMaterial({color:0xff7436});

function makeBuilding(){const g=new THREE.Group(),w=10+Math.random()*26,d=10+Math.random()*24,h=8+Math.random()*30,b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),Math.random()>.45?matSand:matPale);b.position.y=h/2;b.castShadow=b.receiveShadow=true;g.add(b);const cap=new THREE.Mesh(new THREE.BoxGeometry(w*.72,1,d*.72),matDark);cap.position.y=h+.5;g.add(cap);addScenery(g,'building')}

function makeTower(){const g=new THREE.Group(),h=26+Math.random()*45,m=new THREE.Mesh(new THREE.CylinderGeometry(.45,1.25,h,7),matDark);m.position.y=h/2;m.castShadow=true;g.add(m);const b=new THREE.Mesh(new THREE.SphereGeometry(.55,7,5),beaconMat);b.position.y=h+1;g.add(b);addScenery(g,'tower')}
for(let i=0;i<120;i++)makeBuilding();for(let i=0;i<170;i++)makeRock();for(let i=0;i<24;i++)makeMesa();for(let i=0;i<38;i++)makeSpire();for(let i=0;i<22;i++)makeTower();

const glowTex=glowTexture();

const worldUp=new THREE.Vector3(0,1,0),tmpForward=new THREE.Vector3(),tmpRight=new THREE.Vector3();

const objectiveUI=document.getElementById('objective'),flashUI=document.getElementById('flash'),reticle=document.getElementById('reticle'),targetUI=document.getElementById('target'),coachUI=document.getElementById('coach'),coachText=document.getElementById('coachText'),coachSub=document.getElementById('coachSub'),lockFill=document.getElementById('lockfill'),scoreUI=document.getElementById('score'),readout=document.getElementById('readout'),turboUI=document.getElementById('turbo');

function spawnEnemy(first=false){firstTarget=first&&kills===0;enemyAlive=true;enemyDamaged=false;enemy.visible=true;enemyTime=0;spawnSide*=-1;const f=flatHeading().clone(),right=new THREE.Vector3().crossVectors(f,worldUp).normalize(),dist=firstTarget?135:260,side=spawnSide*(firstTarget?10:105);enemy.position.copy(ship.position).addScaledVector(f,dist).addScaledVector(right,side);enemy.position.y=firstTarget?ship.position.y+4:Math.max(ship.position.y+18,terrainHeight(enemy.position.x,enemy.position.z)+40);const aim=ship.position.clone().addScaledVector(f,firstTarget?125:35).addScaledVector(right,-side*.75);aim.y=ship.position.y+5;enemy.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1),aim.sub(enemy.position).normalize());enemyVel.set(0,0,0);lastEnemy.copy(enemy.position);announce(firstTarget?'TARGET AHEAD':'NEW TARGET')}

const shots=[],effects=[],fireballMat=new THREE.MeshBasicMaterial({color:0xff9d1f}),coreMat=new THREE.MeshBasicMaterial({color:0xffffd8}),burstMat=new THREE.MeshBasicMaterial({color:0xff5e2b,transparent:true}),smokeMat=new THREE.MeshBasicMaterial({color:0x33292a,transparent:true,opacity:.38,depthWrite:false});let fireClock=0,gunSide=-1,lockState=0,lockTimer=0,turboMix=0,speed=124,pitchRate=0,rollRate=0,camKick=0,crashed=false;
function targetGeometry(){if(!enemyAlive)return{state:0,hard:false,dist:0,screenDist:9999,onscreen:false};const dist=enemy.position.distanceTo(ship.position),p=enemy.position.clone().project(camera),onscreen=p.z>-1&&p.z<1&&Math.abs(p.x)<1.08&&Math.abs(p.y)<1.08;if(!onscreen||dist>900)return{state:0,hard:false,dist,screenDist:9999,onscreen:false};const sx=(p.x*.5+.5)*innerWidth,sy=(-p.y*.5+.5)*innerHeight,rx=innerWidth*.5,ry=innerHeight*.42,d=Math.hypot(sx-rx,sy-ry);const scale=Math.min(innerWidth,innerHeight)/900,trackR=(firstTarget?210:165)*scale,lockR=(firstTarget?130:95)*scale;return{state:d<trackR?1:0,hard:d<lockR,dist,screenDist:d,onscreen:true,trackR,lockR}}

function hitBurst(p){for(let i=0;i<20;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.16+Math.random()*.3,5,4),burstMat.clone()),v=new THREE.Vector3(Math.random()-.5,Math.random()-.2,Math.random()-.5).normalize().multiplyScalar(14+Math.random()*38);m.position.copy(p);addEffect(m,v,.5+Math.random()*.2,20)}}
function emitSmoke(){const m=new THREE.Mesh(new THREE.SphereGeometry(1+Math.random()*1.1,7,5),smokeMat.clone());m.position.copy(enemy.position);addEffect(m,new THREE.Vector3((Math.random()-.5)*3,2+Math.random()*3,(Math.random()-.5)*3),1.3+Math.random()*.45,0,2.2)}
function explodeEnemy(){const p=enemy.position.clone();enemyAlive=false;enemyDamaged=false;enemy.visible=false;for(let i=0;i<48;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.2+Math.random()*.6,5,4),burstMat.clone()),v=new THREE.Vector3(Math.random()-.5,Math.random()-.15,Math.random()-.5).normalize().multiplyScalar(18+Math.random()*58);m.position.copy(p);addEffect(m,v,.65+Math.random()*.4,24)}kills++;firstTarget=false;scoreUI.textContent=`SPLASH ${String(kills).padStart(2,'0')}`;announce('SPLASH');screenFlash();respawnClock=1.1;targetUI.style.opacity='0';reticle.className=''}
function woundEnemy(p){hitBurst(p);if(!enemyDamaged){enemyDamaged=true;damageClock=firstTarget?.38:1.25;smokeClock=0;announce('HIT')}else damageClock=Math.min(damageClock,.22)}
function fire(){if(crashed)return;gunSide*=-1;const g=new THREE.Group(),ball=new THREE.Mesh(new THREE.SphereGeometry(.52,9,7),fireballMat),core=new THREE.Mesh(new THREE.SphereGeometry(.21,8,6),coreMat),tail=new THREE.Mesh(new THREE.ConeGeometry(.3,4.2,8),fireballMat);tail.rotation.x=-Math.PI/2;tail.position.z=1.95;g.add(ball,core,tail);const muzzle=new THREE.Vector3(gunSide*5.2,.08,-1.5).applyQuaternion(ship.quaternion).add(ship.position);g.position.copy(muzzle);let dir=new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion).normalize();if(enemyAlive&&lockState){const dist=enemy.position.distanceTo(muzzle),lead=enemy.position.clone().addScaledVector(enemyVel,Math.min(1,dist/480)),assist=lead.sub(muzzle).normalize();dir.lerp(assist,lockState===2?(firstTarget?.99:.94):.7).normalize()}g.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1),dir);scene.add(g);shots.push({mesh:g,v:dir.multiplyScalar(480),life:1.45});camKick=Math.min(.16,camKick+.03)}

const keys={};function onKey(e,down){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyR','ShiftLeft','ShiftRight'].includes(e.code)){e.preventDefault();keys[e.code]=down;if(down&&e.code==='Space'&&!e.repeat){fire();fireClock=.09}if(down&&e.code==='KeyR')reset();document.getElementById('focus').style.opacity='0'}}window.addEventListener('keydown',e=>onKey(e,true),{capture:true});window.addEventListener('keyup',e=>onKey(e,false),{capture:true});window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});renderer.domElement.addEventListener('pointerdown',()=>{renderer.domElement.focus({preventScroll:true});document.getElementById('focus').style.opacity='0'});
const clock=new THREE.Clock(),forward=new THREE.Vector3(),up=new THREE.Vector3(),desiredCam=new THREE.Vector3(),look=new THREE.Vector3(),qPitch=new THREE.Quaternion(),qRoll=new THREE.Quaternion(),qYaw=new THREE.Quaternion(),axisX=new THREE.Vector3(1,0,0),axisZ=new THREE.Vector3(0,0,1),axisY=new THREE.Vector3(0,1,0);function smooth(a,b,dt,t){return THREE.MathUtils.lerp(a,b,1-Math.exp(-dt/t))}
function reset(){const startY=terrainHeight(0,330)+62;ship.position.set(0,startY,330);ship.quaternion.identity();speed=124;turboMix=0;pitchRate=rollRate=0;crashed=false;kills=0;respawnClock=0;lockState=lockTimer=0;camKick=0;scoreUI.textContent='SPLASH 00';document.getElementById('crash').style.display='none';for(const s of shots)scene.remove(s.mesh);shots.length=0;for(const e of effects)scene.remove(e.mesh);effects.length=0;rebuildTerrain(0,0);resetScenery();resetDust();camera.position.set(0,startY+5.5,342);spawnEnemy(true)}
function updateFlight(dt){if(crashed)return;const pi=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),ri=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),boost=keys.ShiftLeft||keys.ShiftRight;turboMix=smooth(turboMix,boost?1:0,dt,boost?.12:.22);speed=smooth(speed,124+turboMix*52,dt,.14);turboUI.className=turboMix>.35?'on':'';for(const p of ship.userData.plumes){p.scale.z=1+turboMix*1.7;p.material.opacity=.68+turboMix*.28}for(const h of ship.userData.halos)h.scale.setScalar(2.6+turboMix*1.4);dustMat.opacity=.18+turboMix*.18;pitchRate=smooth(pitchRate,pi*1.08,dt,.17);rollRate=smooth(rollRate,ri*1.78,dt,.15);qPitch.setFromAxisAngle(axisX,pitchRate*dt);qRoll.setFromAxisAngle(axisZ,-rollRate*dt);ship.quaternion.multiply(qPitch).multiply(qRoll).normalize();forward.set(0,0,-1).applyQuaternion(ship.quaternion).normalize();up.copy(worldUp).applyQuaternion(ship.quaternion);let bank=Math.atan2(up.x,up.y);if(!ri){qRoll.setFromAxisAngle(axisZ,bank*.48*dt);ship.quaternion.multiply(qRoll).normalize()}if(!pi){forward.set(0,0,-1).applyQuaternion(ship.quaternion).normalize();qPitch.setFromAxisAngle(axisX,-forward.y*.34*dt);ship.quaternion.multiply(qPitch).normalize()}up.copy(worldUp).applyQuaternion(ship.quaternion);bank=Math.atan2(up.x,up.y);qYaw.setFromAxisAngle(axisY,-bank*.5*dt);ship.quaternion.premultiply(qYaw).normalize();forward.set(0,0,-1).applyQuaternion(ship.quaternion).normalize();ship.position.addScaledVector(forward,speed*dt);const floor=terrainHeight(ship.position.x,ship.position.z)+3;if(ship.position.y<floor){ship.position.y=floor;crashed=true;document.getElementById('crash').style.display='grid'}}
function updateEnemy(dt){if(!enemyAlive){respawnClock-=dt;if(respawnClock<=0)spawnEnemy(false);return}lastEnemy.copy(enemy.position);if(enemyDamaged){damageClock-=dt;smokeClock-=dt;enemy.rotateZ((firstTarget?4:2.4)*dt);enemy.position.addScaledVector(new THREE.Vector3(0,0,-1).applyQuaternion(enemy.quaternion),(firstTarget?68:88)*dt);enemy.position.y-=(firstTarget?34:18)*dt;if(smokeClock<=0){emitSmoke();smokeClock=.055}const floor=terrainHeight(enemy.position.x,enemy.position.z)+3;if(enemy.position.y<=floor||damageClock<=0){enemy.position.y=Math.max(enemy.position.y,floor);explodeEnemy()}}else{enemyTime+=dt;const f=flatHeading().clone(),right=new THREE.Vector3().crossVectors(f,worldUp).normalize();const target=firstTarget?ship.position.clone().addScaledVector(f,125).addScaledVector(right,Math.sin(enemyTime*.7)*15).addScaledVector(worldUp,5):ship.position.clone().addScaledVector(f,220).addScaledVector(right,Math.sin(enemyTime*1.1)*140).addScaledVector(worldUp,16+Math.sin(enemyTime*.75)*26);const dir=target.sub(enemy.position).normalize(),desired=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,-1),dir);enemy.quaternion.slerp(desired,1-Math.exp(-dt*(firstTarget?.72:1.3)));enemy.position.addScaledVector(new THREE.Vector3(0,0,-1).applyQuaternion(enemy.quaternion),(firstTarget?80:108)*dt);const floor=terrainHeight(enemy.position.x,enemy.position.z)+14;if(enemy.position.y<floor)enemy.position.y=smooth(enemy.position.y,floor,dt,.16)}enemyVel.copy(enemy.position).sub(lastEnemy).divideScalar(Math.max(dt,.001))}
function updateTargeting(dt){const t=targetGeometry(),need=firstTarget?.035:.11,stickyRadius=(firstTarget?190:135)*(Math.min(innerWidth,innerHeight)/900);const sticky=lockState===2&&t.onscreen&&t.screenDist<stickyRadius;const hard=t.hard||sticky;if(hard&&!enemyDamaged)lockTimer=Math.min(.45,lockTimer+dt);else lockTimer=Math.max(0,lockTimer-dt*(lockState===2?.45:1.4));lockState=(t.state||sticky)?(lockTimer>need?2:1):0;reticle.className=lockState===2?'lock':lockState===1?'track':'';lockFill.style.width=(THREE.MathUtils.clamp(lockTimer/need,0,1)*100)+'%';if(!enemyAlive){coachUI.className='';coachText.textContent='NEW TARGET COMING';coachSub.textContent='GET READY';return}if(enemyDamaged){coachUI.className='track';coachText.textContent='HIT — WATCH HIM GO';coachSub.textContent='STAY WITH IT';lockFill.style.width='100%'}else if(lockState===2){coachUI.className='lock';coachText.textContent='LOCKED — PRESS SPACE';coachSub.textContent='FIRE';lockFill.style.width='100%'}else if(lockState===1){coachUI.className='track';coachText.textContent='ALMOST — KEEP HIM NEAR THE CIRCLE';coachSub.textContent='LOCKING ON'}else if(turboMix>.45){coachUI.className='boost';coachText.textContent='TURBO';coachSub.textContent='CLOSE THE GAP'}else{coachUI.className='';coachText.textContent='BRING THE DIAMOND TOWARD THE CIRCLE';coachSub.textContent='YOU DO NOT HAVE TO BE PERFECT'}}
function updateGuidance(){if(!enemyAlive){targetUI.style.opacity='0';return}const local=enemy.position.clone().sub(camera.position).applyQuaternion(camera.quaternion.clone().invert()),front=local.z<0,p=enemy.position.clone().project(camera),margin=62,onscreen=front&&Math.abs(p.x)<.86&&Math.abs(p.y)<.76;let sx,sy;if(onscreen){sx=(p.x*.5+.5)*innerWidth;sy=(-p.y*.5+.5)*innerHeight}else{let dx=local.x,dy=local.y;if(!front){dx=-dx;dy=-dy}const mag=Math.max(1,Math.hypot(dx,dy));dx/=mag;dy/=mag;const scale=Math.min((innerWidth/2-margin)/Math.max(.001,Math.abs(dx)),(innerHeight/2-margin)/Math.max(.001,Math.abs(dy)));sx=innerWidth/2+dx*scale;sy=innerHeight/2-dy*scale}targetUI.style.left=sx+'px';targetUI.style.top=sy+'px';targetUI.style.opacity=enemyDamaged?.78:1;targetUI.dataset.range=enemyDamaged?`HIT ${Math.round(enemy.position.distanceTo(ship.position))}`:`TARGET ${Math.round(enemy.position.distanceTo(ship.position))}`;targetUI.className=enemyDamaged?'track':!onscreen?'offscreen':lockState===2?'lock':lockState===1?'track':''}
function updateWeapons(dt){fireClock-=dt;if(keys.Space&&fireClock<=0){fire();fireClock=.09}for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.mesh.position.addScaledVector(s.v,dt);s.life-=dt;if(enemyAlive&&s.mesh.position.distanceTo(enemy.position)<10.5){woundEnemy(s.mesh.position.clone());scene.remove(s.mesh);shots.splice(i,1);continue}if(s.life<=0){scene.remove(s.mesh);shots.splice(i,1)}}for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.life-=dt;e.v.y-=e.gravity*dt;e.mesh.position.addScaledVector(e.v,dt);if(e.grow)e.mesh.scale.multiplyScalar(1+e.grow*dt);if(e.mesh.material&&'opacity'in e.mesh.material)e.mesh.material.opacity=Math.max(0,e.life/e.max);if(e.life<=0){scene.remove(e.mesh);effects.splice(i,1)}}camKick=smooth(camKick,0,dt,.08)}
function updateCamera(dt){forward.set(0,0,-1).applyQuaternion(ship.quaternion).normalize();up.copy(worldUp).applyQuaternion(ship.quaternion);const bank=Math.atan2(up.x,up.y),alt=Math.max(0,ship.position.y-terrainHeight(ship.position.x,ship.position.z));desiredCam.copy(ship.position).addScaledVector(forward,-11.2-turboMix*1.5).addScaledVector(worldUp,5.3);desiredCam.x+=Math.sin(bank)*1.6;desiredCam.y+=camKick*(Math.random()-.5);camera.position.lerp(desiredCam,1-Math.exp(-dt/.12));look.copy(ship.position).addScaledVector(forward,40+turboMix*7).addScaledVector(worldUp,-12.5);look.x+=Math.sin(bank)*3.2;camera.lookAt(look);camera.rotateZ(-bank*.12);const effort=Math.min(1,Math.abs((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*.8+Math.abs((keys.ArrowDown?1:0)-(keys.ArrowUp?1:0))*.55),rush=THREE.MathUtils.clamp((80-alt)/80,0,1);camera.fov=smooth(camera.fov,66+effort*4.5+rush*2.5+turboMix*6,dt,.15);camera.updateProjectionMatrix();sky.position.copy(camera.position);lightTarget.position.copy(ship.position);keyLight.position.copy(ship.position).add(new THREE.Vector3(-480,540,320))}
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.033);updateFlight(dt);updateWorld();updateDust();updateEnemy(dt);updateCamera(dt);renderer.render(scene,camera);updateTargeting(dt);updateGuidance();updateWeapons(dt);readout.textContent=`${Math.round(speed)} SPD / ${Math.round(Math.max(0,ship.position.y-terrainHeight(ship.position.x,ship.position.z)))} ALT`}
reset();requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
