<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9c6656;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}canvas{display:block;outline:none}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 10px #25100ccc}#grade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 34%,rgba(40,13,14,.035) 63%,rgba(25,8,12,.24) 100%),linear-gradient(180deg,rgba(44,33,65,.08),transparent 30%,rgba(255,122,42,.035));mix-blend-mode:multiply}#mark{position:absolute;top:20px;left:22px;font-size:10px;letter-spacing:.24em;font-weight:700;color:#fff7e7;opacity:.78}#score{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.22em;color:#fff1d0;opacity:.66}#readout{position:absolute;top:20px;right:22px;font-size:10px;letter-spacing:.14em;color:#fff7e7;opacity:.7}#hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.12em;opacity:.34;white-space:nowrap}#focus,#objective{position:absolute;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.2em;color:#fff6de}#focus{top:64%;padding:8px 11px;border:1px solid #fff4cf38;background:#28140e45;transition:opacity .25s}#objective{top:17%;font-weight:700;opacity:.48;transition:opacity .3s}#reticle{position:absolute;left:50%;top:43%;width:24px;height:24px;transform:translate(-50%,-50%);border:1px solid #fff0b0d9;border-radius:50%;box-shadow:0 0 12px #ffb52b45;transition:border-color .12s,box-shadow .12s,transform .12s}#reticle:before,#reticle:after{content:"";position:absolute;background:#fff0b0d9;transition:background .12s}#reticle:before{width:36px;height:1px;left:-7px;top:11px}#reticle:after{width:1px;height:36px;left:11px;top:-7px}#reticle.track{border-color:#ffbb43;box-shadow:0 0 16px #ff8a1f6b}#reticle.track:before,#reticle.track:after{background:#ffbb43}#reticle.lock{border-color:#ff6030;box-shadow:0 0 20px #ff4b24aa;transform:translate(-50%,-50%) scale(.84)}#reticle.lock:before,#reticle.lock:after{background:#ff6030}#target{position:absolute;width:31px;height:31px;opacity:0;transform:translate(-50%,-50%) rotate(45deg);border:1px solid #fff0b0a8;transition:opacity .1s,border-color .1s,box-shadow .1s;filter:drop-shadow(0 0 6px #29100aaa)}#target:after{content:attr(data-range);position:absolute;left:22px;top:-3px;transform:rotate(-45deg);transform-origin:left center;font-size:8px;letter-spacing:.15em;color:#fff4cf;white-space:nowrap;text-shadow:0 2px 7px #1c0b08ee}#target.guide{border-color:#fff0b0b8;box-shadow:0 0 11px #fff0b022}#target.offscreen{border-color:#fff4cf;box-shadow:0 0 16px #ffba4066}#target.track{border-color:#ffbb43;box-shadow:0 0 14px #ff8a1f66}#target.lock{border-color:#ff6030;box-shadow:0 0 18px #ff4b2499}#status{position:absolute;left:50%;top:48%;transform:translateX(-50%);font-size:8px;letter-spacing:.25em;color:#ffd27a;opacity:0;transition:opacity .12s}#scope{position:absolute;left:20px;bottom:18px;width:96px;height:96px;opacity:.25;transition:opacity .18s,transform .18s;filter:drop-shadow(0 2px 8px #0007)}#scope.awake{opacity:.68;transform:scale(1.025)}#flash{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 45%,rgba(255,190,92,.18),rgba(255,70,25,.05) 32%,transparent 65%);transition:opacity .08s}#crash{position:absolute;inset:0;display:none;place-items:center;background:#120707d8;font:700 17px ui-monospace;letter-spacing:.2em}#crash span{text-align:center}#crash small{display:block;margin-top:12px;font-size:9px;opacity:.64}

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene=new THREE.Scene();
const hazeColor=new THREE.Color(0xc8896d);scene.background=hazeColor;scene.fog=new THREE.FogExp2(hazeColor,.00135);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,3200);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.domElement.tabIndex=0;document.body.prepend(renderer.domElement);

const skyUniforms={sunDir:{value:new THREE.Vector3(-.4,.24,-.88).normalize()}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(2400,36,20),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:skyUniforms,vertexShader:'varying vec3 vDir;void main(){vDir=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'varying vec3 vDir;uniform vec3 sunDir;void main(){float h=vDir.y;vec3 zen=vec3(.19,.14,.25);vec3 upper=vec3(.38,.25,.32);vec3 hor=vec3(.78,.49,.38);vec3 low=vec3(.94,.48,.20);float a=smoothstep(-.02,.62,h);vec3 col=mix(hor,zen,a);col=mix(low,col,smoothstep(-.3,.06,h));float sun=max(dot(normalize(vDir),normalize(sunDir)),0.0);col+=vec3(1.0,.48,.16)*pow(sun,70.0)*.8;col+=vec3(1.0,.72,.36)*pow(sun,260.0)*1.5;gl_FragColor=vec4(col,1.0);}'}));scene.add(sky);
function glowTexture(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,249,218,1)');g.addColorStop(.09,'rgba(255,210,132,.96)');g.addColorStop(.28,'rgba(255,147,64,.38)');g.addColorStop(1,'rgba(255,100,30,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
const glowTex=glowTexture(),sunDir=skyUniforms.sunDir.value.clone();
const sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,color:0xffb05c}));sunGlow.scale.set(340,340,1);scene.add(sunGlow);
scene.add(new THREE.HemisphereLight(0xffdec3,0x3d2427,2.35));
const sun=new THREE.DirectionalLight(0xffc982,5.6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-500;sun.shadow.camera.right=500;sun.shadow.camera.top=500;sun.shadow.camera.bottom=-500;sun.shadow.camera.near=1;sun.shadow.camera.far=1200;scene.add(sun);const sunTarget=new THREE.Object3D();scene.add(sunTarget);sun.target=sunTarget;

function terrainHeight(x,z){const broad=Math.sin(x*.0047)*18+Math.cos(z*.0058)*16+Math.sin((x+z)*.0022)*20;const ridge=Math.abs(Math.sin(x*.0098+Math.sin(z*.0032)*1.7))*23;const broken=Math.sin((x-z)*.014)*Math.cos((x+z)*.011)*5;const detail=Math.sin(x*.039)*Math.cos(z*.034)*2.8;return broad+ridge+broken+detail-48}
const TERRAIN_SIZE=3800,TERRAIN_SEG=180,TERRAIN_STEP=620;
const terrain=new THREE.PlaneGeometry(TERRAIN_SIZE,TERRAIN_SIZE,TERRAIN_SEG,TERRAIN_SEG);terrain.rotateX(-Math.PI/2);const tp=terrain.attributes.position;
const tcol=new Float32Array(tp.count*3);terrain.setAttribute('color',new THREE.BufferAttribute(tcol,3));
const lowC=new THREE.Color(0x6d3f3c),midC=new THREE.Color(0xb85f45),sandC=new THREE.Color(0xd88b57),highC=new THREE.Color(0xf0bb79),shadeC=new THREE.Color();let terrainCX=0,terrainCZ=0;
function rebuildTerrain(cx,cz){terrainCX=cx;terrainCZ=cz;for(let i=0;i<tp.count;i++){const wx=tp.getX(i)+cx,wz=tp.getZ(i)+cz,y=terrainHeight(wx,wz);tp.setY(i,y);const n=THREE.MathUtils.clamp((y+92)/132,0,1),band=.5+.5*Math.sin(y*.19+wx*.004);shadeC.copy(lowC).lerp(midC,Math.min(1,n*1.45));if(n>.46)shadeC.lerp(sandC,(n-.46)*1.5);if(n>.72)shadeC.lerp(highC,(n-.72)*2.25);shadeC.offsetHSL(0,0,(band-.5)*.032);tcol[i*3]=shadeC.r;tcol[i*3+1]=shadeC.g;tcol[i*3+2]=shadeC.b}tp.needsUpdate=true;terrain.attributes.color.needsUpdate=true;terrain.computeVertexNormals();ground.position.set(cx,0,cz)}
const ground=new THREE.Mesh(terrain,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.97,metalness:0}));ground.receiveShadow=true;scene.add(ground);rebuildTerrain(0,0);

const sand=new THREE.MeshStandardMaterial({color:0xc8895e,roughness:.88}),pale=new THREE.MeshStandardMaterial({color:0xddb17d,roughness:.9}),stone=new THREE.MeshStandardMaterial({color:0x86564b,roughness:.96}),dark=new THREE.MeshStandardMaterial({color:0x403238,roughness:.82,metalness:.08}),roofMat=new THREE.MeshStandardMaterial({color:0x66484a,roughness:.9}),rockMat=new THREE.MeshStandardMaterial({color:0x65413f,roughness:1}),mesaMat=new THREE.MeshStandardMaterial({color:0x7f493f,roughness:1}),padMat=new THREE.MeshStandardMaterial({color:0x4e4140,roughness:.96}),beaconMat=new THREE.MeshBasicMaterial({color:0xff7436});
const scenery=[];
function register(m,kind,raise=0){m.userData.kind=kind;m.userData.raise=raise;scene.add(m);scenery.push(m);return m}
function makeBuilding(){const g=new THREE.Group(),w=10+Math.random()*25,d=10+Math.random()*24,h=8+Math.random()*30,body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),Math.random()>.46?sand:pale);body.position.y=h/2;body.castShadow=body.receiveShadow=true;g.add(body);const cap=new THREE.Mesh(new THREE.BoxGeometry(w*.72,1.1,d*.72),roofMat);cap.position.y=h+.55;cap.castShadow=true;g.add(cap);if(Math.random()>.45){const vent=new THREE.Mesh(new THREE.CylinderGeometry(.5,.72,2.8,6),dark);vent.position.set((Math.random()-.5)*w*.45,h+1.9,(Math.random()-.5)*d*.4);vent.castShadow=true;g.add(vent)}if(Math.random()>.72){const awning=new THREE.Mesh(new THREE.BoxGeometry(w*.7,.25,2.2),roofMat);awning.position.set(0,h*.55,d*.57);g.add(awning)}register(g,'building',0)}
function makeTower(){const g=new THREE.Group(),h=28+Math.random()*46,mast=new THREE.Mesh(new THREE.CylinderGeometry(.45,1.35,h,7),dark);mast.position.y=h/2;mast.castShadow=true;g.add(mast);for(const yy of [.48,.72]){const ring=new THREE.Mesh(new THREE.TorusGeometry(2.8+yy,.22,6,18),stone);ring.rotation.x=Math.PI/2;ring.position.y=h*yy;g.add(ring)}const beacon=new THREE.Mesh(new THREE.SphereGeometry(.62,8,6),beaconMat);beacon.position.y=h+1;g.add(beacon);register(g,'tower',0)}
function makeRock(){const h=5+Math.random()*24,w=3+Math.random()*9,m=new THREE.Mesh(new THREE.DodecahedronGeometry(1,0),rockMat);m.scale.set(w,h,w*(.72+Math.random()*.4));m.rotation.set(Math.random()*.28,Math.random()*Math.PI,Math.random()*.16);m.castShadow=true;register(m,'rock',h*.8)}
function makeSpire(){const h=22+Math.random()*55,r=5+Math.random()*12,m=new THREE.Mesh(new THREE.ConeGeometry(r,r*.25+h,7),stone);m.scale.y=.7+Math.random()*.6;m.rotation.y=Math.random()*Math.PI;m.castShadow=true;register(m,'spire',h*.5)}
function makeMesa(){const h=28+Math.random()*58,top=20+Math.random()*28,bottom=34+Math.random()*40,m=new THREE.Mesh(new THREE.CylinderGeometry(top,bottom,h,7,1,false),mesaMat);m.rotation.y=Math.random()*Math.PI;m.scale.z=.65+Math.random()*.75;m.castShadow=m.receiveShadow=true;register(m,'mesa',h*.5)}
function makePad(){const g=new THREE.Group(),r=13+Math.random()*9,pad=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.35,24),padMat);pad.position.y=.18;pad.receiveShadow=true;g.add(pad);for(let i=0;i<3;i++){const b=new THREE.Mesh(new THREE.SphereGeometry(.28,6,4),beaconMat),a=i*Math.PI*2/3;b.position.set(Math.sin(a)*r*.72,.65,Math.cos(a)*r*.72);g.add(b)}register(g,'pad',0)}
for(let i=0;i<112;i++)makeBuilding();for(let i=0;i<24;i++)makeTower();for(let i=0;i<165;i++)makeRock();for(let i=0;i<34;i++)makeSpire();for(let i=0;i<18;i++)makeMesa();for(let i=0;i<14;i++)makePad();

function plateGeometry(points,t=.22){const n=points.length,v=[],idx=[];for(const y of [-t/2,t/2])for(const p of points)v.push(p[0],y,p[1]);for(let i=1;i<n-1;i++){idx.push(n,n+i,n+i+1);idx.push(0,i+1,i)}for(let i=0;i<n;i++){const j=(i+1)%n;idx.push(i,j,n+j,i,n+j,n+i)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(idx);g.computeVertexNormals();return g}
function makeShip(enemy=false){const g=new THREE.Group();const hull=new THREE.MeshStandardMaterial({color:enemy?0x11161c:0x34383c,roughness:.34,metalness:.58}),wingMat=new THREE.MeshStandardMaterial({color:enemy?0x1d252d:0x5e6262,roughness:.45,metalness:.46}),edgeMat=new THREE.MeshStandardMaterial({color:enemy?0x090d12:0x20272b,roughness:.38,metalness:.62}),canopy=new THREE.MeshStandardMaterial({color:enemy?0x07121b:0x071117,roughness:.1,metalness:.82});const pts=enemy?[[-.6,-3],[-3.1,-1.2],[-5.1,.6],[-3.7,2.5],[0,1.45],[3.7,2.5],[5.1,.6],[3.1,-1.2],[.6,-3]]:[[-.8,-3.2],[-3,-1.5],[-8.1,.5],[-7.15,2.9],[-3.1,2.2],[0,1.25],[3.1,2.2],[7.15,2.9],[8.1,.5],[3,-1.5],[.8,-3.2]];const wing=new THREE.Mesh(plateGeometry(pts,enemy?.2:.26),wingMat);wing.castShadow=true;g.add(wing);const body=new THREE.Mesh(new THREE.CylinderGeometry(enemy?.72:1.02,enemy?1.02:1.36,enemy?6.8:8.8,8),hull);body.rotation.x=Math.PI/2;body.position.z=.2;body.castShadow=true;g.add(body);const nose=new THREE.Mesh(new THREE.ConeGeometry(enemy?.76:1.08,enemy?3.1:3.8,8),hull);nose.rotation.x=-Math.PI/2;nose.position.z=enemy?-4.7:-6.0;nose.castShadow=true;g.add(nose);const spine=new THREE.Mesh(new THREE.BoxGeometry(enemy?1.15:1.7,enemy?.28:.38,enemy?5.1:6.8),edgeMat);spine.position.set(0,.1,.5);spine.castShadow=true;g.add(spine);const c=new THREE.Mesh(new THREE.SphereGeometry(enemy?.62:.9,14,9),canopy);c.scale.set(.8,.42,1.75);c.position.set(0,enemy?.54:.74,enemy?-1.8:-2.05);g.add(c);for(const s of [-1,1]){const fin=new THREE.Mesh(new THREE.BoxGeometry(enemy?.18:.22,enemy?1.2:1.75,enemy?2.2:2.75),edgeMat);fin.position.set(s*(enemy?1.7:2.5),enemy?.58:.86,2.35);fin.rotation.z=-s*(enemy?.16:.12);fin.castShadow=true;g.add(fin)}const glow=new THREE.MeshBasicMaterial({color:enemy?0x70d7ff:0xff6a2f}),exhaust=new THREE.MeshBasicMaterial({color:enemy?0x6dd8ff:0xff7d35,transparent:true,opacity:.62,blending:THREE.AdditiveBlending,depthWrite:false}),xs=enemy?[-1.45,1.45]:[-5.05,-1.65,1.65,5.05];for(const x of xs){const nacelle=new THREE.Mesh(new THREE.CylinderGeometry(enemy?.3:.43,enemy?.38:.54,enemy?2.4:3.2,8),edgeMat);nacelle.rotation.x=Math.PI/2;nacelle.position.set(x,-.02,1.75);nacelle.castShadow=true;g.add(nacelle);const e=new THREE.Mesh(new THREE.SphereGeometry(enemy?.26:.38,9,6),glow);e.scale.z=1.9;e.position.set(x,.02,3.35);g.add(e);const plume=new THREE.Mesh(new THREE.ConeGeometry(enemy?.24:.34,enemy?2.2:3.3,8),exhaust);plume.rotation.x=-Math.PI/2;plume.position.set(x,.02,4.8);g.add(plume);const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:enemy?0x63cbff:0xff7b32,transparent:true,opacity:enemy?.45:.54,depthWrite:false,blending:THREE.AdditiveBlending}));halo.scale.set(enemy?1.8:2.35,enemy?1.8:2.35,1);halo.position.set(x,.02,3.6);g.add(halo)}if(!enemy){for(const s of [-1,1]){const tip=new THREE.Mesh(new THREE.SphereGeometry(.16,6,4),new THREE.MeshBasicMaterial({color:0xffc06a}));tip.position.set(s*7.2,.05,1.1);g.add(tip)}}return g}
const ship=makeShip(false);scene.add(ship);const enemy=makeShip(true);scene.add(enemy);

const worldUp=new THREE.Vector3(0,1,0),tmpForward=new THREE.Vector3(),tmpRight=new THREE.Vector3();
function flatHeading(){tmpForward.set(0,0,-1).applyQuaternion(ship.quaternion);tmpForward.y=0;if(tmpForward.lengthSq()<.001)tmpForward.set(0,0,-1);return tmpForward.normalize()}
function placeScenery(m,initial=false){const kind=m.userData.kind,f=flatHeading().clone(),right=tmpRight.crossVectors(f,worldUp).normalize();let x,z;if(initial){const a=Math.random()*Math.PI*2,r=(kind==='mesa'?450:45)+Math.random()*(kind==='mesa'?1000:1200);x=ship.position.x+Math.sin(a)*r;z=ship.position.z+Math.cos(a)*r}else{const ahead=(kind==='mesa'?650:320)+Math.random()*(kind==='mesa'?1150:1050),spread=kind==='building'||kind==='pad'?1050:1550,side=(Math.random()-.5)*spread;x=ship.position.x+f.x*ahead+right.x*side;z=ship.position.z+f.z*ahead+right.z*side}m.position.set(x,terrainHeight(x,z)+m.userData.raise,z);if(kind==='rock'||kind==='spire'||kind==='mesa')m.rotation.y=Math.random()*Math.PI;if(kind==='building')m.rotation.y=Math.round(Math.random()*3)*Math.PI/2+(Math.random()-.5)*.08}
function resetScenery(){for(const m of scenery)placeScenery(m,true)}
function updateWorld(){if(Math.abs(ship.position.x-terrainCX)>TERRAIN_STEP||Math.abs(ship.position.z-terrainCZ)>TERRAIN_STEP){const cx=Math.round(ship.position.x/TERRAIN_STEP)*TERRAIN_STEP,cz=Math.round(ship.position.z/TERRAIN_STEP)*TERRAIN_STEP;rebuildTerrain(cx,cz)}for(const m of scenery){const dx=m.position.x-ship.position.x,dz=m.position.z-ship.position.z,limit=m.userData.kind==='mesa'?1850:1450;if(dx*dx+dz*dz>limit*limit)placeScenery(m,false)}}

const dustCount=260,dustPos=new Float32Array(dustCount*3),dustGeo=new THREE.BufferGeometry();dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xffd4a3,size:.75,transparent:true,opacity:.22,depthWrite:false,sizeAttenuation:true,fog:true}));scene.add(dust);
function resetDustPoint(i,aheadOnly=false){const f=flatHeading().clone(),right=new THREE.Vector3().crossVectors(f,worldUp).normalize(),ahead=(aheadOnly?80:-80)+Math.random()*(aheadOnly?440:520),side=(Math.random()-.5)*380;dustPos[i*3]=ship.position.x+f.x*ahead+right.x*side;dustPos[i*3+1]=ship.position.y+(Math.random()-.5)*150;dustPos[i*3+2]=ship.position.z+f.z*ahead+right.z*side}
function resetDust(){for(let i=0;i<dustCount;i++)resetDustPoint(i,false);dustGeo.attributes.position.needsUpdate=true}
function updateDust(){const f=flatHeading(),right=new THREE.Vector3().crossVectors(f,worldUp).normalize();for(let i=0;i<dustCount;i++){const dx=dustPos[i*3]-ship.position.x,dz=dustPos[i*3+2]-ship.position.z,ahead=dx*f.x+dz*f.z,side=dx*right.x+dz*right.z;if(ahead<-120||ahead>480||Math.abs(side)>240)resetDustPoint(i,true)}dustGeo.attributes.position.needsUpdate=true}

let enemyAlive=true,enemyDamaged=false,enemyPhase=0,enemyTime=0,enemyVel=new THREE.Vector3(),lastEnemy=new THREE.Vector3(),respawnClock=0,kills=0,spawnSide=-1,objectiveClock=0,damageClock=0,smokeClock=0;
const objectiveUI=document.getElementById('objective'),flashUI=document.getElementById('flash');function announce(text,seconds=1.1){objectiveUI.textContent=text;objectiveUI.style.opacity='1';objectiveClock=seconds}function screenFlash(amount=.7){flashUI.style.transition='none';flashUI.style.opacity=String(amount);requestAnimationFrame(()=>{flashUI.style.transition='opacity .18s';flashUI.style.opacity='0'})}
function spawnEnemy(first=false){enemyAlive=true;enemyDamaged=false;enemy.visible=true;enemyPhase=0;enemyTime=0;damageClock=0;smokeClock=0;spawnSide*=-1;const f=flatHeading().clone(),right=new THREE.Vector3().crossVectors(f,worldUp).normalize(),dist=first?245:320,side=spawnSide*(first?72:175);enemy.position.copy(ship.position).addScaledVector(f,dist).addScaledVector(right,side);enemy.position.y=Math.max(ship.position.y+30,terrainHeight(enemy.position.x,enemy.position.z)+48);const cross=ship.position.clone().addScaledVector(f,15).addScaledVector(right,-side*1.15);cross.y=ship.position.y+12;enemy.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1),cross.sub(enemy.position).normalize());enemyVel.set(0,0,0);lastEnemy.copy(enemy.position);announce(first?'INTERCEPT CONTACT':'NEW CONTACT',first?1.6:1)}

const shots=[],effects=[];const fireballMat=new THREE.MeshBasicMaterial({color:0xff9d1f}),coreMat=new THREE.MeshBasicMaterial({color:0xffffd8}),burstMat=new THREE.MeshBasicMaterial({color:0xff5e2b,transparent:true}),smokeMat=new THREE.MeshBasicMaterial({color:0x33292a,transparent:true,opacity:.38,depthWrite:false});let fireClock=0,gunSide=-1,lockStrength=0,lockState=0,lockTimer=0,camKick=0;

const keys={};function key(e,down){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyR'].includes(e.code)){e.preventDefault();keys[e.code]=down;if(down&&e.code==='Space'&&!e.repeat){fire();fireClock=.09}if(down&&e.code==='KeyR')reset();document.getElementById('focus').style.opacity='0'}}window.addEventListener('keydown',e=>key(e,true),{capture:true});window.addEventListener('keyup',e=>key(e,false),{capture:true});window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});renderer.domElement.addEventListener('pointerdown',()=>{renderer.domElement.focus({preventScroll:true});document.getElementById('focus').style.opacity='0'});

function updateFlight(dt){if(crashed)return;const pi=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),ri=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);pitchRate=smooth(pitchRate,pi*1.14,dt,.16);rollRate=smooth(rollRate,ri*1.92,dt,.14);qPitch.setFromAxisAngle(axisX,pitchRate*dt);qRoll.setFromAxisAngle(axisZ,-rollRate*dt);ship.quaternion.multiply(qPitch).multiply(qRoll).normalize();up.copy(worldUp).applyQuaternion(ship.quaternion);const bank=Math.atan2(up.x,up.y);qYaw.setFromAxisAngle(axisY,-bank*.52*dt);ship.quaternion.premultiply(qYaw).normalize();forward.set(0,0,-1).applyQuaternion(ship.quaternion).normalize();ship.position.addScaledVector(forward,speed*dt);const floor=terrainHeight(ship.position.x,ship.position.z)+2.4;if(ship.position.y<floor){ship.position.y=floor;crashed=true;document.getElementById('crash').style.display='grid'}}
function updateEnemy(dt){if(!enemyAlive){if(respawnClock>0){respawnClock-=dt;if(respawnClock<=0)spawnEnemy(false)}return}lastEnemy.copy(enemy.position);if(enemyDamaged){damageClock-=dt;smokeClock-=dt;enemy.rotateZ(2.25*dt);enemy.rotateX(.28*dt);enemy.position.addScaledVector(new THREE.Vector3(0,0,-1).applyQuaternion(enemy.quaternion),88*dt);enemy.position.y-= (15+(1.55-damageClock)*18)*dt;if(smokeClock<=0){emitSmoke();smokeClock=.055}const floor=terrainHeight(enemy.position.x,enemy.position.z)+3;if(enemy.position.y<=floor||damageClock<=0){enemy.position.y=Math.max(enemy.position.y,floor);explodeEnemy();return}}else{enemyTime+=dt;if(enemyPhase===0){enemy.position.addScaledVector(new THREE.Vector3(0,0,-1).applyQuaternion(enemy.quaternion),168*dt);if(enemyTime>2.05||enemy.position.distanceTo(ship.position)<82){enemyPhase=1;enemyTime=0}}else{const f=flatHeading().clone(),right=new THREE.Vector3().crossVectors(f,worldUp).normalize(),target=ship.position.clone().addScaledVector(f,235).addScaledVector(right,Math.sin(enemyTime*1.28)*175).addScaledVector(worldUp,18+Math.sin(enemyTime*.8)*32),dir=target.sub(enemy.position).normalize(),desired=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,-1),dir);enemy.quaternion.slerp(desired,1-Math.exp(-dt*1.45));enemy.position.addScaledVector(new THREE.Vector3(0,0,-1).applyQuaternion(enemy.quaternion),114*dt);const floor=terrainHeight(enemy.position.x,enemy.position.z)+14;if(enemy.position.y<floor)enemy.position.y=smooth(enemy.position.y,floor,dt,.16)}}enemyVel.copy(enemy.position).sub(lastEnemy).divideScalar(Math.max(dt,.001))}
function updateTargeting(dt){const t=targetGeometry();lockStrength=smooth(lockStrength,t.strength,dt,.1);if(t.hard&&!enemyDamaged)lockTimer=Math.min(.5,lockTimer+dt);else lockTimer=Math.max(0,lockTimer-dt*2.4);lockState=t.state?(lockTimer>.28?2:1):0;if(!enemyAlive){statusUI.style.opacity=0;reticle.className='';return}reticle.className=lockState===2?'lock':lockState===1?'track':'';statusUI.textContent=lockState===2?'LOCK':lockState===1?'TRACK':'';statusUI.style.opacity=lockState===2?.9:lockState===1?.44:0}
function updateGuidance(){if(!enemyAlive){targetUI.style.opacity=0;return}const to=enemy.position.clone().sub(camera.position),local=to.clone().applyQuaternion(camera.quaternion.clone().invert()),front=local.z<0,p=enemy.position.clone().project(camera),margin=46,onscreen=front&&Math.abs(p.x)<.88&&Math.abs(p.y)<.8;let sx,sy;if(onscreen){sx=(p.x*.5+.5)*innerWidth;sy=(-p.y*.5+.5)*innerHeight}else{let dx=local.x,dy=local.y;if(!front){dx=-dx;dy=-dy}const mag=Math.max(1,Math.hypot(dx,dy));dx/=mag;dy/=mag;const hw=innerWidth/2-margin,hh=innerHeight/2-margin,scale=Math.min(hw/Math.max(.001,Math.abs(dx)),hh/Math.max(.001,Math.abs(dy)));sx=innerWidth/2+dx*scale;sy=innerHeight/2-dy*scale}targetUI.style.left=sx+'px';targetUI.style.top=sy+'px';targetUI.style.opacity=enemyDamaged?.7:onscreen?.82:.96;targetUI.dataset.range=`CONTACT ${Math.round(enemy.position.distanceTo(ship.position))}`;targetUI.className=enemyDamaged?'guide':!onscreen?'offscreen':lockState===2?'lock':lockState===1?'track':'guide'}
function updateScope(dt){const c=scopeCtx;c.clearRect(0,0,96,96);const cx=48,cy=48,r=36;c.save();c.translate(cx,cy);c.lineWidth=.6;c.strokeStyle='rgba(255,240,176,.24)';c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.stroke();c.strokeStyle='rgba(255,240,176,.08)';c.beginPath();c.arc(0,0,r*.5,0,Math.PI*2);c.stroke();c.strokeStyle='rgba(255,240,176,.42)';c.beginPath();c.moveTo(-3,3);c.lineTo(0,-4);c.lineTo(3,3);c.stroke();if(enemyAlive){const rel=enemy.position.clone().sub(ship.position),flatDist=Math.hypot(rel.x,rel.z);scopeRange=smooth(scopeRange,THREE.MathUtils.clamp(Math.max(180,flatDist*1.2),180,980),dt,.5);const nose=flatHeading().clone(),right=new THREE.Vector3().crossVectors(nose,worldUp).normalize(),ahead=rel.x*nose.x+rel.z*nose.z,side=rel.x*right.x+rel.z*right.z;let x=side/scopeRange*r,y=-ahead/scopeRange*r;const rr=Math.hypot(x,y),limit=r-3;if(rr>limit){x=x/rr*limit;y=y/rr*limit}const p=enemy.position.clone().project(camera),onscreen=p.z>-1&&p.z<1&&Math.abs(p.x)<.88&&Math.abs(p.y)<.8&&ahead>0;scope.className=onscreen?'':'awake';c.translate(x,y);c.rotate(Math.PI/4);c.strokeStyle=lockState===2?'rgba(255,96,48,.95)':'rgba(255,188,72,.82)';c.fillStyle=enemyDamaged?'rgba(90,70,66,.5)':lockState===2?'rgba(255,96,48,.55)':'rgba(255,188,72,.12)';c.beginPath();c.rect(-3,-3,6,6);c.fill();c.stroke();scope.style.opacity=''}else{scope.className='';scope.style.opacity='.15'}c.restore()}

function updateCamera(dt){forward.set(0,0,-1).applyQuaternion(ship.quaternion).normalize();up.copy(worldUp).applyQuaternion(ship.quaternion);const bank=Math.atan2(up.x,up.y),turnInput=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),pitchInput=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),alt=Math.max(0,ship.position.y-terrainHeight(ship.position.x,ship.position.z));desiredCam.copy(ship.position).addScaledVector(forward,-10.4).addScaledVector(worldUp,6.0);desiredCam.x+=Math.sin(bank)*1.7;desiredCam.y+=camKick*(Math.random()-.5)*1.3;desiredCam.x+=camKick*(Math.random()-.5)*1.3;camera.position.lerp(desiredCam,1-Math.exp(-dt/.14));look.copy(ship.position).addScaledVector(forward,43).addScaledVector(worldUp,-7.4);look.x+=Math.sin(bank)*3.6;camera.lookAt(look);camera.rotateZ(-bank*.13);const effort=Math.min(1,Math.abs(turnInput)*.8+Math.abs(pitchInput)*.55),groundRush=THREE.MathUtils.clamp((70-alt)/70,0,1);camera.fov=smooth(camera.fov,68+effort*5+groundRush*2.2,dt,.17);camera.updateProjectionMatrix();sky.position.copy(camera.position);sunGlow.position.copy(camera.position).addScaledVector(sunDir,1750);sunTarget.position.copy(ship.position);sun.position.copy(ship.position).add(new THREE.Vector3(-480,540,320))}
function updateHUD(dt){if(objectiveClock>0){objectiveClock-=dt;if(objectiveClock<=0){objectiveUI.textContent='INTERCEPT CONTACT';objectiveUI.style.opacity='.34'}}}
function loop(){const dt=Math.min(clock.getDelta(),.033);updateFlight(dt);updateWorld();updateDust();updateEnemy(dt);updateCamera(dt);updateTargeting(dt);updateGuidance();updateScope(dt);updateWeapons(dt);updateHUD(dt);const alt=Math.max(0,ship.position.y-terrainHeight(ship.position.x,ship.position.z));document.getElementById('readout').textContent=`${Math.round(speed)} SPD / ${Math.round(alt)} ALT`;renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
