<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Emberwing — First Flight</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b88969;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none;-webkit-user-select:none;user-select:none}canvas{display:block;outline:none;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 8px #0009}#mark{position:absolute;top:max(18px,env(safe-area-inset-top));left:max(20px,env(safe-area-inset-left));font-size:11px;letter-spacing:.2em;font-weight:700}#readout{position:absolute;top:max(18px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));font-size:11px;letter-spacing:.12em}#hint{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.1em;opacity:.75;white-space:nowrap}#focus,#objective{position:absolute;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.16em}#focus{top:62%;padding:9px 12px;border:1px solid #ffffff55;background:#1b100d66;transition:opacity .2s}#objective{top:18%;font-weight:700;opacity:0;transition:opacity .35s}#reticle{position:absolute;left:50%;top:44%;width:24px;height:24px;transform:translate(-50%,-50%);border:2px solid #fff0b0;border-radius:50%;box-shadow:0 0 10px #ffb52b99}#reticle:before,#reticle:after{content:"";position:absolute;background:#fff0b0}#reticle:before{width:38px;height:2px;left:-9px;top:9px}#reticle:after{width:2px;height:38px;left:9px;top:-9px}#stick{position:absolute;width:72px;height:72px;border:1px solid #fff8;border-radius:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .12s}#stick:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff9;left:26px;top:26px;transform:translate(var(--dx,0px),var(--dy,0px))}#firetouch{position:absolute;right:max(26px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));font-size:9px;letter-spacing:.18em;opacity:0}#crash{position:absolute;inset:0;display:none;place-items:center;background:#160b08cc;font:700 18px ui-monospace;letter-spacing:.18em}#crash span{text-align:center}#crash small{display:block;margin-top:12px;font-size:10px;opacity:.7}@media(pointer:coarse){#hint{font-size:9px}#focus{display:none}#firetouch{opacity:.55}}</style></head><body><div id="hud"><div id="mark">EMBERWING / FIRST FLIGHT</div><div id="readout"></div><div id="objective">INTERCEPT</div><div id="reticle"></div><div id="focus">CLICK TO TAKE CONTROL</div><div id="stick"></div><div id="firetouch">HOLD RIGHT · FIRE</div><div id="hint">↑ ↓ PITCH · ← → BANK · SPACE FIRE · R RESET</div><div id="crash"><span>IMPACT<small>PRESS R TO FLY AGAIN</small></span></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xc69a78);scene.fog=new THREE.Fog(0xc69a78,180,1050);const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,1800),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.domElement.tabIndex=0;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffddbd,0x55352c,2.4));const sun=new THREE.DirectionalLight(0xffd29b,4.8);sun.position.set(-300,380,100);sun.castShadow=true;scene.add(sun);
const terrain=new THREE.PlaneGeometry(2200,2200,150,150);terrain.rotateX(-Math.PI/2);function terrainHeight(x,z){return Math.sin(x*.006)*13+Math.cos(z*.007)*12+Math.sin((x+z)*.003)*15+Math.abs(Math.sin(x*.012+Math.sin(z*.004)*1.5))*17+Math.sin(x*.04)*Math.cos(z*.037)*2.5-34}const tp=terrain.attributes.position;for(let i=0;i<tp.count;i++)tp.setY(i,terrainHeight(tp.getX(i),tp.getZ(i)));terrain.computeVertexNormals();const ground=new THREE.Mesh(terrain,new THREE.MeshStandardMaterial({color:0xa96d4b,roughness:.96}));ground.receiveShadow=true;scene.add(ground);
const sand=new THREE.MeshStandardMaterial({color:0xc7a47a,roughness:.92}),pale=new THREE.MeshStandardMaterial({color:0xd3b993,roughness:.9}),dark=new THREE.MeshStandardMaterial({color:0x5b463d,roughness:.9}),roadMat=new THREE.MeshStandardMaterial({color:0x72584a,roughness:1});function building(x,z,w,d,h,mat=sand){const y=terrainHeight(x,z),m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y+h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m)}function tower(x,z,h){const y=terrainHeight(x,z),m=new THREE.Mesh(new THREE.CylinderGeometry(.55,1.1,h,6),dark);m.position.set(x,y+h/2,z);m.castShadow=true;scene.add(m)}for(let i=0;i<52;i++){const x=(Math.random()-.5)*650,z=(Math.random()-.5)*800;building(x,z,10+Math.random()*24,10+Math.random()*24,7+Math.random()*25,Math.random()>.5?sand:pale)}for(let i=0;i<10;i++)tower((Math.random()-.5)*600,(Math.random()-.5)*700,24+Math.random()*35);for(const x of [-170,85,260]){const r=new THREE.Mesh(new THREE.BoxGeometry(5,.25,850),roadMat);r.position.set(x,terrainHeight(x,0)+.4,0);scene.add(r)}const rockMat=new THREE.MeshStandardMaterial({color:0x7d4d3b,roughness:1});for(let i=0;i<65;i++){const x=(Math.random()-.5)*1800,z=(Math.random()-.5)*1800;if(Math.abs(x)<380&&Math.abs(z)<480)continue;const h=6+Math.random()*35,w=3+Math.random()*10,m=new THREE.Mesh(new THREE.BoxGeometry(w,h,w*(.7+Math.random())),rockMat);m.position.set(x,terrainHeight(x,z)+h/2,z);m.rotation.y=Math.random()*Math.PI;m.castShadow=true;scene.add(m)}
function makeShip(enemy=false){const g=new THREE.Group(),hull=new THREE.MeshStandardMaterial({color:enemy?0x17191b:0x4a4b4b,roughness:.5,metalness:.35}),wingMat=new THREE.MeshStandardMaterial({color:enemy?0x282a2b:0x74716a,roughness:.55,metalness:.3}),canopy=new THREE.MeshStandardMaterial({color:0x101416,roughness:.25,metalness:.65});const f=new THREE.Mesh(new THREE.ConeGeometry(enemy?.8:1.35,enemy?6:8.8,5),hull);f.rotation.x=-Math.PI/2;f.position.z=-.6;f.castShadow=true;g.add(f);const c=new THREE.Mesh(new THREE.SphereGeometry(enemy?.55:.9,10,7),canopy);c.scale.set(.8,.42,1.55);c.position.set(0,enemy?.45:.72,-1.3);g.add(c);for(const s of [-1,1]){const w=new THREE.Mesh(new THREE.BoxGeometry(enemy?4.2:6.8,.22,enemy?1.15:1.55),wingMat);w.position.set(s*(enemy?2.1:3.25),0,.55);w.rotation.y=s*(enemy?.38:.22);w.castShadow=true;g.add(w);if(!enemy){const o=new THREE.Mesh(new THREE.BoxGeometry(3.5,.18,1.05),hull);o.position.set(s*7.1,.05,.1);o.rotation.y=s*.42;o.castShadow=true;g.add(o)}}const glow=new THREE.MeshBasicMaterial({color:enemy?0x6ecbff:0xff6a32});for(const x of enemy?[-1.3,1.3]:[-4.7,-1,1,4.7]){const e=new THREE.Mesh(new THREE.SphereGeometry(enemy?.22:.34,8,6),glow);e.scale.z=2.4;e.position.set(x,.05,enemy?2.1:2.85);g.add(e)}return g}const ship=makeShip();scene.add(ship);const enemy=makeShip(true);scene.add(enemy);let enemyAlive=true,enemyPhase=0,enemyTime=0;function resetEnemy(){enemyAlive=true;enemy.visible=true;enemyPhase=0;enemyTime=0;enemy.position.set(-260,92,10);enemy.rotation.set(0,-Math.PI/2,0)}
const shots=[],fireballMat=new THREE.MeshBasicMaterial({color:0xffb126}),coreMat=new THREE.MeshBasicMaterial({color:0xfff3b0}),burstMat=new THREE.MeshBasicMaterial({color:0xff6a24,transparent:true});let fireClock=0,gunSide=-1;function fire(){if(crashed)return;gunSide*=-1;const g=new THREE.Group(),ball=new THREE.Mesh(new THREE.SphereGeometry(.62,10,8),fireballMat),core=new THREE.Mesh(new THREE.SphereGeometry(.28,8,6),coreMat),tail=new THREE.Mesh(new THREE.ConeGeometry(.34,2.8,8),fireballMat);tail.rotation.x=-Math.PI/2;tail.position.z=1.25;g.add(ball,core,tail);const muzzle=new THREE.Vector3(gunSide*4.6,.05,-2.7).applyQuaternion(ship.quaternion).add(ship.position);g.position.copy(muzzle);g.quaternion.copy(ship.quaternion);const dir=new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion).normalize(),v=dir.clone().multiplyScalar(430);scene.add(g);shots.push({mesh:g,v,life:1.45})}function explode(pos){for(let i=0;i<22;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.25+Math.random()*.6,5,4),burstMat.clone());p.position.copy(pos);const v=new THREE.Vector3(Math.random()-.5,Math.random()-.2,Math.random()-.5).normalize().multiplyScalar(15+Math.random()*40);scene.add(p);shots.push({mesh:p,v,life:.65,particle:true})}}
const keys={},touch={x:0,y:0,firing:false,id:null,startX:0,startY:0};function key(e,down){const code=e.code||({' ':'Space','spacebar':'Space','arrowup':'ArrowUp','arrowdown':'ArrowDown','arrowleft':'ArrowLeft','arrowright':'ArrowRight','r':'KeyR'})[(e.key||'').toLowerCase()];if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyR'].includes(code)){e.preventDefault();keys[code]=down;if(down&&code==='Space'&&!e.repeat){fire();fireClock=.11}if(down&&code==='KeyR')reset();document.getElementById('focus').style.opacity='0'}}window.addEventListener('keydown',e=>key(e,true),{capture:true});window.addEventListener('keyup',e=>key(e,false),{capture:true});window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;touch.x=touch.y=0;touch.firing=false});renderer.domElement.addEventListener('pointerdown',()=>{renderer.domElement.focus({preventScroll:true});document.getElementById('focus').style.opacity='0'});
const isTouch=matchMedia('(pointer:coarse)').matches,stick=document.getElementById('stick'),hint=document.getElementById('hint');if(isTouch)hint.textContent='LEFT THUMB · FLY     RIGHT THUMB · FIRE';function setStick(x,y){const dx=Math.max(-34,Math.min(34,x-touch.startX)),dy=Math.max(-34,Math.min(34,y-touch.startY));touch.x=dx/34;touch.y=dy/34;stick.style.setProperty('--dx',dx+'px');stick.style.setProperty('--dy',dy+'px')}renderer.domElement.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.clientX<innerWidth*.55&&touch.id===null){touch.id=t.identifier;touch.startX=t.clientX;touch.startY=t.clientY;stick.style.left=t.clientX+'px';stick.style.top=t.clientY+'px';stick.style.opacity='.7';setStick(t.clientX,t.clientY)}else if(t.clientX>=innerWidth*.45){touch.firing=true;fire();fireClock=.11}}},{passive:false});renderer.domElement.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===touch.id)setStick(t.clientX,t.clientY)},{passive:false});function endTouch(e){e.preventDefault();for(const t of e.changedTouches){if(t.identifier===touch.id){touch.id=null;touch.x=touch.y=0;stick.style.opacity='0'}else if(t.clientX>=innerWidth*.4)touch.firing=false}if(e.touches.length===0)touch.firing=false}renderer.domElement.addEventListener('touchend',endTouch,{passive:false});renderer.domElement.addEventListener('touchcancel',endTouch,{passive:false});
let speed=108,pitchRate=0,rollRate=0,crashed=false;const clock=new THREE.Clock(),forward=new THREE.Vector3(),up=new THREE.Vector3(),desiredCam=new THREE.Vector3(),look=new THREE.Vector3(),worldUp=new THREE.Vector3(0,1,0),qPitch=new THREE.Quaternion(),qRoll=new THREE.Quaternion(),qYaw=new THREE.Quaternion(),axisX=new THREE.Vector3(1,0,0),axisZ=new THREE.Vector3(0,0,1),axisY=new THREE.Vector3(0,1,0);function smooth(a,b,dt,t){return THREE.MathUtils.lerp(a,b,1-Math.exp(-dt/t))}function reset(){ship.position.set(0,82,330);ship.quaternion.identity();speed=108;pitchRate=rollRate=0;crashed=false;document.getElementById('crash').style.display='none';document.getElementById('objective').textContent='INTERCEPT';document.getElementById('objective').style.opacity='0';camera.position.set(0,96,346);for(const s of shots)scene.remove(s.mesh);shots.length=0;resetEnemy()}reset();
function updateFlight(dt){if(crashed)return;const pi=touch.id!==null?touch.y:(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),ri=touch.id!==null?touch.x:(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);pitchRate=smooth(pitchRate,pi*1.02,dt,.25);rollRate=smooth(rollRate,ri*1.72,dt,.22);qPitch.setFromAxisAngle(axisX,pitchRate*dt);qRoll.setFromAxisAngle(axisZ,-rollRate*dt);ship.quaternion.multiply(qPitch).multiply(qRoll).normalize();up.copy(worldUp).applyQuaternion(ship.quaternion);const bank=Math.atan2(up.x,up.y);qYaw.setFromAxisAngle(axisY,-bank*.44*dt);ship.quaternion.premultiply(qYaw).normalize();forward.set(0,0,-1).applyQuaternion(ship.quaternion).normalize();ship.position.addScaledVector(forward,speed*dt);const floor=terrainHeight(ship.position.x,ship.position.z)+2.4;if(ship.position.y<floor){ship.position.y=floor;crashed=true;document.getElementById('crash').style.display='grid'}if(Math.abs(ship.position.x)>1000||Math.abs(ship.position.z)>1000)reset()}
function updateEnemy(dt){if(!enemyAlive)return;enemyTime+=dt;if(enemyPhase===0){enemy.position.x+=145*dt;enemy.position.z+=12*dt;if(enemy.position.x>230){enemyPhase=1;document.getElementById('objective').style.opacity='1'}}else{const target=ship.position.clone().add(new THREE.Vector3(Math.sin(enemyTime*.62)*145,30+Math.sin(enemyTime)*24,-235)),dir=target.sub(enemy.position).normalize(),desired=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,-1),dir);enemy.quaternion.slerp(desired,1-Math.exp(-dt*.9));enemy.position.addScaledVector(new THREE.Vector3(0,0,-1).applyQuaternion(enemy.quaternion),98*dt);const floor=terrainHeight(enemy.position.x,enemy.position.z)+18;if(enemy.position.y<floor)enemy.position.y=smooth(enemy.position.y,floor,dt,.2)}}function updateWeapons(dt){fireClock-=dt;if((keys.Space||touch.firing)&&fireClock<=0){fire();fireClock=.11}for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.mesh.position.addScaledVector(s.v,dt);s.life-=dt;if(!s.particle&&enemyAlive&&s.mesh.position.distanceTo(enemy.position)<8.5){enemyAlive=false;enemy.visible=false;explode(enemy.position);document.getElementById('objective').textContent='SPLASH ONE';document.getElementById('objective').style.opacity='1';scene.remove(s.mesh);shots.splice(i,1);continue}if(s.particle){s.v.y-=30*dt;s.mesh.material.opacity=Math.max(0,s.life/.65)}if(s.life<=0){scene.remove(s.mesh);shots.splice(i,1)}}}
function updateCamera(dt){forward.set(0,0,-1).applyQuaternion(ship.quaternion).normalize();up.copy(worldUp).applyQuaternion(ship.quaternion);const bank=Math.atan2(up.x,up.y);desiredCam.copy(ship.position).addScaledVector(forward,-11.5).addScaledVector(worldUp,8.4);desiredCam.x+=Math.sin(bank)*1.2;camera.position.lerp(desiredCam,1-Math.exp(-dt/.22));look.copy(ship.position).addScaledVector(forward,31).addScaledVector(worldUp,-4.8);camera.lookAt(look);camera.rotateZ(-bank*.08)}function loop(){const dt=Math.min(clock.getDelta(),.033);updateFlight(dt);updateEnemy(dt);updateWeapons(dt);updateCamera(dt);const alt=Math.max(0,ship.position.y-terrainHeight(ship.position.x,ship.position.z));document.getElementById('readout').textContent=`${Math.round(speed)} SPD / ${Math.round(alt)} ALT`;renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
