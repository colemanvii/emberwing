<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emberwing — First Flight</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a86f58;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}canvas{display:block;outline:none}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 10px #32180daa}#grade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 38%,rgba(50,19,14,.06) 66%,rgba(31,12,10,.22) 100%),linear-gradient(180deg,rgba(78,47,72,.06),transparent 34%,rgba(255,131,51,.025));mix-blend-mode:multiply}#mark{position:absolute;top:20px;left:22px;font-size:10px;letter-spacing:.24em;font-weight:700;color:#fff7e7;opacity:.82}#score{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.22em;color:#fff1d0;opacity:.62}#readout{position:absolute;top:20px;right:22px;font-size:10px;letter-spacing:.14em;color:#fff7e7;opacity:.74}#hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.12em;opacity:.42;white-space:nowrap}#focus,#objective{position:absolute;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.2em;color:#fff6de}#focus{top:64%;padding:8px 11px;border:1px solid #fff4cf38;background:#28140e45;transition:opacity .25s}#objective{top:17%;font-weight:700;opacity:0;transition:opacity .35s}#reticle{position:absolute;left:50%;top:43%;width:24px;height:24px;transform:translate(-50%,-50%);border:1px solid #fff0b0d9;border-radius:50%;box-shadow:0 0 12px #ffb52b45;transition:border-color .12s,box-shadow .12s,transform .12s}#reticle:before,#reticle:after{content:"";position:absolute;background:#fff0b0d9;transition:background .12s}#reticle:before{width:36px;height:1px;left:-7px;top:11px}#reticle:after{width:1px;height:36px;left:11px;top:-7px}#reticle.track{border-color:#ffbb43;box-shadow:0 0 14px #ff8a1f75}#reticle.track:before,#reticle.track:after{background:#ffbb43}#reticle.lock{border-color:#ff6030;box-shadow:0 0 18px #ff4b2499;transform:translate(-50%,-50%) scale(.84)}#reticle.lock:before,#reticle.lock:after{background:#ff6030}#target{position:absolute;width:31px;height:31px;opacity:0;transform:translate(-50%,-50%) rotate(45deg);border:1px solid #fff0b0a8;transition:opacity .1s,border-color .1s,box-shadow .1s;filter:drop-shadow(0 0 5px #47221488)}#target:after{content:attr(data-range);position:absolute;left:22px;top:-3px;transform:rotate(-45deg);transform-origin:left center;font-size:8px;letter-spacing:.15em;color:#fff4cf;white-space:nowrap;text-shadow:0 2px 7px #32180ddd}#target.guide{border-color:#fff0b0b8;box-shadow:0 0 11px #fff0b022}#target.offscreen{border-color:#fff4cf;box-shadow:0 0 15px #ffba4055}#target.track{border-color:#ffbb43;box-shadow:0 0 13px #ff8a1f55}#target.lock{border-color:#ff6030;box-shadow:0 0 17px #ff4b2488}#status{position:absolute;left:50%;top:48%;transform:translateX(-50%);font-size:8px;letter-spacing:.25em;color:#ffd27a;opacity:0;transition:opacity .12s}#scope{position:absolute;left:20px;bottom:18px;width:110px;height:110px;opacity:.34;transition:opacity .18s,transform .18s;filter:drop-shadow(0 2px 8px #0007)}#scope.awake{opacity:.86;transform:scale(1.025)}#crash{position:absolute;inset:0;display:none;place-items:center;background:#160b08cc;font:700 17px ui-monospace;letter-spacing:.2em}#crash span{text-align:center}#crash small{display:block;margin-top:12px;font-size:9px;opacity:.64}
</style>
</head>
<body>
<div id="hud"><div id="grade"></div><div id="mark">EMBERWING / FIRST FLIGHT</div><div id="score">SPLASH 00</div><div id="readout"></div><div id="objective">INTERCEPT CONTACT</div><div id="reticle"></div><div id="target" data-range="CONTACT"></div><div id="status"></div><canvas id="scope" width="220" height="220"></canvas><div id="focus">CLICK TO TAKE CONTROL</div><div id="hint">↑ ↓ PITCH · ← → BANK · SPACE FIRE · R RESET</div><div id="crash"><span>IMPACT<small>PRESS R TO FLY AGAIN</small></span></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene=new THREE.Scene();
const hazeColor=new THREE.Color(0xcd9272);scene.background=hazeColor;scene.fog=new THREE.Fog(hazeColor,170,1180);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,2600);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;renderer.domElement.tabIndex=0;document.body.prepend(renderer.domElement);

const sky=new THREE.Mesh(new THREE.SphereGeometry(1900,32,18),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,vertexShader:'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'varying float h;void main(){vec3 zen=vec3(0.37,0.24,0.33);vec3 hor=vec3(0.82,0.56,0.43);vec3 low=vec3(0.92,0.55,0.27);float a=smoothstep(-0.08,0.52,h);vec3 c=mix(hor,zen,a);c=mix(low,c,smoothstep(-0.34,0.05,h));gl_FragColor=vec4(c,1.0);}'}));scene.add(sky);
function glowTexture(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,244,199,1)');g.addColorStop(.12,'rgba(255,190,104,.9)');g.addColorStop(.42,'rgba(255,139,68,.24)');g.addColorStop(1,'rgba(255,120,40,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
const sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture(),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));sunGlow.position.set(-620,390,-1250);sunGlow.scale.set(260,260,1);scene.add(sunGlow);
scene.add(new THREE.HemisphereLight(0xffdec3,0x4b2c2b,2.5));const sun=new THREE.DirectionalLight(0xffce92,5.2);sun.position.set(-360,430,120);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-420;sun.shadow.camera.right=420;sun.shadow.camera.top=420;sun.shadow.camera.bottom=-420;scene.add(sun);

function terrainHeight(x,z){return Math.sin(x*.0055)*15+Math.cos(z*.0068)*13+Math.sin((x+z)*.0028)*17+Math.abs(Math.sin(x*.0115+Math.sin(z*.004)*1.4))*18+Math.sin(x*.038)*Math.cos(z*.035)*2.8-38}
const TERRAIN_SIZE=3200,TERRAIN_SEG=160,TERRAIN_STEP=520;
const terrain=new THREE.PlaneGeometry(TERRAIN_SIZE,TERRAIN_SIZE,TERRAIN_SEG,TERRAIN_SEG);terrain.rotateX(-Math.PI/2);const tp=terrain.attributes.position;
const tcol=new Float32Array(tp.count*3);terrain.setAttribute('color',new THREE.BufferAttribute(tcol,3));
const lowC=new THREE.Color(0x8f503c),midC=new THREE.Color(0xc8754c),highC=new THREE.Color(0xe0a06a),shadeC=new THREE.Color();let terrainCX=0,terrainCZ=0;
function rebuildTerrain(cx,cz){terrainCX=cx;terrainCZ=cz;for(let i=0;i<tp.count;i++){const wx=tp.getX(i)+cx,wz=tp.getZ(i)+cz,y=terrainHeight(wx,wz);tp.setY(i,y);const n=THREE.MathUtils.clamp((y+70)/92,0,1),variation=.5+.5*Math.sin(wx*.021+wz*.013);shadeC.copy(lowC).lerp(midC,Math.min(1,n*1.35)).lerp(highC,Math.max(0,(n-.58)*1.8));shadeC.offsetHSL(0,0,(variation-.5)*.035);tcol[i*3]=shadeC.r;tcol[i*3+1]=shadeC.g;tcol[i*3+2]=shadeC.b}tp.needsUpdate=true;terrain.attributes.color.needsUpdate=true;terrain.computeVertexNormals();ground.position.set(cx,0,cz)}
const ground=new THREE.Mesh(terrain,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.98,metalness:0}));ground.receiveShadow=true;scene.add(ground);rebuildTerrain(0,0);

const sand=new THREE.MeshStandardMaterial({color:0xc99266,roughness:.88}),pale=new THREE.MeshStandardMaterial({color:0xdab083,roughness:.9}),stone=new THREE.MeshStandardMaterial({color:0x9b664f,roughness:.96}),dark=new THREE.MeshStandardMaterial({color:0x4d3a36,roughness:.86}),roofMat=new THREE.MeshStandardMaterial({color:0x735347,roughness:.9}),rockMat=new THREE.MeshStandardMaterial({color:0x774a3d,roughness:1}),beaconMat=new THREE.MeshBasicMaterial({color:0xff7436});
const scenery=[];
function makeBuilding(){const g=new THREE.Group(),w=10+Math.random()*24,d=10+Math.random()*23,h=8+Math.random()*27,body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),Math.random()>.48?sand:pale);body.position.y=h/2;body.castShadow=body.receiveShadow=true;g.add(body);const cap=new THREE.Mesh(new THREE.BoxGeometry(w*.72,1.1,d*.72),roofMat);cap.position.y=h+.55;cap.castShadow=true;g.add(cap);if(Math.random()>.52){const vent=new THREE.Mesh(new THREE.CylinderGeometry(.55,.75,2.8,6),dark);vent.position.set((Math.random()-.5)*w*.45,h+1.9,(Math.random()-.5)*d*.4);vent.castShadow=true;g.add(vent)}g.userData.kind='building';g.userData.h=h+2.8;g.rotation.y=Math.random()*Math.PI*.5;scene.add(g);scenery.push(g)}
function makeTower(){const g=new THREE.Group(),h=25+Math.random()*42,mast=new THREE.Mesh(new THREE.CylinderGeometry(.48,1.35,h,7),dark);mast.position.y=h/2;mast.castShadow=true;g.add(mast);const ring=new THREE.Mesh(new THREE.TorusGeometry(3.1,.25,6,18),stone);ring.rotation.x=Math.PI/2;ring.position.y=h*.72;ring.castShadow=true;g.add(ring);const beacon=new THREE.Mesh(new THREE.SphereGeometry(.55,8,6),beaconMat);beacon.position.y=h+1;g.add(beacon);g.userData.kind='tower';g.userData.h=h+2;scene.add(g);scenery.push(g)}
function makeRock(){const h=6+Math.random()*34,w=4+Math.random()*11,m=new THREE.Mesh(new THREE.DodecahedronGeometry(1,0),rockMat);m.scale.set(w,h,w*(.72+Math.random()*.38));m.userData.kind='rock';m.userData.h=h*2;m.rotation.set(Math.random()*.3,Math.random()*Math.PI,Math.random()*.18);m.castShadow=true;scene.add(m);scenery.push(m)}
for(let i=0;i<92;i++)makeBuilding();for(let i=0;i<18;i++)makeTower();for(let i=0;i<145;i++)makeRock();

function makeShip(enemy=false){const g=new THREE.Group();const hull=new THREE.MeshStandardMaterial({color:enemy?0x151719:0x383b3c,roughness:.4,metalness:.48}),wingMat=new THREE.MeshStandardMaterial({color:enemy?0x24272a:0x676560,roughness:.5,metalness:.38}),edgeMat=new THREE.MeshStandardMaterial({color:enemy?0x101214:0x24282a,roughness:.44,metalness:.5}),canopy=new THREE.MeshStandardMaterial({color:0x0b1115,roughness:.16,metalness:.78});const f=new THREE.Mesh(new THREE.ConeGeometry(enemy?.9:1.45,enemy?6.5:9.6,6),hull);f.rotation.x=-Math.PI/2;f.position.z=-1;f.castShadow=true;g.add(f);const spine=new THREE.Mesh(new THREE.BoxGeometry(enemy?1.2:1.7,enemy?.35:.42,enemy?5.4:7.8),edgeMat);spine.position.set(0,.05,.45);spine.castShadow=true;g.add(spine);const c=new THREE.Mesh(new THREE.SphereGeometry(enemy?.58:.95,12,8),canopy);c.scale.set(.82,.44,1.65);c.position.set(0,enemy?.5:.78,-1.65);g.add(c);for(const s of [-1,1]){const inner=new THREE.Mesh(new THREE.BoxGeometry(enemy?4.4:5.7,enemy?.22:.28,enemy?2.25:3.35),wingMat);inner.position.set(s*(enemy?2.35:3.65),0,.55);inner.rotation.y=s*(enemy?.4:.3);inner.castShadow=true;g.add(inner);if(!enemy){const outer=new THREE.Mesh(new THREE.BoxGeometry(2.9,.22,2.5),edgeMat);outer.position.set(s*6.75,.03,1.05);outer.rotation.y=s*.58;outer.castShadow=true;g.add(outer);const fin=new THREE.Mesh(new THREE.BoxGeometry(.22,1.7,2.5),edgeMat);fin.position.set(s*2.45,.85,2.15);fin.rotation.z=-s*.12;fin.castShadow=true;g.add(fin)}}const glow=new THREE.MeshBasicMaterial({color:enemy?0x70d4ff:0xff6a32});const exhaust=new THREE.MeshBasicMaterial({color:enemy?0x75d7ff:0xff7b32,transparent:true,opacity:.48,blending:THREE.AdditiveBlending,depthWrite:false});for(const x of enemy?[-1.35,1.35]:[-4.65,-1.25,1.25,4.65]){const nacelle=new THREE.Mesh(new THREE.CylinderGeometry(enemy?.3:.48,enemy?.38:.58,enemy?2.2:3.1,8),edgeMat);nacelle.rotation.x=Math.PI/2;nacelle.position.set(x,-.02,1.75);g.add(nacelle);const e=new THREE.Mesh(new THREE.SphereGeometry(enemy?.25:.4,9,6),glow);e.scale.z=1.8;e.position.set(x,.02,3.28);g.add(e);const plume=new THREE.Mesh(new THREE.ConeGeometry(enemy?.24:.36,enemy?1.8:2.8,8),exhaust);plume.rotation.x=-Math.PI/2;plume.position.set(x,.02,4.55);g.add(plume)}return g}
const ship=makeShip();scene.add(ship);const enemy=makeShip(true);scene.add(enemy);

const worldUp=new THREE.Vector3(0,1,0),tmpForward=new THREE.Vector3(),tmpRight=new THREE.Vector3();
function flatHeading(){tmpForward.set(0,0,-1).applyQuaternion(ship.quaternion);tmpForward.y=0;if(tmpForward.lengthSq()<.001)tmpForward.set(0,0,-1);return tmpForward.normalize()}
function placeScenery(m,initial=false){let x,z;if(initial){const a=Math.random()*Math.PI*2,r=55+Math.random()*1180;x=ship.position.x+Math.sin(a)*r;z=ship.position.z+Math.cos(a)*r}else{const f=flatHeading().clone(),right=tmpRight.crossVectors(f,worldUp).normalize(),ahead=360+Math.random()*980,side=(Math.random()-.5)*1350;x=ship.position.x+f.x*ahead+right.x*side;z=ship.position.z+f.z*ahead+right.z*side}m.position.set(x,terrainHeight(x,z),z);if(m.userData.kind==='rock')m.rotation.y=Math.random()*Math.PI;if(m.userData.kind==='building')m.rotation.y=Math.round(Math.random()*3)*Math.PI/2+(Math.random()-.5)*.08}
function resetScenery(){for(const m of scenery)placeScenery(m,true)}
function updateWorld(){if(Math.abs(ship.position.x-terrainCX)>TERRAIN_STEP||Math.abs(ship.position.z-terrainCZ)>TERRAIN_STEP){const cx=Math.round(ship.position.x/TERRAIN_STEP)*TERRAIN_STEP,cz=Math.round(ship.position.z/TERRAIN_STEP)*TERRAIN_STEP;rebuildTerrain(cx,cz)}for(const m of scenery){const dx=m.position.x-ship.position.x,dz=m.position.z-ship.position.z;if(dx*dx+dz*dz>1300*1300)placeScenery(m,false)}}

let enemyAlive=true,enemyPhase=0,enemyTime=0,enemyVel=new THREE.Vector3(),lastEnemy=new THREE.Vector3(),respawnClock=0,kills=0,spawnSide=-1,objectiveClock=0;
const objectiveUI=document.getElementById('objective');function announce(text,seconds=1.4){objectiveUI.textContent=text;objectiveUI.style.opacity='1';objectiveClock=seconds}
function spawnEnemy(first=false){enemyAlive=true;enemy.visible=true;enemyPhase=0;enemyTime=0;spawnSide*=-1;const f=flatHeading().clone(),right=new THREE.Vector3().crossVectors(f,worldUp).normalize(),dist=first?340:360,side=spawnSide*(first?105:220);enemy.position.copy(ship.position).addScaledVector(f,dist).addScaledVector(right,side);enemy.position.y=Math.max(enemy.position.y+(first?28:45),terrainHeight(enemy.position.x,enemy.position.z)+55);const cross=ship.position.clone().addScaledVector(f,-60).addScaledVector(right,-side*.75);cross.y=ship.position.y+20;enemy.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1),cross.sub(enemy.position).normalize());enemyVel.set(0,0,0);lastEnemy.copy(enemy.position);announce(first?'INTERCEPT CONTACT':'NEW CONTACT',first?2.2:1.2)}

const shots=[],fireballMat=new THREE.MeshBasicMaterial({color:0xffa51f}),coreMat=new THREE.MeshBasicMaterial({color:0xffffd0}),burstMat=new THREE.MeshBasicMaterial({color:0xff6128,transparent:true});let fireClock=0,gunSide=-1,lockStrength=0,lockState=0;
const reticle=document.getElementById('reticle'),targetUI=document.getElementById('target'),statusUI=document.getElementById('status'),scope=document.getElementById('scope'),scopeCtx=scope.getContext('2d'),scoreUI=document.getElementById('score');scopeCtx.scale(2,2);let scopeRange=280;
function targeting(){if(!enemyAlive)return{state:0,strength:0};const to=enemy.position.clone().sub(ship.position),dist=to.length(),dir=to.clone().normalize(),nose=new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion),dot=nose.dot(dir),angle=Math.acos(THREE.MathUtils.clamp(dot,-1,1));if(dist>700||dot<0)return{state:0,strength:0};const acquire=THREE.MathUtils.degToRad(25),hard=THREE.MathUtils.degToRad(10);if(angle<acquire){const s=1-THREE.MathUtils.clamp((angle-hard)/(acquire-hard),0,1);return{state:angle<hard?2:1,strength:.35+.65*s,dist}}return{state:0,strength:0}}
function fire(){if(crashed)return;gunSide*=-1;const g=new THREE.Group(),ball=new THREE.Mesh(new THREE.SphereGeometry(.7,10,8),fireballMat),core=new THREE.Mesh(new THREE.SphereGeometry(.3,8,6),coreMat),tail=new THREE.Mesh(new THREE.ConeGeometry(.38,3.2,8),fireballMat);tail.rotation.x=-Math.PI/2;tail.position.z=1.45;g.add(ball,core,tail);const muzzle=new THREE.Vector3(gunSide*4.6,.05,-2.7).applyQuaternion(ship.quaternion).add(ship.position);g.position.copy(muzzle);let dir=new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion).normalize();const t=targeting();if(t.state){const time=Math.min(1.15,t.dist/430),lead=enemy.position.clone().addScaledVector(enemyVel,time),assist=lead.sub(muzzle).normalize();dir.lerp(assist,t.state===2?.82:.48*t.strength).normalize()}g.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1),dir);scene.add(g);shots.push({mesh:g,v:dir.multiplyScalar(430),life:1.55})}
function explode(pos){for(let i=0;i<32;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.22+Math.random()*.72,5,4),burstMat.clone());p.position.copy(pos);const v=new THREE.Vector3(Math.random()-.5,Math.random()-.13,Math.random()-.5).normalize().multiplyScalar(18+Math.random()*52);scene.add(p);shots.push({mesh:p,v,life:.82,particle:true})}}

const keys={};function key(e,down){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyR'].includes(e.code)){e.preventDefault();keys[e.code]=down;if(down&&e.code==='Space'&&!e.repeat){fire();fireClock=.105}if(down&&e.code==='KeyR')reset();document.getElementById('focus').style.opacity='0'}}window.addEventListener('keydown',e=>key(e,true),{capture:true});window.addEventListener('keyup',e=>key(e,false),{capture:true});window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});renderer.domElement.addEventListener('pointerdown',()=>{renderer.domElement.focus({preventScroll:true});document.getElementById('focus').style.opacity='0'});

let speed=122,pitchRate=0,rollRate=0,crashed=false;const clock=new THREE.Clock(),forward=new THREE.Vector3(),up=new THREE.Vector3(),desiredCam=new THREE.Vector3(),look=new THREE.Vector3(),qPitch=new THREE.Quaternion(),qRoll=new THREE.Quaternion(),qYaw=new THREE.Quaternion(),axisX=new THREE.Vector3(1,0,0),axisZ=new THREE.Vector3(0,0,1),axisY=new THREE.Vector3(0,1,0);function smooth(a,b,dt,t){return THREE.MathUtils.lerp(a,b,1-Math.exp(-dt/t))}
function reset(){ship.position.set(0,68,330);ship.quaternion.identity();speed=122;pitchRate=rollRate=0;crashed=false;kills=0;respawnClock=0;objectiveClock=0;lockStrength=lockState=0;scopeRange=280;scoreUI.textContent='SPLASH 00';document.getElementById('crash').style.display='none';targetUI.style.opacity=0;statusUI.style.opacity=0;reticle.className='';camera.position.set(0,76,342);for(const s of shots)scene.remove(s.mesh);shots.length=0;rebuildTerrain(0,0);resetScenery();spawnEnemy(true)}reset();

function updateFlight(dt){if(crashed)return;const pi=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),ri=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);pitchRate=smooth(pitchRate,pi*1.14,dt,.16);rollRate=smooth(rollRate,ri*1.92,dt,.14);qPitch.setFromAxisAngle(axisX,pitchRate*dt);qRoll.setFromAxisAngle(axisZ,-rollRate*dt);ship.quaternion.multiply(qPitch).multiply(qRoll).normalize();up.copy(worldUp).applyQuaternion(ship.quaternion);const bank=Math.atan2(up.x,up.y);qYaw.setFromAxisAngle(axisY,-bank*.52*dt);ship.quaternion.premultiply(qYaw).normalize();forward.set(0,0,-1).applyQuaternion(ship.quaternion).normalize();ship.position.addScaledVector(forward,speed*dt);const floor=terrainHeight(ship.position.x,ship.position.z)+2.4;if(ship.position.y<floor){ship.position.y=floor;crashed=true;document.getElementById('crash').style.display='grid'}}
function updateEnemy(dt){if(!enemyAlive){if(respawnClock>0){respawnClock-=dt;if(respawnClock<=0)spawnEnemy(false)}return}lastEnemy.copy(enemy.position);enemyTime+=dt;if(enemyPhase===0){enemy.position.addScaledVector(new THREE.Vector3(0,0,-1).applyQuaternion(enemy.quaternion),165*dt);if(enemyTime>2.25||enemy.position.distanceTo(ship.position)<95){enemyPhase=1;enemyTime=0}}else{const f=flatHeading().clone(),right=new THREE.Vector3().crossVectors(f,worldUp).normalize(),target=ship.position.clone().addScaledVector(f,230).addScaledVector(right,Math.sin(enemyTime*1.15)*155).addScaledVector(worldUp,25+Math.sin(enemyTime*.72)*24),dir=target.sub(enemy.position).normalize(),desired=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,-1),dir);enemy.quaternion.slerp(desired,1-Math.exp(-dt*1.35));enemy.position.addScaledVector(new THREE.Vector3(0,0,-1).applyQuaternion(enemy.quaternion),112*dt);const floor=terrainHeight(enemy.position.x,enemy.position.z)+16;if(enemy.position.y<floor)enemy.position.y=smooth(enemy.position.y,floor,dt,.18)}enemyVel.copy(enemy.position).sub(lastEnemy).divideScalar(Math.max(dt,.001))}
function updateTargeting(dt){const t=targeting();lockStrength=smooth(lockStrength,t.strength,dt,.12);lockState=t.state;if(!enemyAlive){targetUI.style.opacity=0;statusUI.style.opacity=0;reticle.className='';return}const projected=enemy.position.clone().project(camera),toCam=enemy.position.clone().sub(camera.position),camForward=new THREE.Vector3();camera.getWorldDirection(camForward);const inFront=camForward.dot(toCam)>0;let sx=projected.x,sy=-projected.y;if(!inFront){sx=-sx;sy=-sy;if(Math.hypot(sx,sy)<.18)sy=.9}const onScreen=inFront&&Math.abs(sx)<.86&&Math.abs(sy)<.74;if(!onScreen){if(Math.abs(sx)<.02&&Math.abs(sy)<.02)sy=.9;const scale=Math.min(.86/Math.max(.001,Math.abs(sx)),.74/Math.max(.001,Math.abs(sy)));sx*=scale;sy*=scale}targetUI.style.left=((sx*.5+.5)*innerWidth)+'px';targetUI.style.top=((sy*.5+.5)*innerHeight)+'px';targetUI.dataset.range=`CONTACT ${Math.round(enemy.position.distanceTo(ship.position))}`;targetUI.style.opacity=onScreen?(t.state?Math.min(1,.58+lockStrength):.58):.94;targetUI.className=t.state===2?'lock':(t.state===1&&onScreen?'track':('guide'+(!onScreen?' offscreen':'')));if(!t.state){statusUI.style.opacity=0;reticle.className='';return}reticle.className=t.state===2?'lock':'track';statusUI.textContent=t.state===2?'LOCK':'TRACK';statusUI.style.opacity=t.state===2?.9:.48}
function updateScope(dt){const c=scopeCtx;c.clearRect(0,0,110,110);const cx=55,cy=55,r=42;c.save();c.translate(cx,cy);c.lineWidth=.65;c.strokeStyle='rgba(255,240,176,.28)';c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.stroke();c.strokeStyle='rgba(255,240,176,.09)';c.beginPath();c.arc(0,0,r*.5,0,Math.PI*2);c.stroke();c.strokeStyle='rgba(255,240,176,.48)';c.beginPath();c.moveTo(0,-r-3);c.lineTo(0,-r+3);c.stroke();c.beginPath();c.moveTo(-3.5,3.5);c.lineTo(0,-4.5);c.lineTo(3.5,3.5);c.stroke();if(enemyAlive){const rel=enemy.position.clone().sub(ship.position),flatDist=Math.hypot(rel.x,rel.z);scopeRange=smooth(scopeRange,THREE.MathUtils.clamp(Math.max(180,flatDist*1.22),180,950),dt,.55);const nose=flatHeading().clone(),right=new THREE.Vector3().crossVectors(nose,worldUp).normalize(),ahead=rel.x*nose.x+rel.z*nose.z,side=rel.x*right.x+rel.z*right.z;let x=side/scopeRange*r,y=-ahead/scopeRange*r;const rr=Math.hypot(x,y),limit=r-4;if(rr>limit){x=x/rr*limit;y=y/rr*limit}const p=enemy.position.clone().project(camera),onscreen=p.z>-1&&p.z<1&&Math.abs(p.x)<.88&&Math.abs(p.y)<.82&&ahead>0;scope.className=onscreen?'':'awake';if(!onscreen){c.strokeStyle='rgba(255,177,38,.16)';c.beginPath();c.moveTo(0,0);c.lineTo(x,y);c.stroke()}const pulse=.78+.22*Math.sin(performance.now()*.012);c.translate(x,y);c.rotate(Math.PI/4);c.strokeStyle=lockState===2?`rgba(255,100,46,${pulse})`:'rgba(255,177,38,.86)';c.fillStyle=lockState===2?'rgba(255,100,46,.66)':'rgba(255,177,38,.14)';c.lineWidth=1;c.beginPath();c.rect(-3.3,-3.3,6.6,6.6);c.fill();c.stroke();scope.style.opacity=''}else{scope.className='';scope.style.opacity='.2'}c.restore()}
function updateWeapons(dt){fireClock-=dt;if(keys.Space&&fireClock<=0){fire();fireClock=.105}for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.mesh.position.addScaledVector(s.v,dt);s.life-=dt;if(!s.particle&&enemyAlive&&s.mesh.position.distanceTo(enemy.position)<8.5){enemyAlive=false;enemy.visible=false;explode(enemy.position);kills++;scoreUI.textContent=`SPLASH ${String(kills).padStart(2,'0')}`;announce('SPLASH',1.05);respawnClock=1.45;targetUI.style.opacity=0;statusUI.style.opacity=0;reticle.className='';scene.remove(s.mesh);shots.splice(i,1);continue}if(s.particle){s.v.y-=30*dt;s.mesh.material.opacity=Math.max(0,s.life/.82)}if(s.life<=0){scene.remove(s.mesh);shots.splice(i,1)}}}
function updateCamera(dt){forward.set(0,0,-1).applyQuaternion(ship.quaternion).normalize();up.copy(worldUp).applyQuaternion(ship.quaternion);const bank=Math.atan2(up.x,up.y),turnInput=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),pitchInput=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);desiredCam.copy(ship.position).addScaledVector(forward,-10.2).addScaledVector(worldUp,6.15);desiredCam.x+=Math.sin(bank)*1.55;camera.position.lerp(desiredCam,1-Math.exp(-dt/.15));look.copy(ship.position).addScaledVector(forward,39).addScaledVector(worldUp,-6.7);look.x+=Math.sin(bank)*3.2;camera.lookAt(look);camera.rotateZ(-bank*.12);const effort=Math.min(1,Math.abs(turnInput)*.8+Math.abs(pitchInput)*.55);camera.fov=smooth(camera.fov,69+effort*5,dt,.18);camera.updateProjectionMatrix();sky.position.copy(camera.position)}
function updateHUD(dt){if(objectiveClock>0){objectiveClock-=dt;if(objectiveClock<=0){if(enemyAlive){objectiveUI.textContent='INTERCEPT CONTACT';objectiveUI.style.opacity='.28'}else objectiveUI.style.opacity='0'}}}
function loop(){const dt=Math.min(clock.getDelta(),.033);updateFlight(dt);updateWorld();updateEnemy(dt);updateCamera(dt);updateTargeting(dt);updateScope(dt);updateWeapons(dt);updateHUD(dt);const alt=Math.max(0,ship.position.y-terrainHeight(ship.position.x,ship.position.z));document.getElementById('readout').textContent=`${Math.round(speed)} SPD / ${Math.round(alt)} ALT`;renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
