<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101311;color:#ece9df;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{background:#101311 url('./emberwing-og-v2.jpg') center/cover no-repeat}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(6,8,7,.06),rgba(6,8,7,.18));pointer-events:none}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#101311;opacity:0;pointer-events:none;transition:opacity .18s ease}
#game.live{opacity:1;pointer-events:auto}
#intro{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:28px;background:rgba(7,9,8,.12);transition:opacity .18s ease}
#intro.hide{opacity:0;pointer-events:none}
.card{width:min(520px,calc(100vw - 48px));padding:30px 34px 28px;border:1px solid rgba(236,233,223,.30);background:rgba(10,13,12,.58);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 18px 70px rgba(0,0,0,.24)}
.eyebrow{margin:0 0 12px;font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;color:rgba(236,233,223,.58)}
h1{margin:0 0 24px;font-size:clamp(32px,5vw,56px);font-weight:500;line-height:.95;letter-spacing:.01em}
.controls{display:grid;gap:11px;margin:0 0 26px;padding:18px 0;border-top:1px solid rgba(236,233,223,.16);border-bottom:1px solid rgba(236,233,223,.16);font:600 15px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.035em}
.start{margin:0;font:600 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:rgba(236,233,223,.92)}
.start span{color:rgba(236,233,223,.48)}
#count{position:fixed;inset:0;z-index:7;display:none;place-items:center;background:rgba(7,9,8,.12);font:500 clamp(96px,20vw,220px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#f3f0e8;text-shadow:0 8px 40px rgba(0,0,0,.48)}
#count.show{display:grid}
@media(max-width:700px),(pointer:coarse){.card{width:min(480px,calc(100vw - 32px));padding:26px}.controls{font-size:13px}}
</style>
</head>
<body>
<iframe id="game" title="Emberwing Valley Strike" allow="autoplay; fullscreen"></iframe>

<div id="intro" role="dialog" aria-modal="true" aria-labelledby="title">
  <div class="card">
    <p class="eyebrow">EMBERWING // EW-01</p>
    <h1 id="title">YOU'RE FLYING</h1>
    <div class="controls">
      <div>ARROW KEYS — STEER</div>
      <div>SPACE — FIRE</div>
    </div>
    <p class="start">PRESS ENTER <span>WHEN YOU'RE READY</span></p>
  </div>
</div>

<div id="count" aria-live="assertive"></div>

<script>
const game=document.getElementById('game');
const intro=document.getElementById('intro');
const count=document.getElementById('count');
let started=false;

function begin(){
  if(started)return;
  started=true;
  intro.classList.add('hide');

  const steps=['READY?','3','2','1','GO'];
  let i=0;
  count.textContent=steps[i];
  count.classList.add('show');

  const next=()=>{
    i+=1;
    if(i<steps.length){
      count.textContent=steps[i];
      setTimeout(next,i===1?650:620);
      return;
    }

    game.src='./play.html?desktop-onboarding=1';
    game.addEventListener('load',()=>{
      count.classList.remove('show');
      game.classList.add('live');
      setTimeout(()=>game.contentWindow?.focus(),50);
    },{once:true});
  };

  setTimeout(next,650);
}

addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    begin();
  }
});

intro.addEventListener('pointerup',begin);
</script>
</body>
</html>
