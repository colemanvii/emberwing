<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Emberwing — First Flight</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b88969;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 8px #0009}#mark{position:absolute;top:18px;left:20px;font-size:11px;letter-spacing:.2em;font-weight:700}#readout{position:absolute;top:18px;right:20px;font-size:11px;letter-spacing:.12em}#hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.08em;opacity:.72;white-space:nowrap}
#reticle{position:absolute;left:50%;top:44%;width:24px;height:24px;transform:translate(-50%,-50%);border:2px solid #e9ffd4;border-radius:50%;box-shadow:0 0 8px #91ff7c88}#reticle:before,#reticle:after{content:"";position:absolute;background:#e9ffd4}#reticle:before{width:38px;height:2px;left:-9px;top:9px}#reticle:after{width:2px;height:38px;left:9px;top:-9px}
#crash{position:absolute;inset:0;display:none;place-items:center;background:#160b08cc;font:700 18px ui-monospace;letter-spacing:.18em}#crash span{text-align:center}#crash small{display:block;margin-top:12px;font-size:10px;opacity:.7}
</style>
</head>
<body>
<div id="hud"><div id="mark">EMBERWING / FIRST FLIGHT</div><div id="readout"></div><div id="reticle"></div><div id="hint">W/S PITCH · A/D ROLL · SHIFT/CTRL SPEED · R RESET</div><div id="crash"><span>IMPACT<small>PRESS R TO FLY AGAIN</small></span></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xc69a78);scene.fog=new THREE.Fog(0xc69a78,180,1050);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,1800);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffddbd,0x55352c,2.4));const sun=new THREE.DirectionalLight(0xffd29b,4.8);sun.position.set(-300,380,100);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-420;sun.shadow.camera.right=420;sun.shadow.camera.top=420;sun.shadow.camera.bottom=-420;scene.add(sun);
const SIZE=2200,SEG=150;const terrain=new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG);terrain.rotateX(-Math.PI/2);
function terrainHeight(x,z){const broad=Math.sin(x*.006)*13+Math.cos(z*.007)*12+Math.sin((x+z)*.003)*15;const ridge=Math.abs(Math.sin(x*.012+Math.sin(z*.004)*1.5))*17;const detail=Math.sin(x*.04)*Math.cos(z*.037)*2.5;return broad+ridge+detail-34}
const tp=terrain.attributes.position;for(let i=0;i<tp.count;i++)tp.setY(i,terrainHeight(tp.getX(i),tp.getZ(i)));terrain.computeVertexNormals();const ground=new THREE.Mesh(terrain,new THREE.MeshStandardMaterial({color:0xa96d4b,roughness:.96}));ground.receiveShadow=true;scene.add(ground);
// A small lived-in landscape: cheap geometry, strong scale cues, no lore required.
const sand=new THREE.MeshStandardMaterial({color:0xc7a47a,roughness:.92});const pale=new THREE.MeshStandardMaterial({color:0xd3b993,roughness:.9});const dark=new THREE.MeshStandardMaterial({color:0x5b463d,roughness:.9});const roadMat=new THREE.MeshStandardMaterial({color:0x72584a,roughness:1});
function building(x,z,w,d,h,mat=sand){const y=terrainHeight(x,z);const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);if(Math.random()>.45){const cap=new THREE.Mesh(new THREE.CylinderGeometry(Math.min(w,d)*.42,Math.min(w,d)*.52,h*.22,8),mat);cap.position.set(x,y+h*1.08,z);cap.castShadow=true;scene.add(cap)}}
function tower(x,z,h){const y=terrainHeight(x,z);const mast=new THREE.Mesh(new THREE.CylinderGeometry(.55,1.1,h,6),dark);mast.position.set(x,y+h/2,z);mast.castShadow=true;scene.add(mast);for(let k=1;k<4;k++){const ring=new THREE.Mesh(new THREE.TorusGeometry(2.2,.18,5,10),dark);ring.rotation.x=Math.PI/2;ring.position.set(x,y+h*k/4,z);scene.add(ring)}}
for(let i=0;i<52;i++){const x=(Math.random()-.5)*650,z=(Math.random()-.5)*800;building(x,z,10+Math.random()*24,10+Math.random()*24,7+Math.random()*25,Math.random()>.5?sand:pale)}
for(let i=0;i<10;i++)tower((Math.random()-.5)*600,(Math.random()-.5)*700,24+Math.random()*35);
// Roads / strips make forward motion legible from the high chase camera.
for(const x of [-170,85,260]){const r=new THREE.Mesh(new THREE.BoxGeometry(5,.25,850),roadMat);r.position.set(x,terrainHeight(x,0)+.4,0);scene.add(r)}
// Rocks beyond the settlement keep the landscape from becoming a flat board.
const rockMat=new THREE.MeshStandardMaterial({color:0x7d4d3b,roughness:1});for(let i=0;i<65;i++){const x=(Math.random()-.5)*1800,z=(Math.random()-.5)*1800;if(Math.abs(x)<380&&Math.abs(z)<480)continue;const h=6+Math.random()*35,w=3+Math.random()*10;const rock=new THREE.Mesh(new THREE.BoxGeometry(w,h,w*(.7+Math.random())),rockMat);rock.position.set(x,terrainHeight(x,z)+h/2,z);rock.rotation.y=Math.random()*Math.PI;rock.castShadow=true;scene.add(rock)}
// Original wide fighter designed specifically to read from above and behind.
const ship=new THREE.Group();const hull=new THREE.MeshStandardMaterial({color:0x4a4b4b,roughness:.5,metalness:.35});const wingMat=new THREE.MeshStandardMaterial({color:0x74716a,roughness:.55,metalness:.3});const canopyMat=new THREE.MeshStandardMaterial({color:0x171c20,roughness:.25,metalness:.65});const glowMat=new THREE.MeshBasicMaterial({color:0xff6a32});
const fuselage=new THREE.Mesh(new THREE.ConeGeometry(1.35,8.8,5),hull);fuselage.rotation.x=-Math.PI/2;fuselage.position.z=-.6;fuselage.castShadow=true;ship.add(fuselage);const canopy=new THREE.Mesh(new THREE.SphereGeometry(.9,12,8),canopyMat);canopy.scale.set(.8,.42,1.55);canopy.position.set(0,.72,-1.7);ship.add(canopy);
for(const side of [-1,1]){const wing=new THREE.Mesh(new THREE.BoxGeometry(6.8,.22,1.55),wingMat);wing.position.set(side*3.25,0,.65);wing.rotation.y=side*.22;wing.castShadow=true;ship.add(wing);const outer=new THREE.Mesh(new THREE.BoxGeometry(3.5,.18,1.05),hull);outer.position.set(side*7.1,.05,.1);outer.rotation.y=side*.42;outer.castShadow=true;ship.add(outer);const fin=new THREE.Mesh(new THREE.BoxGeometry(.18,1.4,1.3),hull);fin.position.set(side*1.05,.85,2.45);fin.rotation.z=side*.25;ship.add(fin)}
for(const x of [-4.7,-1.0,1.0,4.7]){const engine=new THREE.Mesh(new THREE.SphereGeometry(.34,10,8),glowMat);engine.scale.z=2.4;engine.position.set(x,.05,2.85);ship.add(engine);const light=new THREE.PointLight(0xff5b2d,3,10);light.position.copy(engine.position);ship.add(light)}scene.add(ship);
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reset()});addEventListener('keyup',e=>keys[e.code]=false);
let speed=105,pitchRate=0,rollRate=0,crashed=false;const clock=new THREE.Clock();const forward=new THREE.Vector3(),up=new THREE.Vector3(),desiredCam=new THREE.Vector3(),look=new THREE.Vector3(),worldUp=new THREE.Vector3(0,1,0);const qPitch=new THREE.Quaternion(),qRoll=new THREE.Quaternion(),qYaw=new THREE.Quaternion();const axisX=new THREE.Vector3(1,0,0),axisZ=new THREE.Vector3(0,0,1),axisY=new THREE.Vector3(0,1,0);function smooth(a,b,dt,t){return THREE.MathUtils.lerp(a,b,1-Math.exp(-dt/t))}
function reset(){ship.position.set(0,82,330);ship.quaternion.identity();speed=105;pitchRate=rollRate=0;crashed=false;document.getElementById('crash').style.display='none';camera.position.set(0,96,346)}reset();
function updateFlight(dt){if(crashed)return;const pi=(keys.KeyS?1:0)-(keys.KeyW?1:0),ri=(keys.KeyD?1:0)-(keys.KeyA?1:0);pitchRate=smooth(pitchRate,pi*1.4,dt,.14);rollRate=smooth(rollRate,ri*2.55,dt,.11);if(keys.ShiftLeft||keys.ShiftRight)speed=Math.min(180,speed+48*dt);else if(keys.ControlLeft||keys.ControlRight)speed=Math.max(58,speed-48*dt);else speed=smooth(speed,105,dt,2);qPitch.setFromAxisAngle(axisX,pitchRate*dt);qRoll.setFromAxisAngle(axisZ,-rollRate*dt);ship.quaternion.multiply(qPitch).multiply(qRoll).normalize();up.copy(worldUp).applyQuaternion(ship.quaternion);const bank=Math.atan2(up.x,up.y);qYaw.setFromAxisAngle(axisY,-bank*.52*dt);ship.quaternion.premultiply(qYaw).normalize();forward.set(0,0,-1).applyQuaternion(ship.quaternion).normalize();ship.position.addScaledVector(forward,speed*dt);const floor=terrainHeight(ship.position.x,ship.position.z)+2.4;if(ship.position.y<floor){ship.position.y=floor;crashed=true;document.getElementById('crash').style.display='grid'}if(Math.abs(ship.position.x)>1000||Math.abs(ship.position.z)>1000)reset()}
function updateCamera(dt){forward.set(0,0,-1).applyQuaternion(ship.quaternion).normalize();up.copy(worldUp).applyQuaternion(ship.quaternion);const bank=Math.atan2(up.x,up.y);desiredCam.copy(ship.position).addScaledVector(forward,-11.5).addScaledVector(worldUp,8.4);desiredCam.x+=Math.sin(bank)*1.2;camera.position.lerp(desiredCam,1-Math.exp(-dt/.18));look.copy(ship.position).addScaledVector(forward,31).addScaledVector(worldUp,-4.8);camera.lookAt(look);camera.rotateZ(-bank*.11);camera.fov=smooth(camera.fov,67+(speed-58)/(180-58)*6,dt,.35);camera.updateProjectionMatrix()}
function loop(){const dt=Math.min(clock.getDelta(),.033);updateFlight(dt);updateCamera(dt);const alt=Math.max(0,ship.position.y-terrainHeight(ship.position.x,ship.position.z));document.getElementById('readout').textContent=`${Math.round(speed)} SPD / ${Math.round(alt)} ALT`;renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
