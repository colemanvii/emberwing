<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Emberwing — First Flight</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17131b;color:#f5efe7;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}canvas{display:block}
    #hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 8px #0008}
    #mark{position:absolute;top:20px;left:22px;font-size:12px;letter-spacing:.22em;font-weight:700}
    #speed{position:absolute;top:20px;right:22px;font-size:12px;letter-spacing:.12em}
    #hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.08em;opacity:.72;white-space:nowrap}
    #reticle{position:absolute;left:50%;top:47%;width:18px;height:18px;transform:translate(-50%,-50%);border:1px solid #fff9;border-radius:50%}
    #reticle:before,#reticle:after{content:"";position:absolute;background:#fff9}#reticle:before{width:28px;height:1px;left:-6px;top:8px}#reticle:after{width:1px;height:28px;left:8px;top:-6px}
    #crash{position:absolute;inset:0;display:none;place-items:center;background:#120b0bcc;font:700 18px ui-monospace;letter-spacing:.18em}#crash span{display:block;text-align:center}#crash small{display:block;margin-top:12px;font-size:10px;opacity:.7}
  </style>
</head>
<body>
  <div id="hud">
    <div id="mark">EMBERWING / FIRST FLIGHT</div>
    <div id="speed">100</div>
    <div id="reticle"></div>
    <div id="hint">W/S PITCH · A/D ROLL · SHIFT/CTRL SPEED · R RESET</div>
    <div id="crash"><span>IMPACT<small>PRESS R TO FLY AGAIN</small></span></div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9b7180);
    scene.fog = new THREE.Fog(0x9b7180, 240, 1250);

    const camera = new THREE.PerspectiveCamera(66, innerWidth/innerHeight, .1, 2200);
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.prepend(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xf3c5a5, 0x4b2630, 2.1);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffd09a, 4.2);
    sun.position.set(-380, 260, -180);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048,2048);
    sun.shadow.camera.left=-350;sun.shadow.camera.right=350;sun.shadow.camera.top=350;sun.shadow.camera.bottom=-350;
    scene.add(sun);

    // One bounded landscape. Cheap geometry, strong relief, lots of low-altitude optical flow.
    const SIZE=2200, SEG=150;
    const geo = new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG);
    geo.rotateX(-Math.PI/2);
    function terrainHeight(x,z){
      const broad = Math.sin(x*.008)*24 + Math.cos(z*.009)*20 + Math.sin((x+z)*.004)*30;
      const ridges = Math.abs(Math.sin(x*.015 + Math.sin(z*.006)*2))*42;
      const detail = Math.sin(x*.047)*Math.cos(z*.041)*5;
      return broad + ridges + detail - 45;
    }
    const p=geo.attributes.position;
    for(let i=0;i<p.count;i++) p.setY(i,terrainHeight(p.getX(i),p.getZ(i)));
    geo.computeVertexNormals();
    const ground = new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x8c4938,roughness:.94,metalness:0}));
    ground.receiveShadow=true;scene.add(ground);

    // Sparse monoliths make speed and scale legible without textures.
    const rockMat=new THREE.MeshStandardMaterial({color:0x6d332e,roughness:1});
    for(let i=0;i<85;i++){
      const x=(Math.random()-.5)*1800,z=(Math.random()-.5)*1800;
      const h=8+Math.random()*45,w=3+Math.random()*12;
      const rock=new THREE.Mesh(new THREE.BoxGeometry(w,h,w*(.7+Math.random()*.8)),rockMat);
      rock.position.set(x,terrainHeight(x,z)+h/2,z);rock.rotation.y=Math.random()*Math.PI;rock.castShadow=true;rock.receiveShadow=true;scene.add(rock);
    }

    // Original primitive fighter: narrow body, forward-swept wings, twin tail fins.
    const ship=new THREE.Group();
    const bodyMat=new THREE.MeshStandardMaterial({color:0xd9d0bd,roughness:.55,metalness:.25});
    const darkMat=new THREE.MeshStandardMaterial({color:0x29262a,roughness:.45,metalness:.4});
    const emberMat=new THREE.MeshBasicMaterial({color:0xff6a32});
    const body=new THREE.Mesh(new THREE.ConeGeometry(1.15,7.5,5),bodyMat);body.rotation.x=-Math.PI/2;body.position.z=-.4;body.castShadow=true;ship.add(body);
    const cockpit=new THREE.Mesh(new THREE.SphereGeometry(.75,12,8),darkMat);cockpit.scale.set(.8,.45,1.4);cockpit.position.set(0,.55,-1.2);ship.add(cockpit);
    const wingGeo=new THREE.BoxGeometry(5.8,.16,1.25);
    const wing=new THREE.Mesh(wingGeo,bodyMat);wing.position.z=.65;wing.rotation.y=-.18;wing.castShadow=true;ship.add(wing);
    const tailL=new THREE.Mesh(new THREE.BoxGeometry(.15,1.35,1.1),bodyMat);tailL.position.set(-.65,.7,2.1);tailL.rotation.z=-.22;ship.add(tailL);
    const tailR=tailL.clone();tailR.position.x=.65;tailR.rotation.z=.22;ship.add(tailR);
    for(const x of [-.52,.52]){const e=new THREE.Mesh(new THREE.SphereGeometry(.24,10,8),emberMat);e.scale.z=2.2;e.position.set(x,0,3.25);ship.add(e)}
    scene.add(ship);

    const keys={};
    addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reset()});
    addEventListener('keyup',e=>keys[e.code]=false);

    let speed=100,pitchRate=0,rollRate=0,crashed=false;
    const clock=new THREE.Clock();
    const forward=new THREE.Vector3(),up=new THREE.Vector3(),desiredCam=new THREE.Vector3(),look=new THREE.Vector3();
    const qPitch=new THREE.Quaternion(),qRoll=new THREE.Quaternion(),qYaw=new THREE.Quaternion();
    const axisX=new THREE.Vector3(1,0,0),axisZ=new THREE.Vector3(0,0,1),axisY=new THREE.Vector3(0,1,0);

    function smooth(current,target,dt,tau){return THREE.MathUtils.lerp(current,target,1-Math.exp(-dt/tau))}
    function reset(){
      ship.position.set(0,95,260);ship.quaternion.identity();speed=100;pitchRate=rollRate=0;crashed=false;
      document.getElementById('crash').style.display='none';
      camera.position.set(0,100,278);
    }
    reset();

    function updateFlight(dt){
      if(crashed)return;
      const pitchInput=(keys.KeyS?1:0)-(keys.KeyW?1:0);
      const rollInput=(keys.KeyD?1:0)-(keys.KeyA?1:0);
      pitchRate=smooth(pitchRate,pitchInput*1.35,dt,.15);
      rollRate=smooth(rollRate,rollInput*2.35,dt,.12);
      if(keys.ShiftLeft||keys.ShiftRight)speed=Math.min(175,speed+45*dt);
      else if(keys.ControlLeft||keys.ControlRight)speed=Math.max(55,speed-45*dt);
      else speed=smooth(speed,100,dt,1.8);

      qPitch.setFromAxisAngle(axisX,pitchRate*dt);
      qRoll.setFromAxisAngle(axisZ,-rollRate*dt);
      ship.quaternion.multiply(qPitch).multiply(qRoll).normalize();

      // Coordinated yaw: bank creates the turn, pitch remains under the pilot's hand.
      up.set(0,1,0).applyQuaternion(ship.quaternion);
      const bank=Math.atan2(up.x,up.y);
      qYaw.setFromAxisAngle(axisY,-bank*.48*dt);
      ship.quaternion.premultiply(qYaw).normalize();

      forward.set(0,0,-1).applyQuaternion(ship.quaternion).normalize();
      ship.position.addScaledVector(forward,speed*dt);

      const floor=terrainHeight(ship.position.x,ship.position.z)+2.2;
      if(ship.position.y<floor){ship.position.y=floor;crashed=true;document.getElementById('crash').style.display='grid'}
      if(Math.abs(ship.position.x)>1000||Math.abs(ship.position.z)>1000) reset();
    }

    function updateCamera(dt){
      forward.set(0,0,-1).applyQuaternion(ship.quaternion).normalize();
      // World-up bias stabilizes the horizon while the fighter rolls dramatically.
      desiredCam.copy(ship.position).addScaledVector(forward,-15).add(new THREE.Vector3(0,5.2,0));
      camera.position.lerp(desiredCam,1-Math.exp(-dt/.24));
      look.copy(ship.position).addScaledVector(forward,24).add(new THREE.Vector3(0,1.2,0));
      camera.lookAt(look);
      camera.fov=smooth(camera.fov,64+(speed-55)/(175-55)*8,dt,.35);camera.updateProjectionMatrix();
    }

    function loop(){
      const dt=Math.min(clock.getDelta(),.033);
      updateFlight(dt);updateCamera(dt);
      document.getElementById('speed').textContent=`${Math.round(speed)} / ${Math.round(ship.position.y-terrainHeight(ship.position.x,ship.position.z))} ALT`;
      renderer.render(scene,camera);requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  </script>
</body>
</html>
