<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101311">
<meta name="description" content="Low-level strike. Destroy the launch site. Get out north.">
<title>Emberwing — Valley Strike</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101311;color:#ece9df;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#101311}
#intro{position:fixed;inset:0;z-index:5;pointer-events:none;background:linear-gradient(90deg,rgba(7,9,8,.34) 0,rgba(7,9,8,.08) 38%,transparent 62%);transition:opacity .18s ease}
#intro.hide{opacity:0}
.copy{position:absolute;left:max(32px,4vw);bottom:max(34px,5vh);width:min(420px,70vw);text-shadow:0 2px 18px rgba(0,0,0,.7)}
.eyebrow{margin:0 0 12px;font:600 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.26em;color:rgba(236,233,223,.52)}
h1{margin:0 0 18px;font-size:clamp(25px,3vw,40px);font-weight:500;line-height:1;letter-spacing:.02em}
.controls{margin:0 0 18px;font:600 11px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.09em;color:rgba(236,233,223,.78)}
.start{margin:0;font:600 9px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;color:#ece9df}
.start span{color:rgba(236,233,223,.42)}
#count{position:fixed;inset:0;z-index:7;display:none;place-items:center;pointer-events:none;font:500 clamp(88px,17vw,190px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#f4f0e7;text-shadow:0 10px 55px rgba(0,0,0,.75)}
#count.show{display:grid}
#count.ready{font-size:clamp(28px,5vw,54px);letter-spacing:.08em}
@media(max-width:700px),(pointer:coarse){.copy{left:22px;bottom:26px;width:calc(100vw - 44px)}}
</style>
</head>
<body>
<iframe id="game" src="./play.html?introHold=1" title="Emberwing Valley Strike" allow="autoplay; fullscreen"></iframe>

<div id="intro" aria-labelledby="title">
  <div class="copy">
    <p class="eyebrow">EMBERWING // FIRST FLIGHT</p>
    <h1 id="title">YOU'RE FLYING</h1>
    <div class="controls">
      <div>ARROW KEYS — STEER</div>
      <div>SPACE — FIRE</div>
    </div>
    <p class="start">PRESS ENTER <span>TO FLY</span></p>
  </div>
</div>

<div id="count" aria-live="assertive"></div>

<script>
const game=document.getElementById('game');
const intro=document.getElementById('intro');
const count=document.getElementById('count');
let started=false;

function begin(){
 if(started)return;
 started=true;
 intro.classList.add('hide');
 const steps=['READY?','3','2','1','GO'];
 let i=0;
 const show=()=>{
   const value=steps[i];
   count.textContent=value;
   count.className='show'+(value==='READY?'?' ready':'');
   if(value==='GO'){
     setTimeout(()=>{
       count.className='';
       game.contentWindow?.postMessage('emberwing:start','*');
       setTimeout(()=>game.contentWindow?.focus(),50);
     },420);
     return;
   }
   i+=1;
   setTimeout(show,value==='READY?'?620:560);
 };
 show();
}

addEventListener('keydown',e=>{
 if(e.key==='Enter'){
   e.preventDefault();
   begin();
 }
});
</script>
</body>
</html>
