<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emberwing — First Flight</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b88969;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}canvas{display:block;outline:none}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 8px #0009}#mark{position:absolute;top:18px;left:20px;font-size:11px;letter-spacing:.2em;font-weight:700}#readout{position:absolute;top:18px;right:20px;font-size:11px;letter-spacing:.12em}#hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.1em;opacity:.7;white-space:nowrap}#focus,#objective{position:absolute;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.16em}#focus{top:62%;padding:9px 12px;border:1px solid #ffffff55;background:#1b100d66;transition:opacity .2s}#objective{top:18%;font-weight:700;opacity:0;transition:opacity .3s}#reticle{position:absolute;left:50%;top:44%;width:26px;height:26px;transform:translate(-50%,-50%);border:1.5px solid #fff0b0;border-radius:50%;box-shadow:0 0 10px #ffb52b66;transition:border-color .12s,box-shadow .12s,transform .12s}#reticle:before,#reticle:after{content:"";position:absolute;background:#fff0b0;transition:background .12s}#reticle:before{width:40px;height:1.5px;left:-8px;top:11px}#reticle:after{width:1.5px;height:40px;left:11px;top:-8px}#reticle.track{border-color:#ffb126;box-shadow:0 0 14px #ff8a1f99}#reticle.track:before,#reticle.track:after{background:#ffb126}#reticle.lock{border-color:#ff642e;box-shadow:0 0 18px #ff4b24cc;transform:translate(-50%,-50%) scale(.86)}#reticle.lock:before,#reticle.lock:after{background:#ff642e}#target{position:absolute;width:34px;height:34px;opacity:0;transform:translate(-50%,-50%) rotate(45deg);border:1px solid #ffb126;transition:opacity .1s,border-color .1s;filter:drop-shadow(0 0 5px #ff8a1f)}#target.lock{border-color:#ff642e}#status{position:absolute;left:50%;top:49%;transform:translateX(-50%);font-size:9px;letter-spacing:.22em;color:#ffcf78;opacity:0;transition:opacity .12s}#crash{position:absolute;inset:0;display:none;place-items:center;background:#160b08cc;font:700 18px ui-monospace;letter-spacing:.18em}#crash span{text-align:center}#crash small{display:block;margin-top:12px;font-size:10px;opacity:.7}</style></head><body><div id="hud"><div id="mark">EMBERWING / FIRST FLIGHT</div><div id="readout"></div><div id="objective">INTERCEPT</div><div id="reticle"></div><div id="target"></div><div id="status"></div><div id="focus">CLICK TO TAKE CONTROL</div><div id="hint">↑ ↓ PITCH · ← → BANK · SPACE FIRE · R RESET</div><div id="crash"><span>IMPACT<small>PRESS R TO FLY AGAIN</small></span></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xc69a78);scene.fog=new THREE.Fog(0xc69a78,155,980);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1800),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.domElement.tabIndex=0;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffddbd,0x55352c,2.4));const sun=new THREE.DirectionalLight(0xffd29b,4.8);sun.position.set(-300,380,100);sun.castShadow=true;scene.add(sun);
const terrain=new THREE.PlaneGeometry(2200,2200,150,150);terrain.rotateX(-Math.PI/2);function terrainHeight(x,z){return Math.sin(x*.006)*13+Math.cos(z*.007)*12+Math.sin((x+z)*.003)*15+Math.abs(Math.sin(x*.012+Math.sin(z*.004)*1.5))*17+Math.sin(x*.04)*Math.cos(z*.037)*2.5-34}const tp=terrain.attributes.position;for(let i=0;i<tp.count;i++)tp.setY(i,terrainHeight(tp.getX(i),tp.getZ(i)));terrain.computeVertexNormals();const ground=new THREE.Mesh(terrain,new THREE.MeshStandardMaterial({color:0xa96d4b,roughness:.96}));ground.receiveShadow=true;scene.add(ground);
const sand=new THREE.MeshStandardMaterial({color:0xc7a47a,roughness:.92}),pale=new THREE.MeshStandardMaterial({color:0xd3b993,roughness:.9}),dark=new THREE.MeshStandardMaterial({color:0x5b463d,roughness:.9}),roadMat=new THREE.MeshStandardMaterial({color:0x72584a,roughness:1});function building(x,z,w,d,h,mat=sand){const y=terrainHeight(x,z),m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y+h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m)}function tower(x,z,h){const y=terrainHeight(x,z),m=new THREE.Mesh(new THREE.CylinderGeometry(.55,1.1,h,6),dark);m.position.set(x,y+h/2,z);m.castShadow=true;scene.add(m)}for(let i=0;i<52;i++){const x=(Math.random()-.5)*650,z=(Math.random()-.5)*800;building(x,z,10+Math.random()*24,10+Math.random()*24,7+Math.random()*25,Math.random()>.5?sand:pale)}for(let i=0;i<10;i++)tower((Math.random()-.5)*600,(Math.random()-.5)*700,24+Math.random()*35);for(const x of [-170,85,260]){const r=new THREE.Mesh(new THREE.BoxGeometry(5,.25,850),roadMat);r.position.set(x,terrainHeight(x,0)+.4,0);scene.add(r)}const rockMat=new THREE.MeshStandardMaterial({color:0x7d4d3b,roughness:1});for(let i=0;i<65;i++){const x=(Math.random()-.5)*1800,z=(Math.random()-.5)*1800;if(Math.abs(x)<380&&Math.abs(z)<480)continue;const h=6+Math.random()*35,w=3+Math.random()*10,m=new THREE.Mesh(new THREE.BoxGeometry(w,h,w*(.7+Math.random())),rockMat);m.position.set(x,terrainHeight(x,z)+h/2,z);m.rotation.y=Math.random()*Math.PI;m.castShadow=true;scene.add(m)}
function makeShip(enemy=false){const g=new THREE.Group(),hull=new THREE.MeshStandardMaterial({color:enemy?0x151719:0x4a4b4b,roughness:.5,metalness:.35}),wingMat=new THREE.MeshStandardMaterial({color:enemy?0x26282a:0x74716a,roughness:.55,metalness:.3}),canopy=new THREE.MeshStandardMaterial({color:0x101416,roughness:.25,metalness:.65});const f=new THREE.Mesh(new THREE.ConeGeometry(enemy?.8:1.35,enemy?6:8.8,5),hull);f.rotation.x=-Math.PI/2;f.position.z=-.6;f.castShadow=true;g.add(f);const c=new THREE.Mesh(new THREE.SphereGeometry(enemy?.55:.9,10,7),canopy);c.scale.set(.8,.42,1.55);c.position.set(0,enemy?.45:.72,-1.3);g.add(c);for(const s of [-1,1]){const w=new THREE.Mesh(new THREE.BoxGeometry(enemy?4.2:6.8,.22,enemy?1.15:1.55),wingMat);w.position.set(s*(enemy?2.1:3.25),0,.55);w.rotation.y=s*(enemy?.38:.22);w.castShadow=true;g.add(w);if(!enemy){const o=new THREE.Mesh(new THREE.BoxGeometry(3.5,.18,1.05),hull);o.position.set(s*7.1,.05,.1);o.rotation.y=s*.42;o.castShadow=true;g.add(o)}}const glow=new THREE.MeshBasicMaterial({color:enemy?0x6ecbff:0xff6a32});for(const x of enemy?[-1.3,1.3]:[-4.7,-1,1,4.7]){const e=new THREE.Mesh(new THREE.SphereGeometry(enemy?.22:.34,8,6),glow);e.scale.z=2.4;e.position.set(x,.05,enemy?2.1:2.85);g.add(e)}return g}const ship=makeShip();scene.add(ship);const enemy=makeShip(true);scene.add(enemy);let enemyAlive=true,enemyPhase=0,enemyTime=0,enemyVel=new THREE.Vector3();function resetEnemy(){enemyAlive=true;enemy.visible=true;enemyPhase=0;enemyTime=0;enemy.position.set(-260,92,10);enemy.rotation.set(0,-Math.PI/2,0);enemyVel.set(145,0,12)}
const shots=[],fireballMat=new THREE.MeshBasicMaterial({color:0xffa51f}),coreMat=new THREE.MeshBasicMaterial({color:0xffffd0}),burstMat=new THREE.MeshBasicMaterial({color:0xff6128,transparent:true});let fireClock=0,gunSide=-1,lockStrength=0,lockState=0;const reticle=document.getElementById('reticle'),targetUI=document.getElementById('target'),statusUI=document.getElementById('status');function targeting(){if(!enemyAlive)return{state:0,strength:0};const to=enemy.position.clone().sub(ship.position),dist=to.length(),dir=to.clone().normalize(),nose=new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion),dot=nose.dot(dir),angle=Math.acos(THREE.MathUtils.clamp(dot,-1,1));if(dist>650||dot<0)return{state:0,strength:0};const acquire=THREE.MathUtils.degToRad(24),hard=THREE.MathUtils.degToRad(10);if(angle<acquire){const s=1-THREE.MathUtils.clamp((angle-hard)/(acquire-hard),0,1);return{state:angle<hard?2:1,strength:.35+.65*s,dist}}return{state:0,strength:0}}
function fire(){if(crashed)return;gunSide*=-1;const g=new THREE.Group(),ball=new THREE.Mesh(new THREE.SphereGeometry(.7,10,8),fireballMat),core=new THREE.Mesh(new THREE.SphereGeometry(.3,8,6),coreMat),tail=new THREE.Mesh(new THREE.ConeGeometry(.38,3.2,8),fireballMat);tail.rotation.x=-Math.PI/2;tail.position.z=1.45;g.add(ball,core,tail);const muzzle=new THREE.Vector3(gunSide*4.6,.05,-2.7).applyQuaternion(ship.quaternion).add(ship.position);g.position.copy(muzzle);let dir=new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion).normalize();const t=targeting();if(t.state){const projectileSpeed=430,time=Math.min(1.2,t.dist/projectileSpeed),lead=enemy.position.clone().addScaledVector(enemyVel,time),assist=lead.sub(muzzle).normalize();dir.lerp(assist,t.state===2?.82:.48*t.strength).normalize()}g.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1),dir);scene.add(g);shots.push({mesh:g,v:dir.multiplyScalar(430),life:1.55})}function explode(pos){for(let i=0;i<28;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.25+Math.random()*.7,5,4),burstMat.clone());p.position.copy(pos);const v=new THREE.Vector3(Math.random()-.5,Math.random()-.15,Math.random()-.5).normalize().multiplyScalar(15+Math.random()*46);scene.add(p);shots.push({mesh:p,v,life:.72,particle:true})}}
const keys={};function key(e,down){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyR'].includes(e.code)){e.preventDefault();keys[e.code]=down;if(down&&e.code==='Space'&&!e.repeat){fire();fireClock=.105}if(down&&e.code==='KeyR')reset();document.getElementById('focus').style.opacity='0'}}window.addEventListener('keydown',e=>key(e,true),{capture:true});window.addEventListener('keyup',e=>key(e,false),{capture:true});window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});renderer.domElement.addEventListener('pointerdown',()=>{renderer.domElement.focus({preventScroll:true});document.getElementById('focus').style.opacity='0'});
let speed=122,pitchRate=0,rollRate=0,crashed=false;const clock=new THREE.Clock(),forward=new THREE.Vector3(),up=new THREE.Vector3(),desiredCam=new THREE.Vector3(),look=new THREE.Vector3(),worldUp=new THREE.Vector3(0,1,0),qPitch=new THREE.Quaternion(),qRoll=new THREE.Quaternion(),qYaw=new THREE.Quaternion(),axisX=new THREE.Vector3(1,0,0),axisZ=new THREE.Vector3(0,0,1),axisY=new THREE.Vector3(0,1,0),lastEnemy=new THREE.Vector3();function smooth(a,b,dt,t){return THREE.MathUtils.lerp(a,b,1-Math.exp(-dt/t))}function reset(){ship.position.set(0,68,330);ship.quaternion.identity();speed=122;pitchRate=rollRate=0;crashed=false;lockStrength=lockState=0;document.getElementById('crash').style.display='none';document.getElementById('objective').textContent='INTERCEPT';document.getElementById('objective').style.opacity='0';targetUI.style.opacity=0;statusUI.style.opacity=0;reticle.className='';camera.position.set(0,76,342);for(const s of shots)scene.remove(s.mesh);shots.length=0;resetEnemy();lastEnemy.copy(enemy.position)}reset();
function updateFlight(dt){if(crashed)return;const pi=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),ri=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);pitchRate=smooth(pitchRate,pi*1.14,dt,.16);rollRate=smooth(rollRate,ri*1.92,dt,.14);qPitch.setFromAxisAngle(axisX,pitchRate*dt);qRoll.setFromAxisAngle(axisZ,-rollRate*dt);ship.quaternion.multiply(qPitch).multiply(qRoll).normalize();up.copy(worldUp).applyQuaternion(ship.quaternion);const bank=Math.atan2(up.x,up.y);qYaw.setFromAxisAngle(axisY,-bank*.52*dt);ship.quaternion.premultiply(qYaw).normalize();forward.set(0,0,-1).applyQuaternion(ship.quaternion).normalize();ship.position.addScaledVector(forward,speed*dt);const floor=terrainHeight(ship.position.x,ship.position.z)+2.4;if(ship.position.y<floor){ship.position.y=floor;crashed=true;document.getElementById('crash').style.display='grid'}if(Math.abs(ship.position.x)>1000||Math.abs(ship.position.z)>1000)reset()}
function updateEnemy(dt){if(!enemyAlive)return;lastEnemy.copy(enemy.position);enemyTime+=dt;if(enemyPhase===0){enemy.position.x+=145*dt;enemy.position.z+=12*dt;if(enemy.position.x>230){enemyPhase=1;document.getElementById('objective').style.opacity='1'}}else{const target=ship.position.clone().add(new THREE.Vector3(Math.sin(enemyTime*.62)*145,30+Math.sin(enemyTime)*24,-235)),dir=target.sub(enemy.position).normalize(),desired=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,-1),dir);enemy.quaternion.slerp(desired,1-Math.exp(-dt*.9));enemy.position.addScaledVector(new THREE.Vector3(0,0,-1).applyQuaternion(enemy.quaternion),98*dt);const floor=terrainHeight(enemy.position.x,enemy.position.z)+18;if(enemy.position.y<floor)enemy.position.y=smooth(enemy.position.y,floor,dt,.2)}enemyVel.copy(enemy.position).sub(lastEnemy).divideScalar(Math.max(dt,.001))}
function updateTargeting(dt){const t=targeting();lockStrength=smooth(lockStrength,t.strength,dt,.12);lockState=t.state;if(!enemyAlive||!t.state){targetUI.style.opacity=0;statusUI.style.opacity=0;reticle.className='';return}const p=enemy.position.clone().project(camera);if(p.z<1){targetUI.style.left=((p.x*.5+.5)*innerWidth)+'px';targetUI.style.top=((-p.y*.5+.5)*innerHeight)+'px';targetUI.style.opacity=Math.min(1,.4+lockStrength);targetUI.className=t.state===2?'lock':''}reticle.className=t.state===2?'lock':'track';statusUI.textContent=t.state===2?'LOCK':'TRACK';statusUI.style.opacity=t.state===2?.95:.55}
function updateWeapons(dt){fireClock-=dt;if(keys.Space&&fireClock<=0){fire();fireClock=.105}for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.mesh.position.addScaledVector(s.v,dt);s.life-=dt;if(!s.particle&&enemyAlive&&s.mesh.position.distanceTo(enemy.position)<8.5){enemyAlive=false;enemy.visible=false;explode(enemy.position);document.getElementById('objective').textContent='SPLASH ONE';document.getElementById('objective').style.opacity='1';targetUI.style.opacity=0;statusUI.style.opacity=0;reticle.className='';scene.remove(s.mesh);shots.splice(i,1);continue}if(s.particle){s.v.y-=30*dt;s.mesh.material.opacity=Math.max(0,s.life/.72)}if(s.life<=0){scene.remove(s.mesh);shots.splice(i,1)}}}
function updateCamera(dt){forward.set(0,0,-1).applyQuaternion(ship.quaternion).normalize();up.copy(worldUp).applyQuaternion(ship.quaternion);const bank=Math.atan2(up.x,up.y);const turnInput=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),pitchInput=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);desiredCam.copy(ship.position).addScaledVector(forward,-9.2).addScaledVector(worldUp,6.3);desiredCam.x+=Math.sin(bank)*1.65;camera.position.lerp(desiredCam,1-Math.exp(-dt/.14));look.copy(ship.position).addScaledVector(forward,38).addScaledVector(worldUp,-6.5);look.x+=Math.sin(bank)*3.2;camera.lookAt(look);camera.rotateZ(-bank*.13);const effort=Math.min(1,Math.abs(turnInput)*.8+Math.abs(pitchInput)*.55);camera.fov=smooth(camera.fov,70+effort*5,dt,.18);camera.updateProjectionMatrix()}function loop(){const dt=Math.min(clock.getDelta(),.033);updateFlight(dt);updateEnemy(dt);updateCamera(dt);updateTargeting(dt);updateWeapons(dt);const alt=Math.max(0,ship.position.y-terrainHeight(ship.position.x,ship.position.z));document.getElementById('readout').textContent=`${Math.round(speed)} SPD / ${Math.round(alt)} ALT`;renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
