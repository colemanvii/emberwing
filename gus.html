<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101311">
<title>EMBERWING — Gus Playtest</title>
<meta name="description" content="Emberwing playtest build for Gus.">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e0d;color:#ece9df;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{background:#0b0e0d url('./emberwing-og-v2.jpg') center/cover no-repeat}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(7,10,9,.18),rgba(7,10,9,.56))}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b0e0d;opacity:0;pointer-events:none;transition:opacity .35s ease}
iframe.live{opacity:1;pointer-events:auto}
#glass{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:rgba(11,14,13,.48);backdrop-filter:blur(16px) saturate(.82);-webkit-backdrop-filter:blur(16px) saturate(.82);transition:opacity .3s ease}
#glass.hide{opacity:0;pointer-events:none}
.card{width:min(620px,92vw);padding:34px 36px 30px;border:1px solid rgba(236,233,223,.18);background:rgba(11,14,13,.40);box-shadow:0 18px 80px rgba(0,0,0,.24)}
.eyebrow{margin:0 0 13px;font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;color:rgba(236,233,223,.52)}
h1{margin:0 0 18px;font-size:clamp(28px,5vw,48px);font-weight:500;letter-spacing:.02em}
.mission{margin:0 0 26px;font-size:13px;line-height:1.7;letter-spacing:.08em;color:rgba(236,233,223,.72);text-transform:uppercase}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:0 0 30px;padding:18px 0;border-top:1px solid rgba(236,233,223,.12);border-bottom:1px solid rgba(236,233,223,.12);font:600 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;color:rgba(236,233,223,.68)}
.controls b{color:#ece9df;font-weight:600}
.start{margin:0;font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;color:#ece9df}
.start span{display:inline-block;margin-left:8px;color:rgba(236,233,223,.44)}
#count{position:fixed;inset:0;z-index:6;display:none;place-items:center;font:500 clamp(76px,18vw,180px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.06em;color:#ece9df;text-shadow:0 12px 50px rgba(0,0,0,.5)}
#count.show{display:grid}
.mobile-note{display:none}
@media(max-width:700px){.card{padding:26px 24px}.controls{grid-template-columns:1fr}.desktop-only{display:none}.mobile-note{display:block}.start{font-size:11px}}
</style>
</head>
<body>
<iframe id="game" title="Emberwing" allow="autoplay; fullscreen"></iframe>
<div id="glass" role="dialog" aria-modal="true" aria-labelledby="title">
  <div class="card">
    <p class="eyebrow">EMBERWING // GUS PLAYTEST</p>
    <h1 id="title">VALLEY STRIKE</h1>
    <p class="mission">Fly low. Destroy the launch site. Get out north.</p>
    <div class="controls desktop-only">
      <div><b>ARROWS</b> — fly</div>
      <div><b>SPACE</b> — cannon</div>
      <div><b>HOLD X</b> — lock missile</div>
      <div><b>RELEASE X</b> — fire missile</div>
      <div><b>SHIFT</b> — turbo</div>
      <div><b>R</b> — restart</div>
    </div>
    <div class="controls mobile-note">
      <div><b>LEFT THUMB</b> — fly</div>
      <div><b>FIRE</b> — cannon</div>
      <div><b>TRACK / RELEASE</b> — missile</div>
      <div><b>BOOST</b> — turbo</div>
    </div>
    <p class="start">PRESS ENTER TO FLY <span>or tap anywhere</span></p>
  </div>
</div>
<div id="count" aria-live="assertive"></div>
<script>
const game=document.getElementById('game');
const glass=document.getElementById('glass');
const count=document.getElementById('count');
let started=false;

function launch(){
  if(started)return;
  started=true;
  game.src='./play.html?gus=1';
  glass.classList.add('hide');
  game.addEventListener('load',()=>{
    let n=3;
    count.textContent=n;
    count.classList.add('show');
    const timer=setInterval(()=>{
      n-=1;
      if(n>0){ count.textContent=n; return; }
      clearInterval(timer);
      count.textContent='FLY';
      setTimeout(()=>{
        count.classList.remove('show');
        game.classList.add('live');
        setTimeout(()=>game.contentWindow?.focus(),50);
      },520);
    },700);
  },{once:true});
}
addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();launch()}});
glass.addEventListener('pointerup',launch);
</script>
</body>
</html>
