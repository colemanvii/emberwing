name: Emberwing One Percent Polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-percent.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one percent pursuit polish
        run: python .github/monk/one-percent.py
      - name: Commit game polish
        run: |
          git config user.name "Emberwing Monk"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m "Polish offscreen pursuit readout"
          git push
