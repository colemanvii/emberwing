name: Emberwing Monk Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emberwing-monk-enemy-fire-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate
        run: python .github/emberwing_monk_patch.py
      - name: Commit feature
        run: |
          git config user.name "Emberwing Monk"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/emberwing_monk_patch.py
          git rm .github/workflows/emberwing-monk-enemy-fire.yml
          git rm .github/workflows/emberwing-monk-enemy-fire-v2.yml
          git add index.html
          git commit -m "Add reciprocal enemy fire and hidden damage"
          git push
