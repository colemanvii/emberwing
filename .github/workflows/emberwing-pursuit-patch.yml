name: Emberwing Pursuit Patch

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/emberwing_pursuit_patch.py
      - .github/workflows/emberwing-pursuit-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply patch
        run: python .github/scripts/emberwing_pursuit_patch.py
      - name: Syntax check game module
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          js=s[start:end]
          lines=js.splitlines()
          lines=[line for line in lines if not line.lstrip().startswith('import ')]
          Path('/tmp/emberwing-check.mjs').write_text('\n'.join(lines))
          PY
          node --check /tmp/emberwing-check.mjs
      - name: Commit game patch
        run: |
          git config user.name "Emberwing Monk"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve high-G pursuit and target guidance"
          git push
