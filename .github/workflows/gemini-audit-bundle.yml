name: Build Gemini Audit Bundle

on:
  push:
    paths:
      - '.github/workflows/gemini-audit-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build bundle
        run: |
          mkdir -p emberwing-gemini-audit
          cp v4.html v3.html index.html beta.html README.md emberwing-gemini-audit/
          printf '%s\n' \
            'EMBERWING GEMINI AUDIT BUNDLE' \
            '' \
            'v4.html = current visual rebuild' \
            'v3.html = stable gameplay reference' \
            'index.html = core/legacy reference' \
            'beta.html = prior wrapper/reference build' \
            'README.md = current controls and design philosophy' \
            '' \
            'Treat these files as source of truth. Do not invent runtime observations.' \
            > emberwing-gemini-audit/AUDIT_README.txt
          zip -r emberwing-gemini-audit.zip emberwing-gemini-audit
      - uses: actions/upload-artifact@v4
        with:
          name: emberwing-gemini-audit
          path: emberwing-gemini-audit.zip
          if-no-files-found: error
          retention-days: 1
