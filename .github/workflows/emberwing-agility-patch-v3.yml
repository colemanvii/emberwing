name: Emberwing Pursuit Control Pass

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emberwing-agility-patch-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pursuit control pass
        run: python .github/monk/agility-patch-v3.py
      - name: Commit game patch
        run: |
          git config user.name "Emberwing Monk"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m "Tune pursuit control and Bandit 3 readability"
          git push
