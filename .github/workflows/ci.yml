name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  level1:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build canonical Level 1
        run: npm run build

      - name: Sync generated files on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- index.html play.html src/level1/game.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html play.html src/level1/game.js
            git commit -m "chore: sync generated Level 1"
            git push
          fi

      - name: Verify generated files are committed on PR
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- index.html play.html src/level1/game.js

      - name: Run fast browser checks
        run: npm test
