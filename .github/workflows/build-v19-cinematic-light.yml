name: Build V19 Cinematic Light

on:
  push:
    paths:
      - 'scripts/build-v19-cinematic-light.mjs'
      - 'scripts/polish-v19-composition.mjs'
      - 'scripts/finalize-v19-light.mjs'
      - 'scripts/smoke-v19.mjs'
      - '.github/workflows/build-v19-cinematic-light.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-smoke-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build V19
        run: node scripts/build-v19-cinematic-light.mjs
      - name: Polish V19 composition
        run: node scripts/polish-v19-composition.mjs
      - name: Finalize V19 lighting
        run: node scripts/finalize-v19-light.mjs
      - name: Install browser smoke-test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve V19 locally
        run: |
          python3 -m http.server 4173 >/tmp/emberwing-http.log 2>&1 &
          sleep 2
      - name: Smoke-test V19
        run: node scripts/smoke-v19.mjs
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: emberwing-v19-cinematic-proof
          path: /tmp/emberwing-v19-desert.png
          retention-days: 1
      - name: Commit verified V19 candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v19.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Stage verified V19 cinematic light candidate'
          git push origin HEAD:main
