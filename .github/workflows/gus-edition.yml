name: Gus Edition browser verification
on:
  push:
    branches:
      - feature/gus-hulk-green-playtest
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gus-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Install PNG decoder for visual verification
        run: npm install --no-save pngjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run actual game in a browser
        run: node scripts/check-gus.cjs && node scripts/check-gus-level2.cjs && node scripts/check-gus-heroes.cjs
      - name: Preserve screenshot for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gus-browser-preview
          path: gus-playtest.png
          if-no-files-found: ignore
