name: Flatten Emberwing V3

on:
  push:
    paths:
      - '.github/workflows/flatten-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build standalone V3
        run: node tools/flatten-v3.mjs

      - name: Commit standalone V3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3.html
          if git diff --cached --quiet; then
            echo "V3 already flattened"
            exit 0
          fi
          git commit -m "Flatten Emberwing V3 into standalone build"
          git push
